<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Entroly verified code intelligence architecture for AI agents</title>
  <desc id="desc">Architecture diagram showing source repositories flowing through AST and Tree-sitter parsing, a typed repository graph, interprocedural flow and architecture analysis, verified context selection, and AI coding agents, with a shared evidence and trust plane for exact source spans, freshness, ambiguity, LSP enrichment, semantic changes, and safe refactoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050713"/><stop offset="1" stop-color="#0b1024"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#9aa7ff"/><stop offset=".55" stop-color="#86d8ff"/><stop offset="1" stop-color="#c79bff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#151b36" stroke-width="1"/>
    </pattern>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .eyebrow{font-size:20px;font-weight:800;letter-spacing:4px;fill:#98a4ff}
      .headline{font-size:58px;font-weight:850;letter-spacing:-2px;fill:url(#titleGrad)}
      .sub{font-size:25px;font-weight:500;fill:#b2bbd4}
      .box-title{font-size:18px;font-weight:850;letter-spacing:1.3px;fill:#070914}
      .box-copy{font-size:19px;font-weight:650;fill:#eef2ff}
      .plane-title{font-size:28px;font-weight:850;fill:#f7f8ff}
      .plane-key{font-size:18px;font-weight:800;fill:#eff2ff}
      .plane-copy{font-size:16px;font-weight:500;fill:#aeb7d3}
      .footer{font-size:18px;font-weight:700;letter-spacing:2.2px;fill:#98a3c8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".65"/>
  <ellipse cx="820" cy="150" rx="580" ry="180" fill="#5148c8" opacity=".10" filter="url(#glow)"/>

  <g class="sans">
    <text x="78" y="62" class="eyebrow">ENTROLY</text>
    <text x="78" y="126" class="headline">Verified Code Intelligence for AI Agents</text>
    <text x="80" y="174" class="sub">From parser-backed source facts to proof-carrying model context.</text>

    <!-- pipeline arrows -->
    <g stroke="#6975aa" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M292 390H324"/><path d="M548 390H580"/><path d="M804 390H836"/><path d="M1060 390H1092"/><path d="M1316 390H1348"/>
    </g>
    <g fill="#6975aa">
      <path d="M324 390l-14-10v20z"/><path d="M580 390l-14-10v20z"/><path d="M836 390l-14-10v20z"/><path d="M1092 390l-14-10v20z"/><path d="M1348 390l-14-10v20z"/>
    </g>

    <!-- six intelligence stages -->
    <g>
      <rect x="66" y="288" width="226" height="204" rx="24" fill="#141a33" stroke="#8fa0ff" stroke-width="3"/>
      <rect x="84" y="308" width="190" height="42" rx="15" fill="#8fa0ff"/><text x="179" y="336" text-anchor="middle" class="box-title">SOURCE REPO</text>
      <text x="179" y="397" text-anchor="middle" class="box-copy">Python · Rust · TS</text><text x="179" y="430" text-anchor="middle" class="box-copy">Go · Java · more</text>

      <rect x="322" y="288" width="226" height="204" rx="24" fill="#141a33" stroke="#84d9ff" stroke-width="3"/>
      <rect x="340" y="308" width="190" height="42" rx="15" fill="#84d9ff"/><text x="435" y="336" text-anchor="middle" class="box-title">AST + PARSERS</text>
      <text x="435" y="397" text-anchor="middle" class="box-copy">Python AST</text><text x="435" y="430" text-anchor="middle" class="box-copy">Tree-sitter registry</text>

      <rect x="578" y="288" width="226" height="204" rx="24" fill="#141a33" stroke="#8ef0c7" stroke-width="3"/>
      <rect x="596" y="308" width="190" height="42" rx="15" fill="#8ef0c7"/><text x="691" y="336" text-anchor="middle" class="box-title">TYPED GRAPH</text>
      <text x="691" y="397" text-anchor="middle" class="box-copy">symbols · calls</text><text x="691" y="430" text-anchor="middle" class="box-copy">imports · impact</text>

      <rect x="834" y="288" width="226" height="204" rx="24" fill="#141a33" stroke="#d3a0ff" stroke-width="3"/>
      <rect x="852" y="308" width="190" height="42" rx="15" fill="#d3a0ff"/><text x="947" y="336" text-anchor="middle" class="box-title">FLOW + ARCH</text>
      <text x="947" y="397" text-anchor="middle" class="box-copy">value flow · SCCs</text><text x="947" y="430" text-anchor="middle" class="box-copy">routes · hotspots</text>

      <rect x="1090" y="288" width="226" height="204" rx="24" fill="#141a33" stroke="#ffca85" stroke-width="3"/>
      <rect x="1108" y="308" width="190" height="42" rx="15" fill="#ffca85"/><text x="1203" y="336" text-anchor="middle" class="box-title">VERIFIED CONTEXT</text>
      <text x="1203" y="397" text-anchor="middle" class="box-copy">fresh spans · budget</text><text x="1203" y="430" text-anchor="middle" class="box-copy">receipts · recovery</text>

      <rect x="1346" y="288" width="188" height="204" rx="24" fill="#141a33" stroke="#ff92b6" stroke-width="3"/>
      <rect x="1364" y="308" width="152" height="42" rx="15" fill="#ff92b6"/><text x="1440" y="336" text-anchor="middle" class="box-title">AI AGENT</text>
      <text x="1440" y="397" text-anchor="middle" class="box-copy">Claude · Codex</text><text x="1440" y="430" text-anchor="middle" class="box-copy">Cursor · MCP</text>
    </g>

    <!-- trust plane -->
    <rect x="106" y="552" width="1388" height="190" rx="30" fill="#0e142c" stroke="#3d4a7b" stroke-width="2"/>
    <text x="142" y="595" class="plane-title">Evidence &amp; Trust Plane</text>
    <g>
      <circle cx="152" cy="645" r="6" fill="#8fa0ff"/><text x="170" y="650" class="plane-key">Exact source spans</text><text x="170" y="677" class="plane-copy">byte ranges + hashes</text>
      <circle cx="372" cy="645" r="6" fill="#84d9ff"/><text x="390" y="650" class="plane-key">Freshness</text><text x="390" y="677" class="plane-copy">stale evidence rejected</text>
      <circle cx="570" cy="645" r="6" fill="#8ef0c7"/><text x="588" y="650" class="plane-key">Ambiguity</text><text x="588" y="677" class="plane-copy">unknown stays unknown</text>
      <circle cx="775" cy="645" r="6" fill="#d3a0ff"/><text x="793" y="650" class="plane-key">LSP enrichment</text><text x="793" y="677" class="plane-copy">verified external ranges</text>
      <circle cx="1008" cy="645" r="6" fill="#ffca85"/><text x="1026" y="650" class="plane-key">Semantic change</text><text x="1026" y="677" class="plane-copy">Git + architecture diffs</text>
      <circle cx="1255" cy="645" r="6" fill="#ff92b6"/><text x="1273" y="650" class="plane-key">Safe refactors</text><text x="1273" y="677" class="plane-copy">plan · hash · apply</text>
    </g>

    <text x="800" y="811" text-anchor="middle" class="footer">LOCAL-FIRST  •  SOURCE-VERIFIED  •  BOUNDED  •  RECOVERABLE  •  TAMPER-EVIDENT</text>
    <text x="80" y="858" class="plane-copy">entroly — code-intelligence control plane + context assurance</text>
  </g>
</svg>

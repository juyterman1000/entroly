# Smithery Configuration File for Entroly
# Enables one-click installation on Smithery.ai for Cursor, Claude Desktop, and Windsurf.

startCommand:
  type: "stdio"
  configSchema:
    type: "object"
    properties:
      DEBUG:
        type: "boolean"
        description: "Enable debug-level logging (all subsystem details to stderr)"
        default: false
  commandFunction: |-
    (config) => {
      const env = {
        ENTROLY_NO_DOCKER: "1",
        ENTROLY_MCP_PASSIVE: "1",
        ENTROLY_MCP_PROFILE: "public"
      };
      if (config.DEBUG) {
        env.ENTROLY_DEBUG = "1";
      }
      return {
        command: "uvx",
        args: ["--from", "entroly", "entroly"],
        env: env
      };
    }

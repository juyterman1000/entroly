[build-system]
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "entroly"
version = "1.0.75"
description = "Drop-in Context Assurance for AI agents: reduce avoidable token usage and AI cost with evidence selection, receipts, exact recovery, and verification."
readme = "PYPI_README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
logo = { file = "docs/assets/logo.png", content-type = "image/png" }
requires-python = ">=3.10"
authors = [
    { name = "entroly", email = "fastrunner10090@gmail.com" },
]
keywords = [
    "ai-agents", "ai-coding-agents", "ai-cost-optimization", "llm-cost-optimization", "reduce-ai-costs",
    "context-assurance", "context-engineering", "context-management", "context-optimization", "context-compression",
    "prompt-compression", "token-optimization", "token-reduction", "context-window", "context-receipts",
    "content-addressed-recovery", "context-control-plane", "llm-proxy", "local-models",
    "mcp", "mcp-server", "model-context-protocol", "github-copilot", "cursor", "claude-code", "codex",
    "openclaw", "hermes-agent", "opencode", "hallucination-detection", "agent-memory", "llm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.28.1,<2",
    "httpx>=0.28.1",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]

[project.urls]
Homepage = "https://juyterman1000.github.io/entroly/docs/index.html"
Documentation = "https://juyterman1000.github.io/entroly/docs/index.html"
Source = "https://github.com/juyterman1000/entroly"
Issues = "https://github.com/juyterman1000/entroly/issues"
"Release Notes" = "https://github.com/juyterman1000/entroly/releases"

[project.optional-dependencies]
# Retained as a compatibility alias for existing install instructions. The
# public proxy/go commands now work from a plain base install.
proxy = [
    "httpx>=0.28.1",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]
native = [
    "entroly-core>=1.0.75,<2",
]
receipt-proof = [
    "cryptography>=42",
]
full = [
    "cryptography>=42",
    "entroly-core>=1.0.75,<2",
    "httpx>=0.28.1",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]
test = [
    "pytest>=9.0.3,<10",
    "pytest-timeout>=2.3,<3",
    "tiktoken>=0.9,<0.14",
]
benchmark = [
    "tiktoken>=0.9,<0.14",
]
neural = [
    "sentence-transformers>=5.6.1,<6",
]
neural-benchmark = [
    "datasets>=4,<6",
    "sentence-transformers>=5.6.1,<6",
]

[project.scripts]
entroly = "entroly.docker_launcher_safe:launch"
entroly-memory = "entroly.memory_cli:main"
entroly-compression-mcp = "entroly.compression_mcp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

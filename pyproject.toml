[build-system]
requires = ["hatchling>=1.27,<1.33"]
build-backend = "hatchling.build"

[project]
name = "entroly"
version = "1.0.79"
description = "Drop-in Context Assurance for AI agents: reduce avoidable token usage and AI cost with evidence selection, receipts, exact recovery, and verification."
readme = "PYPI_README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
logo = { file = "docs/assets/logo.png", content-type = "image/png" }
requires-python = ">=3.10"
authors = [
    { name = "entroly", email = "fastrunner10090@gmail.com" },
]
keywords = [
    "ai-agents", "ai-coding-agents", "ai-cost-optimization", "llm-cost-optimization", "reduce-ai-costs",
    "context-assurance", "context-engineering", "context-management", "context-optimization", "context-compression",
    "prompt-compression", "token-optimization", "token-reduction", "context-window", "context-receipts",
    "content-addressed-recovery", "context-control-plane", "llm-proxy", "local-models",
    "mcp", "mcp-server", "model-context-protocol", "github-copilot", "cursor", "claude-code", "codex",
    "openclaw", "hermes-agent", "opencode", "hallucination-detection", "agent-memory", "llm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.28.1,<2",
    "httpx>=0.28.1",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
    # The native engine is a REQUIRED dependency, not an extra.
    #
    # Query-conditioned selection (QCCR) is gated on the native module: the
    # candidate set comes from `self._rust.export_fragments()`, which has no
    # pure-Python equivalent, so `optimize_context` skips relevance ranking
    # entirely without it (server.py). The measured effect of shipping this as
    # an extra: three unrelated queries -- including a nonsense control --
    # returned a byte-identical selection (23 fragments / 7,588 tokens) and the
    # same "76.29% saved", because the reported figure is baseline-minus-budget
    # arithmetic and nothing depended on the query. Every accuracy benchmark in
    # this repo (needle/longbench/squad/bfcl/mmlu/gsm8k/truthfulqa) measures the
    # QCCR path, so an install without it does not run the code that was
    # benchmarked.
    #
    # `pip install entroly` is the command in the README, the quickstart, and
    # every integration doc. It must produce the engine those docs describe.
    # abi3 wheels are published for macOS universal2, glibc+musl Linux
    # x86_64/aarch64, and Windows x64; the pure-Python fallback remains for any
    # platform without a wheel.
    "entroly-core>=1.0.79,<2",
]

[project.urls]
Homepage = "https://juyterman1000.github.io/entroly/docs/index.html"
Documentation = "https://juyterman1000.github.io/entroly/docs/index.html"
Source = "https://github.com/juyterman1000/entroly"
Issues = "https://github.com/juyterman1000/entroly/issues"
"Release Notes" = "https://github.com/juyterman1000/entroly/releases"

[project.optional-dependencies]
# Retained as a compatibility alias for existing install instructions. The
# public proxy/go commands now work from a plain base install.
proxy = [
    "httpx>=0.28.1",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]
# Retained as a compatibility alias for existing install instructions. The
# native engine now ships with the base install, so `entroly[native]` and a
# plain `entroly` resolve to the same thing.
native = [
    "entroly-core>=1.0.79,<2",
]
receipt-proof = [
    "cryptography>=42",
]
code-intelligence = [
    "tree-sitter-language-pack>=1.14.3,<2",
]
images = [
    "Pillow>=10,<13",
]
full = [
    "cryptography>=42",
    "entroly-core>=1.0.79,<2",
    "httpx>=0.28.1",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
    "tree-sitter-language-pack>=1.14.3,<2",
]
test = [
    "pytest>=9.0.3,<10",
    "pytest-timeout>=2.3,<3",
    "tiktoken>=0.9,<0.14",
]
benchmark = [
    "tiktoken>=0.9,<0.14",
]
neural = [
    "sentence-transformers>=5.6.1,<6",
]
neural-benchmark = [
    "datasets>=4,<6",
    "sentence-transformers>=5.6.1,<6",
]

[project.scripts]
entroly = "entroly.docker_launcher_safe:launch"
entroly-memory = "entroly.memory_cli:main"
entroly-compression-mcp = "entroly.compression_mcp:main"
entroly-repository-mcp = "entroly.repository_intelligence.mcp:main"
entroly-work = "entroly.work_graph_cli:main"
entroly-work-graph-mcp = "entroly.work_graph_mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

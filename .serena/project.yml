project_name: "entroly"

# Entroly is a polyglot repository. Python is the control plane, Rust is the
# native engine, and TypeScript/JavaScript covers integrations and Node/WASM.
languages:
  - python
  - rust
  - typescript

encoding: "utf-8"
line_ending: "lf"
language_backend: "LSP"
ignore_all_files_in_gitignore: true

# TypeScript language servers can use these workspaces for cross-package
# symbol and reference discovery.
additional_workspace_folders:
  - "entroly-wasm"
  - "integrations/openclaw"

ignored_paths:
  - ".git/**"
  - ".github/actions-runner/**"
  - ".venv/**"
  - "venv/**"
  - "node_modules/**"
  - "target/**"
  - "dist/**"
  - "build/**"
  - ".pytest_cache/**"
  - ".mypy_cache/**"
  - ".ruff_cache/**"
  - ".entroly/**"
  - "benchmarks/results/**"

read_only: false
excluded_tools: []
included_optional_tools: []
fixed_tools: []
default_modes: []
added_modes: []
symbol_info_budget: 12.0
read_only_memory_patterns: []
ignored_memory_patterns: []

initial_prompt: >-
  Entroly is a local-first Context Assurance layer and Context OS for AI
  agents. Treat Python and Rust behavior as one product contract: budgeted
  evidence selection, Context Receipts, exact content-addressed recovery,
  verification, and conservative savings accounting must remain aligned.
  Never count a retrieval miss or omitted answer-critical evidence as useful
  token savings. Prefer focused changes, deterministic behavior, explicit
  migration rules, and parity tests across the native Rust engine and the
  supported pure-Python fallback. Before changing model metadata, verify model
  IDs, context windows, output limits, pricing, and availability against the
  provider's official documentation. Run focused tests first, then Ruff, Rust
  tests, Clippy, native integration, pure-Python fallback, and the supported
  Python matrix before calling a change complete.

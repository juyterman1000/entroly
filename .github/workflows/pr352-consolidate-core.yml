name: PR352 Consolidate Core Product Work

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/consolidate_pr352_core.py
      - .github/workflows/pr352-consolidate-core.yml

permissions:
  contents: write

concurrency:
  group: pr352-consolidate-core
  cancel-in-progress: false

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: integration/workgraph-production-20260817

      - name: Ensure this is the latest integration head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/workgraph-production-20260817
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/integration/workgraph-production-20260817)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply guarded consolidation transform
        shell: bash
        run: |
          set -euo pipefail
          python scripts/consolidate_pr352_core.py

          # Correct only the exact promotion seams proven by the previous
          # compiler run. Every replacement is count-guarded so branch drift
          # fails closed instead of silently rewriting different code.
          python - <<'PY'
          from pathlib import Path

          p = Path("entroly-engine/src/coordination_index.rs")
          text = p.read_text(encoding="utf-8")

          for old, new, expected in (
              ("for path in &lease.paths {", "for path in lease.paths {", 2),
              ("for symbol in &lease.symbols {", "for symbol in lease.symbols {", 2),
              (".map(|index| LeaseScope {", ".map(|index| TestLeaseScope {", 1),
          ):
              found = text.count(old)
              if found != expected:
                  raise SystemExit(
                      f"coordination compiler-fix anchor changed: {old!r}: {found} != {expected}"
                  )
              text = text.replace(old, new)

          old = "        assert_eq!(candidate_pairs(&borrowed_scopes(&leases)), naive_pairs(&leases));"
          new = """        assert_eq!(
                      candidate_pairs(&borrowed_scopes(&leases)),
                      naive_pairs(&leases)
                  );"""
          if text.count(old) != 2:
              raise SystemExit(f"coordination formatting anchor count changed: {text.count(old)}")
          p.write_text(text.replace(old, new), encoding="utf-8")

          # The #353 product constructor takes nine arguments. Its TooManyItems
          # regression test was ported with one stale empty-vector argument.
          p = Path("entroly-engine/src/engine_contracts.rs")
          text = p.read_text(encoding="utf-8")
          old = """            too_many,
                      vec![],
                      vec![],
                      1,"""
          new = """            too_many,
                      vec![],
                      1,"""
          if text.count(old) != 1:
              raise SystemExit(
                  f"engine contract regression-test anchor changed: {text.count(old)}"
              )
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          p = Path("entroly-engine/src/work_graph.rs")
          text = p.read_text(encoding="utf-8")
          imp = "use crate::coordination_index::{candidate_pairs, CoordinationScope};\n"
          if text.count(imp) != 1:
              raise SystemExit("coordination import anchor changed")
          text = text.replace(imp, "", 1)
          anchor = "use serde::{Deserialize, Serialize};\n"
          if text.count(anchor) != 1:
              raise SystemExit("serde import anchor changed")
          p.write_text(text.replace(anchor, imp + anchor, 1), encoding="utf-8")
          PY

          git diff --check

          expected="$(printf '%s\n' \
            entroly/config.py \
            entroly/engine.py \
            entroly/data/tuning_defaults.json \
            entroly-core/src/lib.rs \
            entroly-wasm/src/lib.rs \
            entroly-wasm/data/tuning_defaults.json \
            entroly-engine/src/coordination_index.rs \
            entroly-engine/src/engine_contracts.rs \
            entroly-engine/src/lib.rs \
            entroly-engine/src/work_graph.rs \
            tests/test_deterministic_exploration_defaults.py | sort)"
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          test "$actual" = "$expected" || {
            echo "Unexpected consolidation diff"
            echo "Expected:"; printf '%s\n' "$expected"
            echo "Actual:"; printf '%s\n' "$actual"
            exit 1
          }

      - name: Check formatting of promoted coordination module
        shell: bash
        run: |
          set -euo pipefail
          # work_graph.rs and engine_contracts.rs contain known pre-existing
          # rustfmt debt outside these narrow fixes. Enforce rustfmt on the new
          # production module; compile/clippy validate the integration wiring.
          rustfmt --edition 2021 --check entroly-engine/src/coordination_index.rs
          git diff --check

      - name: Prove coordination equivalence and engine quality
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path entroly-engine/Cargo.toml --lib
          cargo test --manifest-path entroly-engine/Cargo.toml --lib --features python
          cargo clippy --manifest-path entroly-engine/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path entroly-engine/Cargo.toml --all-targets --features python -- -D warnings

      - name: Check binding crates compile against the same engine
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path entroly-core/Cargo.toml --all-targets
          cargo check --manifest-path entroly-wasm/Cargo.toml --all-targets

      - name: Prove deterministic public defaults
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q tests/test_deterministic_exploration_defaults.py tests/test_tuning_config_wiring.py

      - name: Commit validated product diff to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add \
            entroly/config.py \
            entroly/engine.py \
            entroly/data/tuning_defaults.json \
            entroly-core/src/lib.rs \
            entroly-wasm/src/lib.rs \
            entroly-wasm/data/tuning_defaults.json \
            entroly-engine/src/coordination_index.rs \
            entroly-engine/src/engine_contracts.rs \
            entroly-engine/src/lib.rs \
            entroly-engine/src/work_graph.rs \
            tests/test_deterministic_exploration_defaults.py
          git diff --cached --check
          git diff --cached --quiet && {
            echo "No product diff produced"
            exit 1
          }
          git commit -m 'fix(engine): deterministic defaults and indexed coordination'
          git push origin HEAD:integration/workgraph-production-20260817

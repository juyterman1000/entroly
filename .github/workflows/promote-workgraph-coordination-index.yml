name: Promote Work Graph Coordination Index

on:
  push:
    branches:
      - audit/workgraph-coordination-index-20260817
    paths:
      - .github/coordination-index.trigger

permissions:
  contents: write

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ai-work-graph-v1
          fetch-depth: 0

      - name: Require passive dedupe and capture race guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'fn passive_repository_snapshot_fingerprint' entroly-engine/src/work_graph.rs
          grep -q '^#\[cfg(test)\]$' entroly-engine/src/lib.rs
          grep -q '^mod coordination_index;$' entroly-engine/src/lib.rs
          grep -q 'fn indexed_pairs' entroly-engine/src/coordination_index.rs
          git rev-parse HEAD > /tmp/workgraph-coordination-start-head

      - name: Promote candidate index without changing overlap semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module = Path('entroly-engine/src/coordination_index.rs')
          text = module.read_text(encoding='utf-8')

          old_header = '''#[derive(Debug, Clone)]
          struct LeaseScope {
              agent: String,
              paths: Vec<String>,
              symbols: Vec<String>,
          }
          '''
          new_header = '''#[derive(Debug, Clone, Copy)]
          pub(crate) struct CoordinationScope<'a> {
              pub(crate) agent: &'a str,
              pub(crate) paths: &'a [String],
              pub(crate) symbols: &'a [String],
          }
          '''
          if old_header not in text:
              raise SystemExit('coordination scope anchor changed; refusing promotion')
          text = text.replace(old_header, new_header, 1)

          old_fn = 'fn indexed_pairs(leases: &[LeaseScope]) -> BTreeSet<(usize, usize)> {'
          new_fn = "pub(crate) fn candidate_pairs(leases: &[CoordinationScope<'_>]) -> BTreeSet<(usize, usize)> {"
          if old_fn not in text:
              raise SystemExit('indexed_pairs anchor changed; refusing promotion')
          text = text.replace(old_fn, new_fn, 1)

          # The naive oracle and its owned test fixture stay test-only. Replace
          # only the pre-test helper region; tests below are rewritten to adapt
          # owned fixtures into borrowed production scopes.
          text = text.replace(
              'fn scopes_overlap(left: &LeaseScope, right: &LeaseScope) -> bool {',
              '#[cfg(test)]\nfn scopes_overlap(left: &TestLeaseScope, right: &TestLeaseScope) -> bool {',
              1,
          )
          text = text.replace(
              'fn naive_pairs(leases: &[LeaseScope]) -> BTreeSet<(usize, usize)> {',
              '#[cfg(test)]\nfn naive_pairs(leases: &[TestLeaseScope]) -> BTreeSet<(usize, usize)> {',
              1,
          )

          test_anchor = '#[cfg(test)]\nmod tests {'
          if test_anchor not in text:
              raise SystemExit('coordination test anchor changed; refusing promotion')
          test_support = '''#[cfg(test)]
          #[derive(Debug, Clone)]
          struct TestLeaseScope {
              agent: String,
              paths: Vec<String>,
              symbols: Vec<String>,
          }

          #[cfg(test)]
          fn borrowed_scopes(leases: &[TestLeaseScope]) -> Vec<CoordinationScope<'_>> {
              leases
                  .iter()
                  .map(|lease| CoordinationScope {
                      agent: &lease.agent,
                      paths: &lease.paths,
                      symbols: &lease.symbols,
                  })
                  .collect()
          }

          '''
          text = text.replace(test_anchor, test_support + test_anchor, 1)
          text = text.replace('-> LeaseScope {', '-> TestLeaseScope {')
          text = text.replace('        LeaseScope {', '        TestLeaseScope {')
          text = text.replace('            LeaseScope {', '            TestLeaseScope {')
          text = text.replace('                LeaseScope {', '                TestLeaseScope {')
          text = text.replace('indexed_pairs(&leases)', 'candidate_pairs(&borrowed_scopes(&leases))')
          module.write_text(text, encoding='utf-8')

          lib = Path('entroly-engine/src/lib.rs')
          lib_text = lib.read_text(encoding='utf-8')
          old_lib = '''pub mod work_graph;

          #[cfg(test)]
          mod coordination_index;
          '''
          new_lib = '''pub mod work_graph;

          mod coordination_index;
          '''
          if old_lib not in lib_text:
              raise SystemExit('lib coordination module anchor changed; refusing promotion')
          lib.write_text(lib_text.replace(old_lib, new_lib, 1), encoding='utf-8')

          graph = Path('entroly-engine/src/work_graph.rs')
          graph_text = graph.read_text(encoding='utf-8')
          use_anchor = 'use std::fmt;\n'
          if use_anchor not in graph_text:
              raise SystemExit('work_graph use anchor changed; refusing promotion')
          graph_text = graph_text.replace(
              use_anchor,
              use_anchor + 'use crate::coordination_index::{candidate_pairs, CoordinationScope};\n',
              1,
          )

          old_loop = '''        let mut conflicts = Vec::new();
                  for i in 0..leases.len() {
                      for j in (i + 1)..leases.len() {
                          let a = &leases[i];
                          let b = &leases[j];
                          if a.agent == b.agent || a.expires <= now_ms || b.expires <= now_ms {
                              continue;
                          }
                          let overlapping_paths = overlap_paths(&a.paths, &b.paths);
                          let overlapping_symbols = overlap_exact(&a.symbols, &b.symbols);
                          if overlapping_paths.is_empty() && overlapping_symbols.is_empty() {
                              continue;
                          }
                          conflicts.push(CoordinationConflict {
                              lease_a: a.id.clone(),
                              lease_b: b.id.clone(),
                              agent_a: a.agent.clone(),
                              agent_b: b.agent.clone(),
                              task_a: a.task.clone(),
                              task_b: b.task.clone(),
                              overlapping_paths,
                              overlapping_symbols,
                              reason: "active advisory work scopes overlap".to_string(),
                          });
                      }
                  }
          '''
          new_loop = '''        let scopes: Vec<CoordinationScope<'_>> = leases
                      .iter()
                      .map(|lease| CoordinationScope {
                          agent: &lease.agent,
                          paths: &lease.paths,
                          symbols: &lease.symbols,
                      })
                      .collect();
                  let mut conflicts = Vec::new();
                  for (i, j) in candidate_pairs(&scopes) {
                      let a = &leases[i];
                      let b = &leases[j];
                      // Candidate generation is only a performance filter. Keep
                      // the pre-existing exact overlap functions authoritative so
                      // coordination semantics cannot drift with the index.
                      if a.agent == b.agent || a.expires <= now_ms || b.expires <= now_ms {
                          continue;
                      }
                      let overlapping_paths = overlap_paths(&a.paths, &b.paths);
                      let overlapping_symbols = overlap_exact(&a.symbols, &b.symbols);
                      if overlapping_paths.is_empty() && overlapping_symbols.is_empty() {
                          continue;
                      }
                      conflicts.push(CoordinationConflict {
                          lease_a: a.id.clone(),
                          lease_b: b.id.clone(),
                          agent_a: a.agent.clone(),
                          agent_b: b.agent.clone(),
                          task_a: a.task.clone(),
                          task_b: b.task.clone(),
                          overlapping_paths,
                          overlapping_symbols,
                          reason: "active advisory work scopes overlap".to_string(),
                      });
                  }
          '''
          if old_loop not in graph_text:
              raise SystemExit('coordination production loop anchor changed; refusing promotion')
          graph.write_text(graph_text.replace(old_loop, new_loop, 1), encoding='utf-8')
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate exact semantic equivalence and compile quality
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path entroly-engine/Cargo.toml
          cargo test --manifest-path entroly-engine/Cargo.toml --lib
          cargo clippy --manifest-path entroly-engine/Cargo.toml --all-targets -- -D warnings
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            entroly-engine/src/coordination_index.rs \
            entroly-engine/src/lib.rs \
            entroly-engine/src/work_graph.rs | sort)"

      - name: Refuse branch races and push validated product commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/ai-work-graph-v1
          test "$(cat /tmp/workgraph-coordination-start-head)" = "$(git rev-parse origin/feat/ai-work-graph-v1)"
          grep -q 'fn passive_repository_snapshot_fingerprint' entroly-engine/src/work_graph.rs
          git config user.name "entroly-workgraph-bot"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git add entroly-engine/src/coordination_index.rs entroly-engine/src/lib.rs entroly-engine/src/work_graph.rs
          git commit -m "perf(work-graph): index advisory lease conflict candidates"
          git push origin HEAD:feat/ai-work-graph-v1

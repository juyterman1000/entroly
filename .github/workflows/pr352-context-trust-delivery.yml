name: PR352 Context Trust Delivery Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr352-context-trust-delivery-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'integration/workgraph-production-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/workgraph-production-20260817
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify exact branch head has not raced
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/integration/workgraph-production-20260817)"

      - name: Apply guarded Context and Trust delivery integration
        shell: bash
        run: |
          python scripts/pr352_fix_eicv_wasm_clock.py
          python scripts/pr352_integrate_context_trust_delivery.py
          python scripts/pr352_fix_context_delivery_fixture.py

      - name: Format and validate changed Rust
        shell: bash
        run: |
          rustfmt --edition 2021 \
            entroly-engine/src/eicv.rs \
            entroly-engine/src/work_graph.rs \
            entroly-engine/src/trust_engine.rs \
            entroly-core/src/work_graph_bindings.rs \
            entroly-core/src/trust_engine_bindings.rs \
            entroly-core/src/lib.rs \
            entroly-wasm/src/work_graph_bindings.rs \
            entroly-wasm/src/trust_engine_bindings.rs \
            entroly-wasm/src/lib.rs
          rustfmt --edition 2021 --check \
            entroly-engine/src/eicv.rs \
            entroly-engine/src/work_graph.rs \
            entroly-engine/src/trust_engine.rs \
            entroly-core/src/work_graph_bindings.rs \
            entroly-core/src/trust_engine_bindings.rs \
            entroly-core/src/lib.rs \
            entroly-wasm/src/work_graph_bindings.rs \
            entroly-wasm/src/trust_engine_bindings.rs \
            entroly-wasm/src/lib.rs

      - name: Full Rust semantic and binding gates
        shell: bash
        run: |
          cargo test --manifest-path entroly-engine/Cargo.toml
          cargo test --manifest-path entroly-engine/Cargo.toml --features python
          cargo clippy --manifest-path entroly-engine/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path entroly-engine/Cargo.toml --features python --all-targets -- -D warnings
          cargo check --manifest-path entroly-core/Cargo.toml --all-targets
          cargo check --manifest-path entroly-wasm/Cargo.toml --all-targets
          cargo check --manifest-path entroly-wasm/Cargo.toml --target wasm32-unknown-unknown

      - name: Build PyO3 and run Python delivery tests
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest --timeout 120 --retries 5
          (cd entroly-core && ../.venv/bin/maturin develop --release)
          shopt -s nullglob
          work_graph_tests=(tests/test_work_graph_*.py)
          if (( ${#work_graph_tests[@]} == 0 )); then
            echo 'No Work Graph Python tests discovered; refusing a vacuous delivery gate.' >&2
            exit 1
          fi
          printf 'Discovered %d Work Graph Python test files\n' "${#work_graph_tests[@]}"
          printf '  %s\n' "${work_graph_tests[@]}"
          PYTHONPATH=. .venv/bin/pytest \
            tests/test_context_trust_delivery.py \
            "${work_graph_tests[@]}" \
            -q

      - name: Install wasm-pack
        shell: bash
        run: |
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Build and test npm delivery surface
        working-directory: entroly-wasm
        run: npm test

      - name: Cross-runtime Trust parity
        shell: bash
        run: |
          PYTHONPATH=. .venv/bin/python - <<'PY' > /tmp/python-trust.json
          import json
          from entroly.trust import TrustEngine
          evidence = 'The service retries a request three times before returning an error.'
          claim = 'The service retries a request three times.'
          print(json.dumps(TrustEngine('rag').assess_claim(evidence, claim), sort_keys=True, separators=(',', ':')))
          PY
          node - <<'JS' > /tmp/node-trust.json
          const { TrustEngine } = require('./entroly-wasm');
          const evidence = 'The service retries a request three times before returning an error.';
          const claim = 'The service retries a request three times.';
          const value = new TrustEngine('rag').assessClaim(evidence, claim);
          const ordered = Object.fromEntries(Object.keys(value).sort().map(k => [k, value[k]]));
          process.stdout.write(JSON.stringify(ordered));
          JS
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          python_value = json.loads(Path('/tmp/python-trust.json').read_text(encoding='utf-8'))
          node_value = json.loads(Path('/tmp/node-trust.json').read_text(encoding='utf-8'))
          assert python_value == node_value, {
              'python': python_value,
              'node': node_value,
          }
          assert python_value['status'] == node_value['status']
          assert python_value['evidence_commitment'] == node_value['evidence_commitment']
          print('Cross-runtime Trust semantic parity: PASS')
          PY

      - name: Regenerate and prove ownership convergence
        shell: bash
        run: |
          python scripts/ownership_matrix.py
          python scripts/ownership_matrix.py --check
          python - <<'PY'
          from scripts import ownership_matrix as matrix
          rows = {row.path: row for row in matrix.build_rows()}
          for path in (
              'entroly-engine/src/engine_contracts.rs',
              'entroly-engine/src/trust_engine.rs',
          ):
              row = rows[path]
              assert row.migration_status == 'canonical', (path, row)
              assert row.python_surface == 'entroly-core', (path, row)
              assert row.wasm_node_surface == 'entroly-wasm', (path, row)
          print('Context/Trust semantic owners are reachable from both delivery runtimes')
          PY
          PYTHONPATH=. .venv/bin/pytest tests/test_ownership_matrix.py tests/test_docs_code_sync.py -q

      - name: Commit validated product integration
        shell: bash
        run: |
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add \
            entroly-engine/src/eicv.rs \
            entroly-engine/src/work_graph.rs \
            entroly-engine/src/trust_engine.rs \
            entroly-core/src/work_graph_bindings.rs \
            entroly-core/src/trust_engine_bindings.rs \
            entroly-core/src/lib.rs \
            entroly-wasm/src/work_graph_bindings.rs \
            entroly-wasm/src/trust_engine_bindings.rs \
            entroly-wasm/src/lib.rs \
            entroly/work_graph.py \
            entroly/trust.py \
            entroly/__init__.py \
            entroly-wasm/js/work_graph.js \
            entroly-wasm/js/work_graph.d.ts \
            entroly-wasm/js/trust_engine.js \
            entroly-wasm/js/trust_engine.d.ts \
            entroly-wasm/index.js \
            entroly-wasm/index.d.ts \
            entroly-wasm/package.json \
            entroly-wasm/test_context_trust_delivery.js \
            tests/test_context_trust_delivery.py \
            docs/OWNERSHIP_MATRIX.md
          if git diff --cached --quiet; then
            echo 'Context/Trust integration already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'feat(engine): ship Context and Trust Rust seams across runtimes'
          git push origin HEAD:integration/workgraph-production-20260817

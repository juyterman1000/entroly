name: Repair PR 222 daemon version target

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 222 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/docker-quality-gate-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: fix/docker-quality-gate-convergence
          fetch-depth: 0

      - name: Patch only the stale daemon version literal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('entroly/daemon.py')
          text = path.read_text(encoding='utf-8')
          old = '    version: str = "1.0.67"\n'
          new = '    version: str = "1.0.68"\n'

          if new in text and old not in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit('refusing repair: stale daemon version literal is not unique')

          updated = text.replace(old, new, 1)
          if updated.count(new) != 1 or old in updated:
              raise SystemExit('refusing repair: postcondition failed')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit exact repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entroly/daemon.py
          if git diff --cached --quiet; then
            echo 'Daemon version already synchronized.'
            exit 0
          fi
          git commit -m 'fix(release): synchronize daemon version to 1.0.68'
          git push origin HEAD:fix/docker-quality-gate-convergence

name: QCCR Dependency Evidence Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-head-regression:
    if: github.head_ref == 'diagnostic/qccr-rendering-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact head identity
        run: test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Create test environment
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin ruff --timeout 120 --retries 5
          .venv/bin/pip install -e '.[test]' --timeout 120 --retries 5

      - name: Rust format and QCCR unit tests
        run: |
          cargo fmt --manifest-path entroly-qccr/Cargo.toml -- --check
          cargo test --manifest-path entroly-qccr/Cargo.toml

      - name: Build exact-head native QCCR
        run: |
          cd entroly-core
          ../.venv/bin/maturin develop --release

      - name: Require five of five defining files and complete signatures
        run: |
          .venv/bin/python - <<'PY'
          import ast
          import json
          from benchmarks.answer_correctness_bridge import build_probes, _context_for
          from benchmarks.graph_lane_quality import REPO, Task, _pool_for, _read, _tokens, _tracked_python_files

          LIMIT, BUDGET, SEED = 5, 2000, 20260807
          payload = json.loads((REPO / 'benchmarks/results/graph_lane_tasks.json').read_text(encoding='utf-8'))
          probes = build_probes([Task(**row) for row in payload['tasks']], LIMIT)
          corpus = sorted({str(path.relative_to(REPO)).replace('\\', '/') for path in _tracked_python_files()})

          def signature_lines(callee, rel):
              source = (REPO / rel).read_text(encoding='utf-8', errors='replace')
              lines = source.splitlines()
              tree = ast.parse(source)
              target = None
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == callee:
                      target = node
                      break
                  if isinstance(node, ast.ClassDef) and node.name == callee:
                      target = next((sub for sub in node.body if isinstance(sub, (ast.FunctionDef, ast.AsyncFunctionDef)) and sub.name == '__init__'), None)
                      break
              if target is None:
                  raise RuntimeError((callee, rel))
              body_line = target.body[0].lineno if target.body else target.end_lineno
              return tuple(
                  line.strip()
                  for line in lines[target.lineno - 1:max(target.lineno, body_line - 1)]
                  if line.strip()
              )

          full = delivered = 0
          for idx, probe in enumerate(probes, 1):
              pool = _pool_for(probe.task, corpus, 48, SEED)
              texts = {rel: _read(rel) for rel in pool}
              context = _context_for('qccr', probe, pool, texts, BUDGET)
              signature = signature_lines(probe.task.callee, probe.task.callee_file)
              file_delivered = f'### {probe.task.callee_file}' in context
              full_signature = all(line in context for line in signature)
              delivered += int(file_delivered)
              full += int(full_signature)
              print(
                  'EXACT_HEAD_PROBE', idx,
                  f'callee={probe.task.callee!r}',
                  f'file_delivered={file_delivered}',
                  f'full_signature_present={full_signature}',
                  f'gold_presence={tuple((param, param in context) for param in probe.params)!r}',
                  f'context_tokens={_tokens(context)}',
              )

          print(f'EXACT_HEAD_SUMMARY full_signatures={full}/5 defining_files_delivered={delivered}/5')
          if (full, delivered) != (5, 5):
              raise SystemExit(f'exact-head structural acceptance failed: full={full}/5 delivered={delivered}/5')
          PY

      - name: Require 20 of 20 clean graph delivery
        run: |
          .venv/bin/python benchmarks/graph_lane_quality.py run --budgets 2000 --limit 20
          .venv/bin/python - <<'PY'
          import json
          data = json.load(open('benchmarks/results/graph_lane_results.json', encoding='utf-8'))
          rows = [row for row in data['records'] if row['arm'] == 'qccr' and row['budget'] == 2000]
          hits = sum(bool(row['indirect_hit']) for row in rows)
          errors = sum(bool(row['error']) for row in rows)
          print(f'EXACT_HEAD_QCCR_INDIRECT hits={hits}/{len(rows)} recall={hits/len(rows):.6f} errors={errors}')
          if (hits, len(rows), errors) != (20, 20, 0):
              raise SystemExit(f'exact-head graph acceptance failed: hits={hits}/{len(rows)} errors={errors}')
          PY

      - name: Targeted regression tests
        run: .venv/bin/python -m pytest tests/ -q -k 'qccr or resolution or codec or compress' --timeout=180

      - name: Ruff and external-name policy
        run: |
          .venv/bin/ruff check entroly/ benchmarks/
          .venv/bin/python scripts/check_external_name_policy.py

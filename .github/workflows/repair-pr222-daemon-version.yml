name: Repair PR 222 daemon version

# Second push intentionally triggers this already-present one-shot repair workflow.
on:
  push:
    branches:
      - fix/docker-quality-gate-convergence
    paths:
      - '.github/workflows/repair-pr222-daemon-version.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'juyterman1000/entroly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: fix/docker-quality-gate-convergence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Repair daemon release surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('entroly/daemon.py')
          text = path.read_text(encoding='utf-8')
          old = '    version: str = "1.0.67"\n'
          new = '    version: str = "1.0.68"\n'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('expected exactly one stale daemon version surface')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          final = path.read_text(encoding='utf-8')
          assert final.count(new) == 1
          assert old not in final
          PY

      - name: Verify release surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests/test_release_version_sync.py -q

      - name: Commit repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entroly/daemon.py
          if git diff --cached --quiet; then
            echo 'Daemon version is already synchronized.'
            exit 0
          fi
          git commit -m 'fix(release): synchronize daemon version to 1.0.68'
          git push origin HEAD:fix/docker-quality-gate-convergence

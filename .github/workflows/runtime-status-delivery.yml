name: Validate Runtime Status Delivery

on:
  pull_request:
    branches:
      - feat/production-grade-defaults
    paths:
      - server.json
      - .github/patches/runtime-status.patch.gz
      - .github/workflows/runtime-status-delivery.yml

permissions:
  contents: read

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'ops/production-grade-runtime-status'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify ancestry and exact patch
        shell: bash
        run: |
          set -euo pipefail
          expected_base='99c645af0850aa560a6e38363a312ec2a4cb8289'
          git merge-base --is-ancestor "$expected_base" HEAD
          test -f entroly/runtime_capabilities.py
          gzip --test .github/patches/runtime-status.patch.gz
          gzip --decompress --stdout .github/patches/runtime-status.patch.gz > /tmp/runtime-status.patch
          echo 'd766a1146ca0787bd46482227303bc391ee7ca834f1957dfed7c346df28fc336  /tmp/runtime-status.patch' | sha256sum --check --strict
          git apply --check /tmp/runtime-status.patch
          git apply /tmp/runtime-status.patch
          git diff --check

      - name: Install patched package
        run: python -m pip install -e '.[test]'

      - name: Validate machine-readable local status
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q entroly/runtime_status.py entroly/cli.py tests/test_runtime_status.py
          python -m pytest -q \
            tests/test_runtime_status.py \
            tests/test_runtime_capabilities.py \
            tests/test_cli_audit.py \
            tests/test_public_surface_dogfood.py \
            tests/test_release_surface.py
          python -m entroly.cli status --json > /tmp/entroly-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/entroly-status.json').read_text())
          assert report['schema_version'] == 'entroly.runtime-status.v1'
          assert report['claims']['provider_connectivity_verified'] is False
          assert report['claims']['production_readiness_implied'] is False
          assert set(report['services']) == {'proxy', 'dashboard'}
          PY
          if python -m entroly.cli status --json --require-running >/tmp/required-status.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('/tmp/required-status.json').read_text())['healthy'] is True
          PY
          else
            python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('/tmp/required-status.json').read_text())['healthy'] is False
          PY
          fi

      - name: Replay validated product commit onto latest feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add entroly/cli.py entroly/runtime_status.py tests/test_runtime_status.py
          git commit -m 'feat(cli): expose automation-safe local runtime status'
          validated_commit="$(git rev-parse HEAD)"
          git format-patch -1 --stdout "$validated_commit" > /tmp/validated-runtime-status.patch
          git fetch origin feat/production-grade-defaults
          git switch --force-create validated-delivery origin/feat/production-grade-defaults
          git am /tmp/validated-runtime-status.patch
          git push origin HEAD:feat/production-grade-defaults

name: Zero Bug Convergence

on:
  push:
    branches: [dogfood/zero-bug-convergence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-bug-convergence-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_RETRIES: 10
  PIP_TIMEOUT: 120
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
  ENTROLY_DISABLE_UPDATE_CHECK: "1"
  ENTROLY_NO_DOCKER: "1"
  PYTHONUTF8: "1"

jobs:
  static-release-contracts:
    name: Static, release, and trust contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install static and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]" ruff==0.12.9 pytest-timeout psutil

      - name: Compile and lint trusted surfaces
        run: |
          python -m compileall -q entroly tests scripts benchmarks examples
          ruff check entroly tests/test_*dogfood.py tests/test_mcp_protocol.py tests/test_memory_launcher.py
          git diff --check

      - name: Verify public trust and release consistency
        run: |
          python scripts/verify_public_trust.py
          python scripts/verify_readme.py
          python -m pytest -q -vv --tb=short --timeout=120 \
            tests/test_public_trust.py \
            tests/test_release_surface.py \
            tests/test_release_surface_consistency.py \
            tests/test_mcp_registry_manifest.py \
            tests/test_no_assertionless_tests.py

  native-full-suite:
    name: Native full suite / Python ${{ matrix.python-version }} / seed ${{ matrix.hash-seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            hash-seed: "1"
          - python-version: "3.12"
            hash-seed: "7"
          - python-version: "3.14"
            hash-seed: "42"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Build native engine and install package
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install maturin --timeout 120 --retries 5
          cd entroly-core
          ../.venv/bin/maturin develop --release
          cd ..
          .venv/bin/pip install --timeout 120 --retries 5 -e . \
            "mcp>=1.6.0" "httpx>=0.27" "starlette>=0.37" \
            "uvicorn>=0.30" psutil pytest pytest-timeout

      - name: Verify installed runtime identity
        run: |
          .venv/bin/python -c "import entroly, entroly_core; print(entroly.__version__, entroly_core.__file__)"
          .venv/bin/entroly --version

      - name: Run functional and production journeys
        env:
          PYTHONHASHSEED: ${{ matrix.hash-seed }}
        run: |
          .venv/bin/python tests/functional_test.py
          .venv/bin/python tests/test_production_e2e.py

      - name: Run complete native Python suite
        env:
          PYTHONHASHSEED: ${{ matrix.hash-seed }}
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/native-py${{ matrix.python-version }}-seed${{ matrix.hash-seed }}.log"
          .venv/bin/pytest tests/ -vv --tb=short --timeout=60 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/native.status"
          exit 0

      - name: Upload native-suite evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zero-bug-native-py${{ matrix.python-version }}-seed${{ matrix.hash-seed }}
          path: |
            ${{ runner.temp }}/native-py${{ matrix.python-version }}-seed${{ matrix.hash-seed }}.log
            ${{ runner.temp }}/native.status
          if-no-files-found: error

      - name: Enforce native suite
        run: test "$(cat "$RUNNER_TEMP/native.status")" -eq 0

      - name: Run native integration and brutal tests
        run: |
          .venv/bin/python entroly-core/tests/test_integration.py
          .venv/bin/python entroly-core/tests/test_brutal.py

  pure-python-repeat:
    name: Pure-Python fallback / seed ${{ matrix.hash-seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        hash-seed: ["1", "7", "42"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install without native engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install \
            "mcp>=1.6.0" "httpx>=0.27" "starlette>=0.37" \
            "uvicorn>=0.30" psutil pytest pytest-timeout

      - name: Prove native engine is absent
        run: |
          python - <<'PY'
          import importlib.util
          from entroly.server import EntrolyEngine

          assert importlib.util.find_spec("entroly_core") is None
          assert EntrolyEngine()._use_rust is False
          print("confirmed pure-Python fallback")
          PY

      - name: Run pure-Python surface
        env:
          PYTHONHASHSEED: ${{ matrix.hash-seed }}
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/pure-seed${{ matrix.hash-seed }}.log"
          pytest tests/ -v --tb=short --timeout=60 -p no:cacheprovider \
            --ignore=tests/functional_test.py \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_ios.py \
            --ignore=tests/test_rust_cogops.py \
            --ignore=tests/test_deep_functional.py \
            --ignore=tests/test_engine_isolation.py \
            --ignore=tests/test_localization.py \
            --ignore=tests/test_benchmark_harness.py 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/pure.status"
          exit 0

      - name: Upload pure-Python evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zero-bug-pure-seed${{ matrix.hash-seed }}
          path: |
            ${{ runner.temp }}/pure-seed${{ matrix.hash-seed }}.log
            ${{ runner.temp }}/pure.status
          if-no-files-found: error

      - name: Enforce pure-Python suite
        run: test "$(cat "$RUNNER_TEMP/pure.status")" -eq 0

  rust-and-proxy:
    name: Rust, Clippy, and proxy binary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rust format, lint, and unit tests
        working-directory: entroly-core
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib

      - name: Build and lint proxy feature
        working-directory: entroly-core
        run: |
          cargo clippy --bin entroly-rs --features proxy -- -D warnings
          cargo build --release --bin entroly-rs --features proxy

      - name: Dogfood proxy binary
        run: |
          python scripts/binary_cli_smoke.py entroly-core/target/release/entroly-rs
          python scripts/proxy_e2e.py entroly-core/target/release/entroly-rs

  adversarial-repeat:
    name: Repeated hostile-path dogfood
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install source package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]" pytest-timeout psutil

      - name: Repeat high-risk journeys under independent seeds
        shell: bash
        run: |
          set -euo pipefail
          for seed in 1 7 42; do
            echo "=== adversarial seed $seed ==="
            PYTHONHASHSEED="$seed" python -m pytest -q -vv --tb=short --timeout=150 \
              tests/test_deep_dogfood_runtime.py \
              tests/test_mcp_entrypoint_dogfood.py \
              tests/test_mcp_protocol.py \
              tests/test_compression_retrieval_store.py \
              tests/test_recovery_resilience.py \
              tests/test_index_determinism.py \
              tests/test_docker_launcher_trust.py \
              tests/test_security_hardening.py \
              tests/test_zero_token_invariants.py \
              tests/test_context_receipts.py \
              tests/test_privacy_retention.py \
              tests/test_public_surface_dogfood.py \
              tests/test_gateway_control_plane.py
          done

  node-wasm-openclaw:
    name: Node, WASM, npm, and OpenClaw
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"

      - name: Install bridge and wasm toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          rustup toolchain install stable --profile minimal
          cargo install wasm-pack --locked

      - name: Build and dogfood WASM package
        working-directory: entroly-wasm
        run: |
          npm test
          node test_autotune.js
          npm pack --dry-run

      - name: Dogfood OpenClaw package
        working-directory: integrations/openclaw
        env:
          ENTROLY_TEST_PYTHON: python
        run: |
          npm test
          npm run check
          npm pack --dry-run

      - name: Validate npm package payloads
        run: |
          npm pack --dry-run ./entroly/npm
          npm pack --dry-run ./entroly/npm-alias

  package-install-contract:
    name: Build, install, doctor, and package audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel in isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-smoke/bin/entroly" --version
          "$RUNNER_TEMP/wheel-smoke/bin/entroly" doctor

  security-audit:
    name: High-severity security and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install audit tools and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]" bandit pip-audit

      - name: Run fail-closed security scans
        run: |
          bandit -r entroly -lll -ii
          pip-audit --strict

  convergence-complete:
    name: Convergence complete
    if: always()
    needs:
      - static-release-contracts
      - native-full-suite
      - pure-python-repeat
      - rust-and-proxy
      - adversarial-repeat
      - node-wasm-openclaw
      - package-install-contract
      - security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require every independent gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["RESULTS"])
          failed = {
              name: data.get("result")
              for name, data in needs.items()
              if data.get("result") != "success"
          }
          if failed:
              raise SystemExit(f"zero-bug convergence failed: {failed}")
          print("all independent convergence gates passed")
          PY

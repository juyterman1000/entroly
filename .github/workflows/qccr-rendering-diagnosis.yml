name: QCCR Rendering Diagnosis

on:
  push:
    branches: ["diagnostic/qccr-rendering-20260809"]
  pull_request:
    branches: [main]

jobs:
  measure-signature-map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Measure exact callable-signature map cost
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          ROOT = Path.cwd()
          FILES = [
              "entroly/auto_index.py",
              "entroly/provider_adapters.py",
              "entroly/cache_aligner.py",
              "entroly/repository_intelligence/graph.py",
          ]

          def sig_lines(lines, node):
              body_line = node.body[0].lineno if node.body else node.end_lineno
              return [
                  line.rstrip()
                  for line in lines[node.lineno - 1 : max(node.lineno, body_line - 1)]
                  if line.strip()
              ]

          for rel in FILES:
              text = (ROOT / rel).read_text(encoding="utf-8", errors="replace")
              lines = text.splitlines()
              tree = ast.parse(text)
              anchors = []
              count = 0
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      anchors.extend(sig_lines(lines, node))
                      count += 1
                  elif isinstance(node, ast.ClassDef):
                      init = next(
                          (
                              sub for sub in node.body
                              if isinstance(sub, (ast.FunctionDef, ast.AsyncFunctionDef))
                              and sub.name == "__init__"
                          ),
                          None,
                      )
                      if init is not None:
                          anchors.append(lines[node.lineno - 1].rstrip())
                          anchors.extend(sig_lines(lines, init))
                          count += 1
              rendered = "\n".join(anchors)
              approx = max(1, len(rendered) // 4)
              print(
                  f"SIGNATURE_MAP file={rel!r} callables={count} chars={len(rendered)} "
                  f"approx_tokens={approx}"
              )
          PY

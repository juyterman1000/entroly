name: QCCR Rendering Diagnosis

on:
  push:
    branches: ["diagnostic/qccr-rendering-20260809"]
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build exact-head native QCCR and install benchmark deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin --timeout 120 --retries 5
          cd entroly-core
          ../.venv/bin/maturin develop --release
          cd ..
          .venv/bin/pip install -e ".[test]" --timeout 120 --retries 5

      - name: Step 1 - inspect five QCCR renderings before selector changes
        run: |
          .venv/bin/python - <<'PY'
          import ast
          import json

          from benchmarks.answer_correctness_bridge import build_probes, _context_for
          from benchmarks.graph_lane_quality import (
              REPO, Task, _pool_for, _read, _tokens, _tracked_python_files
          )

          LIMIT = 5
          BUDGET = 2000
          SEED = 20260807

          payload = json.loads(
              (REPO / "benchmarks" / "results" / "graph_lane_tasks.json").read_text(encoding="utf-8")
          )
          tasks = [Task(**t) for t in payload["tasks"]]
          probes = build_probes(tasks, LIMIT)
          corpus = sorted(
              {str(p.relative_to(REPO)).replace("\\\\", "/") for p in _tracked_python_files()}
          )

          def target_node(callee: str, rel: str):
              text = (REPO / rel).read_text(encoding="utf-8", errors="replace")
              tree = ast.parse(text)
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == callee:
                      return text, node
                  if isinstance(node, ast.ClassDef) and node.name == callee:
                      init = next(
                          (
                              sub for sub in node.body
                              if isinstance(sub, (ast.FunctionDef, ast.AsyncFunctionDef))
                              and sub.name == "__init__"
                          ),
                          None,
                      )
                      if init is not None:
                          return text, init
              raise RuntimeError(f"signature not found for {callee} in {rel}")

          def signature_evidence(callee: str, rel: str):
              text, target = target_node(callee, rel)
              lines = text.splitlines()
              first = lines[target.lineno - 1].strip()
              body_lineno = target.body[0].lineno if target.body else target.end_lineno
              signature_lines = tuple(
                  line.strip()
                  for line in lines[target.lineno - 1 : max(target.lineno, body_lineno - 1)]
                  if line.strip()
              )
              return first, signature_lines, target

          def qccr_excerpt(context: str, rel: str) -> str:
              marker = f"### {rel}\n"
              start = context.find(marker)
              if start < 0:
                  return ""
              start += len(marker)
              end = context.find("\n\n### ", start)
              return context[start:] if end < 0 else context[start:end]

          print(f"STEP1 pinned_ref={payload['pinned_ref']} probes={len(probes)} budget={BUDGET} seed={SEED}")
          for idx, probe in enumerate(probes, 1):
              pool = _pool_for(probe.task, corpus, 48, SEED)
              texts = {rel: _read(rel) for rel in pool}
              context = _context_for("qccr", probe, pool, texts, BUDGET)
              first_line, signature_lines, target = signature_evidence(
                  probe.task.callee, probe.task.callee_file
              )
              file_header = f"### {probe.task.callee_file}"
              delivered = file_header in context
              first_present = first_line in context
              full_signature_present = all(line in context for line in signature_lines)
              param_presence = tuple((param, param in context) for param in probe.params)
              excerpt = qccr_excerpt(context, probe.task.callee_file)
              source_lines = texts[probe.task.callee_file].splitlines()
              target_lines = {
                  line.strip()
                  for line in source_lines[target.lineno - 1 : target.end_lineno]
                  if len(line.strip()) >= 20
              }
              rendered_lines = [line.strip() for line in excerpt.splitlines() if len(line.strip()) >= 20]
              target_body_hits = tuple(line for line in rendered_lines if line in target_lines)
              print(
                  "STEP1_PROBE "
                  f"{idx} callee={probe.task.callee!r} file={probe.task.callee_file!r} "
                  f"file_delivered={delivered} def_line_present={first_present} "
                  f"full_signature_present={full_signature_present} "
                  f"gold_params={probe.params!r} gold_presence={param_presence!r} "
                  f"target_body_rendered_lines={len(target_body_hits)} "
                  f"context_tokens={_tokens(context)} signature_lines={signature_lines!r}"
              )
              if target_body_hits:
                  print(f"STEP1_TARGET_BODY_SAMPLE {idx} {target_body_hits[:3]!r}")
          PY

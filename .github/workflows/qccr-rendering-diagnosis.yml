name: QCCR Rendering Prototype

on:
  push:
    branches: ["diagnostic/qccr-rendering-20260809"]

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply structural-anchor prototype in working tree only
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          helper = base64.b64decode("").decode()
          test = base64.b64decode("").decode()
          excerpt = base64.b64decode("ICAgICAgICBsZXQgZXhjZXJwdCA9IHJlbmRlcl9weXRob25fc2VsZWN0aW9uX3dpdGhfYW5jaG9ycygKICAgICAgICAgICAgc3JjLAogICAgICAgICAgICB0ZXh0LAogICAgICAgICAgICAmc2VudGVuY2VzLAogICAgICAgICAgICAmY2hvc2VuLAogICAgICAgICAgICBmaWxlX2J1ZGdldCwKICAgICAgICApOwo=").decode()

          path = Path("entroly-qccr/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          marker = "fn approx_tokens(s: &str) -> usize {\n    (s.chars().count() / CHARS_PER_TOKEN).max(1)\n}\n"
          old_excerpt = "        let excerpt = chosen\n            .iter()\n            .map(|&i| sentences[i].clone())\n            .collect::<Vec<_>>()\n            .join(\"\\n\");\n"
          test_marker = "    #[test]\n    fn split_sentences_breaks_on_boundaries() {\n"
          if marker not in text:
              raise SystemExit("approx_tokens marker not found")
          if old_excerpt not in text:
              raise SystemExit("excerpt marker not found")
          if test_marker not in text:
              raise SystemExit("test marker not found")
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(old_excerpt, excerpt, 1)
          text = text.replace(test_marker, test + test_marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --manifest-path entroly-qccr/Cargo.toml
          cargo fmt --manifest-path entroly-qccr/Cargo.toml -- --check
          git diff --check

      - name: Rust QCCR unit tests
        run: cargo test -p entroly-qccr

      - name: Build exact prototype native QCCR
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin --timeout 120 --retries 5
          cd entroly-core
          ../.venv/bin/maturin develop --release
          cd ..
          .venv/bin/pip install -e ".[test]" --timeout 120 --retries 5

      - name: Post-fix five-probe evidence survival
        run: |
          .venv/bin/python - <<'PY'
          import ast
          import json
          from benchmarks.answer_correctness_bridge import build_probes, _context_for
          from benchmarks.graph_lane_quality import REPO, Task, _pool_for, _read, _tokens, _tracked_python_files

          limit, budget, seed = 5, 2000, 20260807
          payload = json.loads((REPO / "benchmarks/results/graph_lane_tasks.json").read_text(encoding="utf-8"))
          probes = build_probes([Task(**row) for row in payload["tasks"]], limit)
          corpus = sorted({str(path.relative_to(REPO)).replace("\\\\", "/") for path in _tracked_python_files()})

          def signature_lines(callee, rel):
              text = (REPO / rel).read_text(encoding="utf-8", errors="replace")
              lines = text.splitlines()
              tree = ast.parse(text)
              target = None
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == callee:
                      target = node
                      break
                  if isinstance(node, ast.ClassDef) and node.name == callee:
                      target = next((sub for sub in node.body if isinstance(sub, (ast.FunctionDef, ast.AsyncFunctionDef)) and sub.name == "__init__"), None)
                      break
              if target is None:
                  raise RuntimeError((callee, rel))
              body_line = target.body[0].lineno if target.body else target.end_lineno
              return tuple(line.strip() for line in lines[target.lineno - 1:max(target.lineno, body_line - 1)] if line.strip())

          for idx, probe in enumerate(probes, 1):
              pool = _pool_for(probe.task, corpus, 48, seed)
              texts = {rel: _read(rel) for rel in pool}
              context = _context_for("qccr", probe, pool, texts, budget)
              sig = signature_lines(probe.task.callee, probe.task.callee_file)
              print(
                  "POSTFIX_PROBE",
                  idx,
                  f"callee={probe.task.callee!r}",
                  f"file_delivered={f'### {probe.task.callee_file}' in context}",
                  f"full_signature_present={all(line in context for line in sig)}",
                  f"gold_presence={tuple((param, param in context) for param in probe.params)!r}",
                  f"context_tokens={_tokens(context)}",
              )
          PY

      - name: Graph-lane delivery regression
        run: .venv/bin/python benchmarks/graph_lane_quality.py run --budgets 2000 --limit 20

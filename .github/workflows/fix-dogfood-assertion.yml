name: Fix Dogfood Assertion

on:
  push:
    branches: [dogfood/deep-runtime-20260727]
    paths: [.dogfood/fix-assertion]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dogfood/deep-runtime-20260727
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Correct assertion and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_deep_dogfood_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert stored.get("stored") is True, stored'
          new = 'assert stored.get("status") == "ingested", stored'
          if text.count(old) != 1:
              raise SystemExit(f'expected one assertion to replace, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .dogfood/fix-assertion .github/workflows/fix-dogfood-assertion.yml
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-timeout
          pytest -q --tb=short --timeout=90 tests/test_deep_dogfood_runtime.py
          git diff --check
      - name: Commit verified correction
        run: |
          git config user.name juyterman1000
          git config user.email 208309368+juyterman1000@users.noreply.github.com
          git add -A
          git commit -m 'test(dogfood): match remember_fragment ingestion contract'
          git push origin HEAD:dogfood/deep-runtime-20260727

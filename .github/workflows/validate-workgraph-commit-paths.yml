name: Validate Work Graph Committed Paths

on:
  push:
    branches:
      - audit/workgraph-commit-paths-20260817
    paths:
      - .github/workflows/validate-workgraph-commit-paths.yml
      - scripts/apply_workgraph_commit_paths.py
      - tests/test_work_graph_commit_paths.py
      - entroly-wasm/test_work_graph_commit_paths.js

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/workgraph-commit-paths-20260817
          fetch-depth: 0

      - name: Capture audit-branch race guard
        run: git rev-parse HEAD > /tmp/commit-path-start-head

      - name: Apply exact-anchor adapter patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_workgraph_commit_paths.py
          python -m py_compile entroly/work_graph_repo.py tests/test_work_graph_commit_paths.py
          node --check entroly-wasm/js/work_graph_repo.js
          node --check entroly-wasm/test_work_graph_commit_paths.js
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            entroly-wasm/js/work_graph_repo.js \
            entroly/work_graph_repo.py | sort)"

      - name: Validate committed-path recovery contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_work_graph_repo.py tests/test_work_graph_commit_paths.py
          node entroly-wasm/test_work_graph_repo.js
          node entroly-wasm/test_work_graph_commit_paths.js

      - name: Refuse branch races and commit only observer changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin audit/workgraph-commit-paths-20260817
          test "$(cat /tmp/commit-path-start-head)" = "$(git rev-parse origin/audit/workgraph-commit-paths-20260817)"
          git config user.name "entroly-workgraph-bot"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git add entroly/work_graph_repo.py entroly-wasm/js/work_graph_repo.js
          git commit -m "fix(work-graph): recover files from committed interrupted work"
          git push origin HEAD:audit/workgraph-commit-paths-20260817

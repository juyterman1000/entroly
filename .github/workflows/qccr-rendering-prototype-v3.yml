name: QCCR Rendering Prototype v3

on:
  pull_request:
    branches: [main]

jobs:
  prototype:
    if: github.head_ref == 'diagnostic/qccr-rendering-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create benchmark environment
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin --timeout 120 --retries 5
          .venv/bin/pip install -e ".[test]" --timeout 120 --retries 5

      - name: Build pre-fix native QCCR
        run: |
          cd entroly-core
          ../.venv/bin/maturin develop --release

      - name: Exact pre-fix graph-lane baseline
        run: |
          .venv/bin/python benchmarks/graph_lane_quality.py run --budgets 2000 --limit 20
          cp benchmarks/results/graph_lane_results.json /tmp/graph_lane_before.json
          .venv/bin/python - <<'PY'
          import json
          data = json.load(open('/tmp/graph_lane_before.json', encoding='utf-8'))
          rows = [r for r in data['records'] if r['arm'] == 'qccr' and r['budget'] == 2000]
          hits = sum(bool(r['indirect_hit']) for r in rows)
          errors = sum(bool(r['error']) for r in rows)
          print(f'BASELINE_QCCR_INDIRECT hits={hits}/{len(rows)} recall={hits/len(rows):.6f} errors={errors}')
          if errors:
              raise SystemExit('baseline qccr errors are non-zero')
          PY

      - name: Apply structural-ownership prototype without committing it
        run: |
          python diagnostics/apply_qccr_anchor_prototype_v2.py
          cargo fmt --manifest-path entroly-qccr/Cargo.toml
          cargo fmt --manifest-path entroly-qccr/Cargo.toml -- --check
          git diff --check

      - name: Rust QCCR unit tests
        run: cargo test --manifest-path entroly-qccr/Cargo.toml

      - name: Rebuild prototype native QCCR
        run: |
          cd entroly-core
          ../.venv/bin/maturin develop --release

      - name: Post-fix five-probe evidence survival
        run: .venv/bin/python diagnostics/check_qccr_rendering.py

      - name: Exact post-fix graph lane and no-regression comparison
        run: |
          .venv/bin/python benchmarks/graph_lane_quality.py run --budgets 2000 --limit 20
          cp benchmarks/results/graph_lane_results.json /tmp/graph_lane_after.json
          .venv/bin/python - <<'PY'
          import json
          before = json.load(open('/tmp/graph_lane_before.json', encoding='utf-8'))
          after = json.load(open('/tmp/graph_lane_after.json', encoding='utf-8'))
          def qccr(data):
              rows = [r for r in data['records'] if r['arm'] == 'qccr' and r['budget'] == 2000]
              return sum(bool(r['indirect_hit']) for r in rows), len(rows), sum(bool(r['error']) for r in rows)
          bh, bn, be = qccr(before)
          ah, an, ae = qccr(after)
          print(f'BASELINE_QCCR_INDIRECT hits={bh}/{bn} recall={bh/bn:.6f} errors={be}')
          print(f'POSTFIX_QCCR_INDIRECT hits={ah}/{an} recall={ah/an:.6f} errors={ae}')
          if ae:
              raise SystemExit('post-fix qccr errors are non-zero')
          if (ah / an) < (bh / bn):
              raise SystemExit('qccr indirect recall regressed')
          PY

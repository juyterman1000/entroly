name: Repair ClawHub release timeout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-clawhub-timeout.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'juyterman1000/entroly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Patch timeout and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/entroly-publish.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = '  publish-clawhub-openclaw:\n'
          end_marker = '  publish-binaries:\n'
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          section = workflow[start:end]

          old_timeout = '    timeout-minutes: 25\n'
          new_timeout = '    timeout-minutes: 60\n'
          if new_timeout not in section:
              if section.count(old_timeout) != 1:
                  raise SystemExit('expected exactly one 25-minute ClawHub timeout')
              section = section.replace(old_timeout, new_timeout, 1)
              workflow = workflow[:start] + section + workflow[end:]
              workflow_path.write_text(workflow, encoding='utf-8')

          test_path = Path('tests/test_release_surface.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '    assert "CLAWHUB_VERIFY_ATTEMPTS" in clawhub_publisher\n'
          guard = '    assert "timeout-minutes: 60" in clawhub_publisher\n'
          if guard not in tests:
              if tests.count(anchor) != 1:
                  raise SystemExit('unable to locate unique ClawHub retry assertion')
              tests = tests.replace(anchor, anchor + guard, 1)
              test_path.write_text(tests, encoding='utf-8')

          final_workflow = workflow_path.read_text(encoding='utf-8')
          final_start = final_workflow.index(start_marker)
          final_end = final_workflow.index(end_marker, final_start)
          final_section = final_workflow[final_start:final_end]
          assert final_section.count('timeout-minutes: 60') == 1
          assert 'timeout-minutes: 25' not in final_section
          assert guard in test_path.read_text(encoding='utf-8')
          PY

      - name: Run release-surface regression test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests/test_release_surface.py -q

      - name: Commit the repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/entroly-publish.yml tests/test_release_surface.py
          if git diff --cached --quiet; then
            echo 'Repair already present.'
            exit 0
          fi
          git commit -m 'fix(release): align ClawHub job timeout with verifier window'
          git push origin HEAD:main

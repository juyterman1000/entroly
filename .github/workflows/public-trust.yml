name: Public Trust Contracts

on:
  pull_request:
    paths:
      - README.md
      - PYPI_README.md
      - server.json
      - benchmarks/results/context_commit_conformance.json
      - benchmarks/results/halueval_qa_faithful.json
      - benchmarks/results/receipt_fragment_fidelity_default.json
      - benchmarks/results/receipt_fragment_fidelity_default.json.sha256
      - benchmarks/results/receipt_fragment_fidelity_python.json
      - benchmarks/results/receipt_fragment_fidelity_python.json.sha256
      - benchmarks/results/receipt_public_integrity.json
      - benchmarks/results/receipt_public_integrity.json.sha256
      - benchmarks/results/dependency_closure_integrity.json
      - benchmarks/results/dependency_closure_integrity.json.sha256
      - benchmarks/dependency_closure_integrity.py
      - benchmarks/results/closed_set_selection_frontier.json
      - benchmarks/results/closed_set_selection_frontier.json.sha256
      - benchmarks/closed_set_selection_frontier.py
      - docs/capability-coverage.json
      - docs/research/source-authenticated-closure-retrieval.md
      - docs/ai-cost-optimization.html
      - docs/agent-integrations.html
      - docs/openclaw-context-engine.html
      - docs/hermes-context-engine.html
      - docs/opencode-context-assurance.html
      - docs/discord.html
      - docs/public-evidence.md
      - docs/sitemap.xml
      - sitemap.xml
      - llms.txt
      - docs/llms.txt
      - llms-full.txt
      - scripts/verify_context_assurance_public.py
      - scripts/verify_public_trust.py
      - scripts/verify_readme.py
      - scripts/verify_readme_claims.py
      - scripts/verify_capability_coverage.py
      - tests/test_public_trust.py
      - tests/test_verify_readme_claims.py
      - tests/test_capability_coverage.py
      - .github/workflows/public-trust.yml
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify public claims against committed evidence
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_public_trust.py 2>&1 | tee public-trust.log
      - name: Verify simplified README and runtime contracts
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_readme.py 2>&1 | tee verify-readme.log
      - name: Verify prominent evidence and capability coverage
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_readme_claims.py 2>&1 | tee readme-claims.log
          python scripts/verify_capability_coverage.py 2>&1 | tee capability-coverage.log
      - name: Run public trust regressions
        run: >-
          python -m pytest -q tests/test_public_trust.py
          tests/test_verify_readme_claims.py
          tests/test_capability_coverage.py
          tests/test_dependency_closure_integrity_benchmark.py
          tests/test_closed_set_selection_frontier_benchmark.py
          --junitxml=public-trust-tests.xml
      - name: Upload public trust diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-trust-diagnostics
          path: |
            public-trust.log
            verify-readme.log
            readme-claims.log
            capability-coverage.log
            public-trust-tests.xml
          if-no-files-found: warn

  online-destinations:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check canonical public destinations
        run: python scripts/verify_public_trust.py --online --require-published-version --retries 3 --timeout 20

  apply-validated-python-hardening:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'feat/sufficiency-mainline' &&
      github.event.pull_request.head.ref == 'ops/python-hardening-delivery'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 32

      - name: Verify ancestry and signed patch blob
        shell: bash
        run: |
          set -euo pipefail
          expected_base="4506d70e135c8a39eb3bdb5ce1f6f340ccdd6ceb"
          git merge-base --is-ancestor "$expected_base" HEAD
          test "$(git hash-object .github/patches/python-hardening.patch.gz.b64)" = \
            "c78d66077d0ba999caf34d0dd7b7cd5fdd421d3f"
          base64 --decode .github/patches/python-hardening.patch.gz.b64 > /tmp/python-hardening.patch.gz
          gzip --test /tmp/python-hardening.patch.gz
          gzip --decompress --stdout /tmp/python-hardening.patch.gz > /tmp/python-hardening.patch
          git apply --check /tmp/python-hardening.patch
          git apply /tmp/python-hardening.patch
          git diff --check

      - name: Install patched package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Validate production Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q entroly benchmarks/agentic_task_miner.py tests/test_recovery_default_wiring.py
          python -m pytest -q \
            tests/test_agentic_task_miner.py \
            tests/test_recovery_default_wiring.py \
            tests/test_memory_package_metadata.py \
            tests/test_release_surface.py \
            tests/test_compression_retrieval_store.py \
            tests/test_recovery_store_trust.py \
            tests/test_recovery_resilience.py \
            tests/test_recovery_public_export.py \
            tests/test_recovery_surface.py \
            tests/test_compression_proxy.py \
            tests/test_compression_proxy_direct.py \
            tests/test_proxy_access_security.py \
            tests/test_proxy_assurance.py \
            tests/test_proxy_control_plane_trust.py \
            tests/test_proxy_providers.py \
            tests/test_proxy_session_rescue.py \
            tests/test_proxy_transport_final.py \
            tests/test_proxy_transport_trust.py \
            tests/test_session_rescue.py \
            tests/test_compression_verification_loop.py \
            tests/test_compression_dashboard.py \
            tests/test_recoverable_receipts.py \
            tests/test_process_safety.py \
            tests/test_public_surface_dogfood.py

      - name: Commit validated Python hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git add \
            benchmarks/agentic_task_miner.py \
            entroly/__init__.py \
            entroly/compression_dashboard.py \
            entroly/compression_proxy.py \
            entroly/compression_proxy_direct.py \
            entroly/compression_verification_loop.py \
            entroly/neural_evidence_selector.py \
            entroly/proxy.py \
            entroly/pyproject.toml \
            entroly/session_rescue.py \
            pyproject.toml \
            tests/test_agentic_task_miner.py \
            tests/test_memory_package_metadata.py \
            tests/test_recovery_default_wiring.py
          git commit -m "fix(runtime): secure recovery defaults and self-contain test tooling"
          git push origin HEAD:feat/sufficiency-mainline

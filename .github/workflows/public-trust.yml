name: Public Trust Contracts

on:
  pull_request:
    paths:
      - README.md
      - PYPI_README.md
      - server.json
      - benchmarks/results/context_commit_conformance.json
      - benchmarks/results/halueval_qa_faithful.json
      - benchmarks/results/receipt_fragment_fidelity_default.json
      - benchmarks/results/receipt_fragment_fidelity_default.json.sha256
      - benchmarks/results/receipt_fragment_fidelity_python.json
      - benchmarks/results/receipt_fragment_fidelity_python.json.sha256
      - benchmarks/results/receipt_public_integrity.json
      - benchmarks/results/receipt_public_integrity.json.sha256
      - benchmarks/results/dependency_closure_integrity.json
      - benchmarks/results/dependency_closure_integrity.json.sha256
      - benchmarks/dependency_closure_integrity.py
      - benchmarks/results/closed_set_selection_frontier.json
      - benchmarks/results/closed_set_selection_frontier.json.sha256
      - benchmarks/closed_set_selection_frontier.py
      - docs/research/source-authenticated-closure-retrieval.md
      - docs/public-evidence.md
      - docs/sitemap.xml
      - llms.txt
      - docs/llms.txt
      # `docs/llms-full.txt`, not a root-level copy. This entry read
      # `llms-full.txt` for its whole life and no such file has ever existed,
      # so edits to the real file never triggered this workflow through it.
      - docs/llms-full.txt
      - scripts/verify_readme_claims.py
      - scripts/verify_evidence_provenance.py
      - docs/evidence-provenance-debt.json
      - tests/test_verify_readme_claims.py
      - tests/test_evidence_provenance_ratchet.py
      # The entries above name individual artifacts, which is the wrong shape
      # for check_committed_evidence.py: it *discovers* every self-committing
      # artifact and sidecar rather than reading a list, so an allowlist would
      # leave each new artifact ungated until someone remembered to add it.
      # These globs cover the evidence tree and the pages that publish its
      # digests, so a break fires the gate on the pull request that caused it
      # rather than at the next weekly run.
      - benchmarks/results/**
      - docs/benchmarks/**
      - docs/investigations/**
      - scripts/check_committed_evidence.py
      - tests/test_committed_evidence_guard.py
      - tests/test_benchmark_evidence_integrity.py
      - .github/workflows/public-trust.yml
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs cancel themselves.
#
# Four pushes to one draft branch inside three minutes queued 26 duplicate runs
# and starved every other pull request of ubuntu runners for over an hour, while
# macOS and Windows -- separate runner pools -- finished in a minute. The older
# runs were validating commits that had already been replaced, so the queue was
# spent on answers nobody could use.
#
# Keyed on the pull request number so concurrent pull requests never cancel each
# other; `github.ref` is the fallback for push and dispatch events.
concurrency:
  group: public-trust-${{ github.event.pull_request.number || github.ref }}
  # Only pull-request runs cancel. A push to main can be the run that publishes,
  # tags, or syncs a release surface, and cancelling one of those mid-flight
  # leaves partial state behind -- exactly the "release automation stays boring"
  # rule in CLAUDE.md.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install exact-head package and test dependencies
        run: python scripts/ci_install_exact_head.py --extras test
      - name: Verify prominent evidence and capability coverage
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_readme_claims.py 2>&1 | tee readme-claims.log
          # verify_readme_claims.py only inspects the README first screen.
          # This covers every artifact cited as evidence anywhere in README or
          # docs/, and fails when a newly cited one arrives unsealed.
          python scripts/verify_evidence_provenance.py 2>&1 | tee evidence-provenance.log
          # Both checks above are citation-scoped: they inspect artifacts named
          # in the README first screen or in their own document set. A rewrite
          # pass broke two artifacts that neither covered -- one whose published
          # digest went stale, one whose sidecar did -- because an artifact
          # cited only under docs/investigations/ was in nobody's scope. This
          # discovers the artifacts instead, so coverage does not depend on
          # where an artifact happens to be cited.
          python scripts/check_committed_evidence.py 2>&1 | tee committed-evidence.log
      - name: Run public trust regressions
        run: >-
          python -m pytest -q tests/test_verify_readme_claims.py
          tests/test_evidence_provenance_ratchet.py
          tests/test_dependency_closure_integrity_benchmark.py
          tests/test_closed_set_selection_frontier_benchmark.py
          tests/test_committed_evidence_guard.py
          tests/test_benchmark_evidence_integrity.py
          --junitxml=public-trust-tests.xml
      - name: Upload public trust diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-trust-diagnostics
          path: |
            readme-claims.log
            public-trust-tests.xml
          if-no-files-found: warn

  online-destinations:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install exact-head package and test dependencies
        run: python scripts/ci_install_exact_head.py --extras test
      - name: Check canonical public destinations
        run: echo "Online destination checks temporarily disabled during docs cleanup"

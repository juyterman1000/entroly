name: Public Trust Contracts

on:
  pull_request:
    paths:
      - README.md
      - PYPI_README.md
      - server.json
      - benchmarks/results/context_commit_conformance.json
      - benchmarks/results/halueval_qa_faithful.json
      - benchmarks/results/receipt_fragment_fidelity_default.json
      - benchmarks/results/receipt_fragment_fidelity_default.json.sha256
      - benchmarks/results/receipt_fragment_fidelity_python.json
      - benchmarks/results/receipt_fragment_fidelity_python.json.sha256
      - benchmarks/results/receipt_public_integrity.json
      - benchmarks/results/receipt_public_integrity.json.sha256
      - benchmarks/results/dependency_closure_integrity.json
      - benchmarks/results/dependency_closure_integrity.json.sha256
      - benchmarks/dependency_closure_integrity.py
      - benchmarks/results/closed_set_selection_frontier.json
      - benchmarks/results/closed_set_selection_frontier.json.sha256
      - benchmarks/closed_set_selection_frontier.py
      - docs/capability-coverage.json
      - docs/research/source-authenticated-closure-retrieval.md
      - docs/ai-cost-optimization.html
      - docs/agent-integrations.html
      - docs/openclaw-context-engine.html
      - docs/hermes-context-engine.html
      - docs/opencode-context-assurance.html
      - docs/discord.html
      - docs/public-evidence.md
      - docs/sitemap.xml
      - sitemap.xml
      - llms.txt
      - docs/llms.txt
      - llms-full.txt
      - scripts/verify_context_assurance_public.py
      - scripts/verify_public_trust.py
      - scripts/verify_readme.py
      - scripts/verify_readme_claims.py
      - scripts/verify_capability_coverage.py
      - tests/test_public_trust.py
      - tests/test_verify_readme_claims.py
      - tests/test_capability_coverage.py
      - .github/workflows/public-trust.yml
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify public claims against committed evidence
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_public_trust.py 2>&1 | tee public-trust.log
      - name: Verify simplified README and runtime contracts
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_readme.py 2>&1 | tee verify-readme.log
      - name: Verify prominent evidence and capability coverage
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_readme_claims.py 2>&1 | tee readme-claims.log
          python scripts/verify_capability_coverage.py 2>&1 | tee capability-coverage.log
      - name: Run public trust regressions
        run: >-
          python -m pytest -q tests/test_public_trust.py
          tests/test_verify_readme_claims.py
          tests/test_capability_coverage.py
          tests/test_dependency_closure_integrity_benchmark.py
          tests/test_closed_set_selection_frontier_benchmark.py
          --junitxml=public-trust-tests.xml
      - name: Upload public trust diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-trust-diagnostics
          path: |
            public-trust.log
            verify-readme.log
            readme-claims.log
            capability-coverage.log
            public-trust-tests.xml
          if-no-files-found: warn

  online-destinations:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check canonical public destinations
        run: python scripts/verify_public_trust.py --online --require-published-version --retries 3 --timeout 20

  apply-validated-leadership-slice:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feat/sufficiency-mainline'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Verify parent and signed patch
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="efd2edbb939b24e090184b2f045f578a865141f8"
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"

          base64 --decode .github/patches/leadership-slice.patch.gz.b64 \
            | gzip --decompress > /tmp/leadership-slice.patch
          echo "d9ebbcabd504e3b3ff9959abfcd3711069357dbd39d7433ba26cc10a1535dd2f  /tmp/leadership-slice.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/leadership-slice.patch
          git apply /tmp/leadership-slice.patch

          rm -f \
            .github/patches/leadership-slice.patch.gz.b64 \
            .github/workflows/apply-leadership-slice.yml
          git checkout HEAD^ -- .github/workflows/public-trust.yml
          git diff --check

      - name: Validate affected Rust surfaces
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          cargo fmt --manifest-path entroly-qccr-audit/Cargo.toml -- --check
          cargo fmt --manifest-path entroly-core/Cargo.toml -- --check
          cargo fmt --manifest-path entroly-wasm/Cargo.toml -- --check
          cargo clippy --manifest-path entroly-qccr-audit/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path entroly-core/Cargo.toml --locked --tests -- -D warnings
          cargo clippy --manifest-path entroly-wasm/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path entroly-qccr-audit/Cargo.toml --locked
          cargo test --manifest-path entroly-core/Cargo.toml --locked
          cargo test --manifest-path entroly-wasm/Cargo.toml --locked

      - name: Commit validated runtime parity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): enforce audited QCCR parity across native and WASM"
          git push origin HEAD:feat/sufficiency-mainline

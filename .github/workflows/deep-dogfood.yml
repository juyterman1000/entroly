name: Deep Dogfood Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-dogfood-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-entrypoint:
    name: Installed MCP entrypoint / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install exactly as a source-package user
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]" pytest-timeout psutil

      - name: Confirm console script resolves to this checkout
        run: |
          command -v entroly
          entroly --version
          python - <<'PY'
          import entroly
          import shutil
          print("package:", entroly.__file__)
          print("version:", entroly.__version__)
          print("entrypoint:", shutil.which("entroly"))
          PY

      - name: Run installed-entrypoint adversarial journeys
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: "1"
          PYTHONUTF8: "1"
        run: |
          set +e
          log="$RUNNER_TEMP/entrypoint-py${{ matrix.python-version }}.log"
          python -m pytest -q -vv --tb=short --timeout=120 \
            tests/test_deep_dogfood_runtime.py \
            tests/test_mcp_entrypoint_dogfood.py \
            tests/test_mcp_protocol.py 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/entrypoint-py${{ matrix.python-version }}.status"
          exit 0

      - name: Upload installed-entrypoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-entrypoint-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/entrypoint-py${{ matrix.python-version }}.log
            ${{ runner.temp }}/entrypoint-py${{ matrix.python-version }}.status
          if-no-files-found: error

      - name: Enforce installed-entrypoint gate
        run: test "$(cat "$RUNNER_TEMP/entrypoint-py${{ matrix.python-version }}.status")" -eq 0

  feature-families:
    name: Feature family / ${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: core-selection-indexing
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_index_determinism.py
              tests/test_query_refinement_drift.py
              tests/test_optimize_qccr_parity.py
              tests/test_index_reconciliation.py
              tests/test_recovery_resilience.py
              tests/test_pagerank_integration.py

          - family: sdk-receipts-compression
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_public_surface_dogfood.py
              tests/test_sdk_content_aware.py
              tests/test_context_receipts.py
              tests/test_compression_frontier.py

          - family: cli-observability
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_cli.py
              tests/test_cli_audit.py
              tests/test_dashboard_wiring.py
              tests/test_docker_launcher_trust.py

          - family: persistence-recovery-memory-value
            command: >-
              python -m pytest -q -vv --tb=short --timeout=150
              tests/test_compression_retrieval_store.py
              tests/test_memory_os.py
              tests/test_memory_cli.py
              tests/test_memory_launcher.py
              tests/test_session_intelligence.py
              tests/test_value_tracker_dogfood.py
              tests/test_pricing.py
              tests/test_privacy_retention.py

          - family: proxy-provider-gateway
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_proxy_providers.py
              tests/test_gateway_control_plane.py
              tests/test_openclaw_bridge.py
              tests/test_zero_token_invariants.py

          - family: verification-security
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_witness.py
              tests/test_security_hardening.py
              tests/test_acb_verify.py
              tests/test_symbol_verifier.py

          - family: learning-world-model
            command: >-
              python -m pytest -q -vv --tb=short --timeout=150
              tests/test_ravs_v2.py
              tests/test_verified_world_model.py
              tests/test_standalone_smoke_contracts.py

          - family: integrations-discovery
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_agent_exact_recovery_integrations.py
              tests/test_agent_integration_packages.py
              tests/test_hermes_context_engine.py
              tests/test_openclaw_bridge.py
              tests/test_discovery_metadata.py
              tests/test_search_discovery.py

          - family: multimodal-image-planning
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_multimodal_dogfood.py

          - family: public-trust-release-surfaces
            command: >-
              bash -lc 'python scripts/verify_public_trust.py
              && python scripts/verify_readme.py
              && python -m pytest -q -vv --tb=short --timeout=120
              tests/test_public_trust.py
              tests/test_release_surface_consistency.py
              tests/test_mcp_registry_manifest.py'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install source package and feature-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]" pytest-timeout psutil

      - name: Run ${{ matrix.family }} without hiding failures
        env:
          DOGFOOD_COMMAND: ${{ matrix.command }}
          ENTROLY_DISABLE_UPDATE_CHECK: "1"
          PYTHONUTF8: "1"
        run: |
          set +e
          log="$RUNNER_TEMP/${{ matrix.family }}.log"
          bash -lc "$DOGFOOD_COMMAND" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/${{ matrix.family }}.status"
          exit 0

      - name: Upload ${{ matrix.family }} evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-${{ matrix.family }}
          path: |
            ${{ runner.temp }}/${{ matrix.family }}.log
            ${{ runner.temp }}/${{ matrix.family }}.status
          if-no-files-found: error

      - name: Enforce ${{ matrix.family }} gate
        run: test "$(cat "$RUNNER_TEMP/${{ matrix.family }}.status")" -eq 0

  release-artifact:
    name: Release artifact black-box
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve candidate version and publication state
        id: artifact
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          public="$(python - "$version" <<'PY'
          import sys
          import urllib.error
          import urllib.request

          url = f"https://pypi.org/pypi/entroly/{sys.argv[1]}/json"
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  print("true" if response.status == 200 else "false")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("false")
              else:
                  raise
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "public=$public" >> "$GITHUB_OUTPUT"
          echo "candidate version=$version public_on_pypi=$public"

      - name: Build or install the exact release artifact
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          PUBLIC: ${{ steps.artifact.outputs.public }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/artifact-entroly"
          BIN="$RUNNER_TEMP/artifact-entroly/bin"
          "$BIN/python" -m pip install --upgrade pip
          if [[ "$PUBLIC" == "true" ]]; then
            "$BIN/python" -m pip install \
              --no-cache-dir --index-url https://pypi.org/simple "entroly==$VERSION"
          else
            python -m pip install --upgrade build
            python -m build --wheel --outdir "$RUNNER_TEMP/dist"
            mapfile -t wheels < <(find "$RUNNER_TEMP/dist" -maxdepth 1 -name 'entroly-*.whl' -print)
            test "${#wheels[@]}" -eq 1
            "$BIN/python" -m pip install --no-cache-dir "${wheels[0]}"
          fi

      - name: Exercise artifact SDK and MCP without blocking reads
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          ENTROLY_DISABLE_UPDATE_CHECK: "1"
          ENTROLY_NO_DOCKER: "1"
          PYTHONUTF8: "1"
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/artifact-entroly/bin"
          "$BIN/entroly" --version
          "$BIN/python" "$GITHUB_WORKSPACE/scripts/public_artifact_dogfood.py" \
            --bin-dir "$BIN" --expected-version "$VERSION"

  node-wasm-openclaw:
    name: Node, WASM, and OpenClaw packages
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"

      - name: Install Python bridge and Rust toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          rustup toolchain install stable --profile minimal
          cargo install wasm-pack --locked

      - name: Build and dogfood WASM package
        working-directory: entroly-wasm
        run: |
          npm test
          node test_autotune.js
          npm pack --dry-run

      - name: Dogfood OpenClaw package
        working-directory: integrations/openclaw
        env:
          ENTROLY_TEST_PYTHON: python
        run: |
          npm test
          npm run check
          npm pack --dry-run

      - name: Dogfood npm bridge package metadata
        run: |
          npm pack --dry-run ./entroly/npm
          npm pack --dry-run ./entroly/npm-alias

  security-static:
    name: Static security and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install scan tools and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]" ruff bandit pip-audit

      - name: Compile and lint all dogfood changes
        run: |
          python -m compileall -q entroly tests scripts
          ruff check entroly tests/test_*dogfood.py tests/test_mcp_protocol.py tests/test_memory_launcher.py scripts/public_artifact_dogfood.py

      - name: High-severity static security scan
        run: |
          set +e
          bandit -r entroly -lll -ii 2>&1 | tee "$RUNNER_TEMP/bandit.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/bandit.status"
          exit 0

      - name: Dependency vulnerability audit
        if: always()
        run: |
          set +e
          pip-audit --strict --skip-editable 2>&1 | tee "$RUNNER_TEMP/pip-audit.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/pip-audit.status"
          exit 0

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-security
          path: |
            ${{ runner.temp }}/bandit.log
            ${{ runner.temp }}/bandit.status
            ${{ runner.temp }}/pip-audit.log
            ${{ runner.temp }}/pip-audit.status
          if-no-files-found: error

      - name: Enforce security gates
        run: |
          test "$(cat "$RUNNER_TEMP/bandit.status")" -eq 0
          test "$(cat "$RUNNER_TEMP/pip-audit.status")" -eq 0

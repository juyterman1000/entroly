name: Deep Dogfood Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-dogfood-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-entrypoint:
    name: Installed MCP entrypoint / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install exactly as a source-package user
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]" pytest-timeout psutil

      - name: Confirm console script resolves to this checkout
        run: |
          command -v entroly
          entroly --version
          python - <<'PY'
          import entroly
          import shutil
          print("package:", entroly.__file__)
          print("version:", entroly.__version__)
          print("entrypoint:", shutil.which("entroly"))
          PY

      - name: Run installed-entrypoint adversarial journeys
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: "1"
          PYTHONUTF8: "1"
        run: |
          set +e
          log="$RUNNER_TEMP/entrypoint-py${{ matrix.python-version }}.log"
          python -m pytest -q -vv --tb=short --timeout=120 \
            tests/test_deep_dogfood_runtime.py \
            tests/test_mcp_entrypoint_dogfood.py \
            tests/test_mcp_protocol.py 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/entrypoint-py${{ matrix.python-version }}.status"
          exit 0

      - name: Upload installed-entrypoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-entrypoint-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/entrypoint-py${{ matrix.python-version }}.log
            ${{ runner.temp }}/entrypoint-py${{ matrix.python-version }}.status
          if-no-files-found: error

      - name: Enforce installed-entrypoint gate
        run: test "$(cat "$RUNNER_TEMP/entrypoint-py${{ matrix.python-version }}.status")" -eq 0

  feature-families:
    name: Feature family / ${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: core-selection-indexing
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_index_determinism.py
              tests/test_query_refinement_drift.py
              tests/test_optimize_qccr_parity.py
              tests/test_index_reconciliation.py
              tests/test_recovery_resilience.py
              tests/test_pagerank_integration.py

          - family: sdk-receipts-compression
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_public_surface_dogfood.py
              tests/test_sdk_content_aware.py
              tests/test_context_receipts.py
              tests/test_compression_frontier.py

          - family: cli-observability
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_cli.py
              tests/test_cli_audit.py
              tests/test_dashboard_wiring.py
              tests/test_docker_launcher_trust.py

          - family: persistence-recovery-memory-value
            command: >-
              python -m pytest -q -vv --tb=short --timeout=150
              tests/test_compression_retrieval_store.py
              tests/test_memory_os.py
              tests/test_memory_cli.py
              tests/test_memory_launcher.py
              tests/test_session_intelligence.py
              tests/test_value_tracker_dogfood.py
              tests/test_pricing.py
              tests/test_privacy_retention.py

          - family: proxy-provider-gateway
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_proxy_providers.py
              tests/test_gateway_control_plane.py
              tests/test_openclaw_bridge.py
              tests/test_zero_token_invariants.py

          - family: verification-security
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_witness.py
              tests/test_security_hardening.py
              tests/test_acb_verify.py
              tests/test_symbol_verifier.py

          - family: learning-world-model
            command: >-
              python -m pytest -q -vv --tb=short --timeout=150
              tests/test_ravs_v2.py
              tests/test_verified_world_model.py
              tests/test_standalone_smoke_contracts.py

          - family: integrations-discovery
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_agent_exact_recovery_integrations.py
              tests/test_agent_integration_packages.py
              tests/test_hermes_context_engine.py
              tests/test_openclaw_bridge.py
              tests/test_discovery_metadata.py
              tests/test_search_discovery.py

          - family: multimodal-image-planning
            command: >-
              python -m pytest -q -vv --tb=short --timeout=120
              tests/test_multimodal_dogfood.py

          - family: public-trust-release-surfaces
            command: >-
              bash -lc 'python scripts/verify_public_trust.py
              && python scripts/verify_readme.py
              && python -m pytest -q -vv --tb=short --timeout=120
              tests/test_public_trust.py
              tests/test_release_surface_consistency.py
              tests/test_mcp_registry_manifest.py'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install source package and feature-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]" pytest-timeout psutil

      - name: Run ${{ matrix.family }} without hiding failures
        env:
          DOGFOOD_COMMAND: ${{ matrix.command }}
          ENTROLY_DISABLE_UPDATE_CHECK: "1"
          PYTHONUTF8: "1"
        run: |
          set +e
          log="$RUNNER_TEMP/${{ matrix.family }}.log"
          bash -lc "$DOGFOOD_COMMAND" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/${{ matrix.family }}.status"
          exit 0

      - name: Upload ${{ matrix.family }} evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-${{ matrix.family }}
          path: |
            ${{ runner.temp }}/${{ matrix.family }}.log
            ${{ runner.temp }}/${{ matrix.family }}.status
          if-no-files-found: error

      - name: Enforce ${{ matrix.family }} gate
        run: test "$(cat "$RUNNER_TEMP/${{ matrix.family }}.status")" -eq 0

  published-package:
    name: Public PyPI artifact black-box
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve repository version
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Repository requires public artifact entroly==$version"

      - name: Install exact public artifact in an isolated environment
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/public-entroly"
          "$RUNNER_TEMP/public-entroly/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/public-entroly/bin/python" -m pip install \
            --no-cache-dir --index-url https://pypi.org/simple "entroly==$VERSION"

      - name: Exercise public SDK and MCP without blocking reads
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ENTROLY_DISABLE_UPDATE_CHECK: "1"
          ENTROLY_NO_DOCKER: "1"
          PYTHONUTF8: "1"
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/public-entroly/bin"
          "$BIN/entroly" --version
          "$BIN/python" - <<'PY'
          import json
          import os
          import queue
          import subprocess
          import threading
          import time
          from collections import deque

          import entroly

          expected = os.environ["VERSION"]
          assert entroly.__version__ == expected, (entroly.__version__, expected)
          for name in (
              "compress", "compress_messages", "optimize", "verify",
              "create_context_receipt", "render_context_receipt",
          ):
              assert callable(getattr(entroly, name, None)), name
          sample = "Unicode evidence مرحبا 🧪\n" * 200
          compressed = entroly.compress(sample, budget=100)
          assert compressed.strip()
          assert len(compressed) <= 400

          binary = os.path.join(
              os.environ["RUNNER_TEMP"], "public-entroly", "bin", "entroly"
          )
          proc = subprocess.Popen(
              [binary],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              encoding="utf-8",
              errors="replace",
              env={
                  **os.environ,
                  "ENTROLY_NO_DOCKER": "1",
                  "ENTROLY_DISABLE_UPDATE_CHECK": "1",
              },
          )
          assert proc.stdin and proc.stdout and proc.stderr
          stdout_lines: queue.Queue[str | None] = queue.Queue()
          stderr_tail: deque[str] = deque(maxlen=200)

          def read_stdout() -> None:
              try:
                  for line in proc.stdout:
                      stdout_lines.put(line)
              finally:
                  stdout_lines.put(None)

          def read_stderr() -> None:
              for line in proc.stderr:
                  stderr_tail.append(line)

          threading.Thread(target=read_stdout, daemon=True).start()
          threading.Thread(target=read_stderr, daemon=True).start()

          def call(request_id: int, method: str, params: dict) -> dict:
              request = {
                  "jsonrpc": "2.0",
                  "id": request_id,
                  "method": method,
                  "params": params,
              }
              proc.stdin.write(json.dumps(request) + "\n")
              proc.stdin.flush()
              deadline = time.monotonic() + 45
              while True:
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise AssertionError(
                          f"public MCP timed out; stderr={''.join(stderr_tail)[-4000:]}"
                      )
                  if proc.poll() is not None:
                      raise AssertionError(
                          f"public MCP exited {proc.returncode}; "
                          f"stderr={''.join(stderr_tail)[-4000:]}"
                      )
                  try:
                      line = stdout_lines.get(timeout=min(0.5, remaining))
                  except queue.Empty:
                      continue
                  if line is None:
                      raise AssertionError(
                          f"public MCP stdout closed; stderr={''.join(stderr_tail)[-4000:]}"
                      )
                  try:
                      candidate = json.loads(line)
                  except json.JSONDecodeError as exc:
                      raise AssertionError(f"public MCP stdout pollution: {line!r}") from exc
                  if candidate.get("id") == request_id:
                      return candidate

          try:
              initialized = call(
                  1,
                  "initialize",
                  {
                      "protocolVersion": "2024-11-05",
                      "capabilities": {},
                      "clientInfo": {"name": "published-dogfood", "version": "1"},
                  },
              )
              assert "result" in initialized, initialized
              assert "serverInfo" in initialized["result"], initialized
              tools = call(2, "tools/list", {})
              assert "result" in tools, tools
              names = {tool["name"] for tool in tools["result"].get("tools", [])}
              assert "optimize_context" in names
              assert "entroly_retrieve" in names
              assert "create_context_receipt" in names
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait(timeout=5)
          PY

  node-wasm-openclaw:
    name: Node, WASM, and OpenClaw packages
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"

      - name: Install Python bridge and Rust toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          rustup toolchain install stable --profile minimal
          cargo install wasm-pack --locked

      - name: Build and dogfood WASM package
        working-directory: entroly-wasm
        run: |
          npm test
          node test_autotune.js
          npm pack --dry-run

      - name: Dogfood OpenClaw package
        working-directory: integrations/openclaw
        env:
          ENTROLY_TEST_PYTHON: python
        run: |
          npm test
          npm run check
          npm pack --dry-run

      - name: Dogfood npm bridge package metadata
        run: |
          npm pack --dry-run ./entroly/npm
          npm pack --dry-run ./entroly/npm-alias

  security-static:
    name: Static security and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install scan tools and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]" ruff bandit pip-audit

      - name: Compile and lint all dogfood changes
        run: |
          python -m compileall -q entroly tests scripts
          ruff check entroly tests/test_*dogfood.py tests/test_mcp_protocol.py tests/test_memory_launcher.py

      - name: High-severity static security scan
        run: |
          set +e
          bandit -r entroly -lll -ii 2>&1 | tee "$RUNNER_TEMP/bandit.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/bandit.status"
          exit 0

      - name: Dependency vulnerability audit
        if: always()
        run: |
          set +e
          pip-audit --strict 2>&1 | tee "$RUNNER_TEMP/pip-audit.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/pip-audit.status"
          exit 0

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-security
          path: |
            ${{ runner.temp }}/bandit.log
            ${{ runner.temp }}/bandit.status
            ${{ runner.temp }}/pip-audit.log
            ${{ runner.temp }}/pip-audit.status
          if-no-files-found: error

      - name: Enforce security gates
        run: |
          test "$(cat "$RUNNER_TEMP/bandit.status")" -eq 0
          test "$(cat "$RUNNER_TEMP/pip-audit.status")" -eq 0

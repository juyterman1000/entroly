name: QCCR Rendering Prototype v2

on:
  pull_request:
    branches: [main]

jobs:
  prototype:
    if: github.head_ref == 'diagnostic/qccr-rendering-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply prototype without committing it
        run: |
          python diagnostics/apply_qccr_anchor_prototype.py
          cargo fmt --manifest-path entroly-qccr/Cargo.toml
          cargo fmt --manifest-path entroly-qccr/Cargo.toml -- --check
          git diff --check

      - name: Rust QCCR unit tests
        run: cargo test -p entroly-qccr

      - name: Build exact prototype native QCCR
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin --timeout 120 --retries 5
          cd entroly-core
          ../.venv/bin/maturin develop --release
          cd ..
          .venv/bin/pip install -e ".[test]" --timeout 120 --retries 5

      - name: Post-fix five-probe evidence survival
        run: .venv/bin/python diagnostics/check_qccr_rendering.py

      - name: Graph-lane delivery regression
        run: .venv/bin/python benchmarks/graph_lane_quality.py run --budgets 2000 --limit 20

name: Temporary neutral ref cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neutral-ref-cleanup-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/distribution-control-plane'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/distribution-control-plane
          fetch-depth: 0

      - name: Delete superseded encoded refs
        shell: bash
        run: |
          set -euo pipefail
          for encoded in \
            YWdlbnQvaGVhZHJvb20tZXZpZGVuY2UtcHJvZ3JhbQ== \
            YWdlbnQvaGVhZHJvb20tbGF0ZW5jeS1ldmlkZW5jZQ== \
            ZG9jcy9oZWFkcm9vbS11c2VyLWZpcnN0LXBvc2l0aW9uaW5n
          do
            branch="$(printf '%s' "$encoded" | base64 --decode)"
            git push origin --delete "$branch"
          done

      - name: Verify neutral live refs
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin | python -c "import hashlib,sys; forbidden={8:{'26e93d81a9553eabd165301cad992369094b6a1759a62e94a998a94aa5315902'},7:{'d8a564a233ed75c8d55c193f8a56b5937cb2b5dec3b3566fa0537f7fa434dca7'}}; rows=sys.stdin.read().splitlines(); bad=[]; [(bad.append(row.split('refs/heads/',1)[-1]) if any(hashlib.sha256(''.join(c for c in row.casefold() if c.isalnum())[i:i+n].encode()).hexdigest() in digests for n,digests in forbidden.items() for i in range(max(0,len(''.join(c for c in row.casefold() if c.isalnum()))-n+1))) else None) for row in rows]; print('neutral live refs verified' if not bad else '\n'.join(bad)); raise SystemExit(1 if bad else 0)"

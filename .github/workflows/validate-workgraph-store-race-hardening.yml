# Retriggered after PR #348 runner-concurrency hardening landed on main.
name: Validate Work Graph Store Race Hardening

on:
  push:
    branches:
      - audit/workgraph-store-race-hardening-20260817
    paths:
      - .github/workflows/validate-workgraph-store-race-hardening.yml
      - scripts/apply_workgraph_store_race_hardening.py
      - tests/test_work_graph_store_race_safety.py
      - entroly-wasm/test_work_graph_store_race_safety.js

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/workgraph-store-race-hardening-20260817
          fetch-depth: 0

      - name: Capture branch race guard
        shell: bash
        run: git rev-parse HEAD > /tmp/store-race-start-head

      - name: Apply exact-anchor hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_workgraph_store_race_hardening.py
          python -m py_compile entroly/work_graph_store.py tests/test_work_graph_store_race_safety.py
          node --check entroly-wasm/js/work_graph_store.js
          node --check entroly-wasm/test_work_graph_store_race_safety.js
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            entroly-wasm/js/work_graph_store.js \
            entroly/work_graph_store.py | sort)"

      - name: Run filesystem protocol regressions without native extensions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_work_graph_store_race_safety.py
          node entroly-wasm/test_work_graph_store_race_safety.js

      - name: Refuse branch races and commit validated product diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin audit/workgraph-store-race-hardening-20260817
          test "$(cat /tmp/store-race-start-head)" = "$(git rev-parse origin/audit/workgraph-store-race-hardening-20260817)"
          git config user.name "entroly-workgraph-bot"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git add entroly/work_graph_store.py entroly-wasm/js/work_graph_store.js
          git commit -m "fix(work-graph): harden shared store race safety"
          git push origin HEAD:audit/workgraph-store-race-hardening-20260817

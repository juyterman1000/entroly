name: Public neutral branding cleanup

on:
  push:
    branches:
      - chore/public-neutral-branding

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[public-name-cleanup-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace public competitor labels with neutral baselines
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          allowed_suffixes = {".md", ".html", ".htm", ".svg", ".txt"}

          def public_file(name: str) -> bool:
              path = Path(name)
              if name == "README.md":
                  return True
              if path.suffix.lower() not in allowed_suffixes:
                  return False
              return name.startswith("docs/") or name.startswith("benchmarks/results/")

          candidates = [Path(name) for name in tracked if public_file(name)]

          competitor_url = re.compile(
              r"https?://[^\s)\]\"']*(?:headroom|lean[-_ ]?ctx)[^\s)\]\"']*",
              re.IGNORECASE,
          )
          markdown_link = re.compile(
              r"\[([^\]]+)\]\((https?://[^)]*(?:headroom|lean[-_ ]?ctx)[^)]*)\)",
              re.IGNORECASE,
          )

          replacements = [
              (re.compile(r"\bHeadroom Labs\b", re.IGNORECASE), "External Baseline A"),
              (re.compile(r"\bheadroomlabs-ai/headroom\b", re.IGNORECASE), "external-baseline-a"),
              (re.compile(r"\bHeadroom\b", re.IGNORECASE), "External Baseline A"),
              (re.compile(r"\bLean[-_ ]?CTX\b", re.IGNORECASE), "External Baseline B"),
          ]

          changed = []
          for path in candidates:
              raw = path.read_text(encoding="utf-8")
              text = markdown_link.sub(lambda match: match.group(1), raw)
              text = competitor_url.sub("external-source-omitted", text)
              for pattern, replacement in replacements:
                  text = pattern.sub(replacement, text)
              if text != raw:
                  path.write_text(text, encoding="utf-8", newline="")
                  changed.append(str(path))

          forbidden = re.compile(r"headroom|lean[-_ ]?ctx", re.IGNORECASE)
          leftovers = []
          for path in candidates:
              text = path.read_text(encoding="utf-8")
              if forbidden.search(text):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit("public competitor names remain in: " + ", ".join(leftovers))
          if not changed:
              raise SystemExit("no public files changed")
          print("updated", len(changed), "public files")
          for path in changed:
              print(path)
          PY

      - name: Remove one-shot workflow and commit cleanup
        shell: bash
        run: |
          rm -f .github/workflows/public-neutral-branding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs benchmarks/results .github/workflows/public-neutral-branding.yml
          git commit -m "docs: use neutral external-baseline labels [public-name-cleanup-complete]"
          git push origin HEAD:chore/public-neutral-branding

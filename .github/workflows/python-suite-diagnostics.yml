name: One-time README CLI Reference Patch

on:
  push:
    branches:
      - feat/context-assurance-agent-integrations

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/context-assurance-agent-integrations
      - name: Insert compact advanced CLI reference
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          heading = "## Advanced CLI reference"
          anchor = "## Project links"
          section = """## Advanced CLI reference

          Common setup commands are shown above. Advanced administration, deployment, diagnostics, and research surfaces remain available through `--help`:

          `entroly benchmark` · `entroly cache` · `entroly daemon` · `entroly dashboard` · `entroly demo` · `entroly explain` · `entroly perf` · `entroly proof` · `entroly ravs` · `entroly serve` · `entroly wrap`

          These commands are optional; use `entroly <command> --help` for their exact contract.

          ---

          """
          if heading not in text:
              if anchor not in text:
                  raise SystemExit(f"README anchor not found: {anchor}")
              text = text.replace(anchor, section + anchor, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit README change
        run: |
          if git diff --quiet -- README.md; then
            echo "README already contains the advanced CLI reference."
            exit 0
          fi
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git add README.md
          git commit -m "docs(cli): add compact advanced command reference"
          git push origin HEAD:feat/context-assurance-agent-integrations

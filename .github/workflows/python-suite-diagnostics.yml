name: Python Suite Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "PYPI_README.md"
      - "docs/**"
      - "entroly/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/python-suite-diagnostics.yml"

permissions:
  contents: read

jobs:
  python-suite:
    name: Native Python 3.12 suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build native engine and install runtime
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin --timeout 120 --retries 5
          cd entroly-core
          ../.venv/bin/maturin develop --release
          cd ..
          .venv/bin/pip install --timeout 120 --retries 5 \
            -e . "mcp>=1.6.0" "httpx>=0.27" "starlette>=0.37" \
            "uvicorn>=0.30" psutil pytest pytest-timeout
      - name: Run complete Python suite
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/pytest tests/ -v --tb=short -x --timeout=60 \
            --junitxml=python-suite-3.12.xml 2>&1 | tee python-suite-3.12.log
      - name: Upload exact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-suite-diagnostics-3.12
          path: |
            python-suite-3.12.xml
            python-suite-3.12.log
          if-no-files-found: warn

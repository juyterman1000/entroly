name: Round 7 Runtime Repair

on:
  push:
    branches: [dogfood/bug-hunt]
    paths:
      - scripts/apply_round7_runtime_fixes.py
      - .github/workflows/round7-runtime-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr280-bounded-demo-repair
  cancel-in-progress: false

jobs:
  validate:
    name: Validate bounded demo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ENTROLY_DISABLE_UPDATE_CHECK: "1"
      ENTROLY_NO_DOCKER: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact repair patch
        run: python scripts/apply_round7_runtime_fixes.py
      - name: Install focused dependencies
        run: python -m pip install -e ".[test,proxy]" pytest-timeout psutil ruff
      - name: Focused regression suite
        run: >-
          python -m pytest -q
          tests/test_demo_dogfood.py
          tests/test_cli.py
          --tb=short
          --timeout=120
      - name: Compile and lint changed Python
        run: |
          python -m compileall -q entroly tests/test_demo_dogfood.py
          python -m ruff check entroly/cli.py tests/test_demo_dogfood.py
      - name: Default demo must finish on a real large checkout
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as tmp:
              env = dict(os.environ)
              env["HOME"] = tmp
              env["ENTROLY_DIR"] = str(Path(tmp) / ".entroly")
              result = subprocess.run(
                  [sys.executable, "-m", "entroly.cli", "demo"],
                  cwd=os.getcwd(),
                  env=env,
                  capture_output=True,
                  text=True,
                  timeout=90,
              )
              if result.returncode != 0:
                  raise SystemExit(result.stdout + "\n" + result.stderr)
              if "Entroly Demo" not in result.stdout:
                  raise SystemExit("demo completed without its measured report")
      - name: JSON demo output must be parseable
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as tmp:
              env = dict(os.environ)
              env["HOME"] = tmp
              env["ENTROLY_DIR"] = str(Path(tmp) / ".entroly")
              # Run a non-JSON command first so first-run guidance cannot pollute
              # the subsequent machine-readable stream.
              subprocess.run(
                  [sys.executable, "-m", "entroly.cli", "capabilities"],
                  cwd=os.getcwd(), env=env, capture_output=True, text=True,
                  timeout=30, check=True,
              )
              result = subprocess.run(
                  [
                      sys.executable, "-m", "entroly.cli", "demo",
                      "--max-files", "1", "--json",
                  ],
                  cwd=os.getcwd(), env=env, capture_output=True, text=True,
                  timeout=30, check=True,
              )
              report = json.loads(result.stdout)
              assert report["mode"] == "local_no_llm"
      - name: Diff integrity
        shell: bash
        run: git diff --check

  commit:
    name: Commit validated bounded-demo repair
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dogfood/bug-hunt
          fetch-depth: 0
      - name: Apply exact repair patch
        run: python scripts/apply_round7_runtime_fixes.py
      - name: Restore permanent workflows and helper
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:scripts/apply_round7_runtime_fixes.py > scripts/apply_round7_runtime_fixes.py
          git show origin/main:.github/workflows/round7-runtime-repair.yml > .github/workflows/round7-runtime-repair.yml
          git show origin/main:.github/workflows/visibility-integrity.yml > .github/workflows/visibility-integrity.yml
          rm -f .github/workflows/deep-audit-export.yml
          rm -f .github/workflows/pr280-demo-repair.yml
          rm -f .github/workflows/pr280-demo-repair-push.yml
      - name: Commit only verified product and regression-test changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A \
            entroly/cli.py \
            tests/test_demo_dogfood.py \
            scripts/apply_round7_runtime_fixes.py \
            .github/workflows/round7-runtime-repair.yml \
            .github/workflows/visibility-integrity.yml \
            .github/workflows/deep-audit-export.yml \
            .github/workflows/pr280-demo-repair.yml \
            .github/workflows/pr280-demo-repair-push.yml
          git diff --cached --check
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git commit -m "fix(cli): bound demo indexing through shared simulation"
          git push origin HEAD:dogfood/bug-hunt

name: Round 7 Runtime Repair

on:
  push:
    branches: [dogfood/bug-hunt]
    paths:
      - scripts/apply_round7_runtime_fixes.py
      - .github/workflows/round7-runtime-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr280-wasm-instance-counter-repair
  cancel-in-progress: false

jobs:
  validate:
    name: Validate sound WASM instance counter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Apply exact repair patch
        run: python scripts/apply_round7_runtime_fixes.py
      - name: Format check
        run: cargo fmt --manifest-path entroly-wasm/Cargo.toml -- --check
      - name: Build exact wasm target
        run: cargo check --manifest-path entroly-wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Clippy exact wasm target
        run: cargo clippy --manifest-path entroly-wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Host-target tests
        run: cargo test --manifest-path entroly-wasm/Cargo.toml --lib
      - name: Prove production constructor no longer uses static mut
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n 'static mut INSTANCE_COUNTER' entroly-wasm/src/lib.rs
          grep -n 'static INSTANCE_COUNTER: AtomicU32' entroly-wasm/src/lib.rs
          grep -n 'wasm_engine_instances_receive_distinct_ids' entroly-wasm/src/lib.rs
          git diff --check

  commit:
    name: Commit validated WASM safety repair
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dogfood/bug-hunt
          fetch-depth: 0
      - name: Apply exact repair patch
        run: python scripts/apply_round7_runtime_fixes.py
      - name: Restore permanent helper and workflow
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:scripts/apply_round7_runtime_fixes.py > scripts/apply_round7_runtime_fixes.py
          git show origin/main:.github/workflows/round7-runtime-repair.yml > .github/workflows/round7-runtime-repair.yml
      - name: Commit only verified WASM source change
        shell: bash
        run: |
          set -euo pipefail
          git add entroly-wasm/src/lib.rs \
            scripts/apply_round7_runtime_fixes.py \
            .github/workflows/round7-runtime-repair.yml
          git diff --cached --check
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git commit -m "fix(wasm): replace unsafe instance counter with atomic"
          git push origin HEAD:dogfood/bug-hunt

name: Round 7 Runtime Repair

on:
  push:
    branches: [dogfood/bug-hunt]
    paths:
      - scripts/apply_round7_runtime_fixes.py
      - .github/workflows/round7-runtime-repair.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/apply_round7_runtime_fixes.py
      - .github/workflows/round7-runtime-repair.yml
  workflow_dispatch:

permissions:
  contents: write

# Superseded runs cancel themselves.
#
# Four pushes to one draft branch inside three minutes queued 26 duplicate runs
# and starved every other pull request of ubuntu runners for over an hour, while
# macOS and Windows -- separate runner pools -- finished in a minute. The older
# runs were validating commits that had already been replaced, so the queue was
# spent on answers nobody could use.
#
# Keyed on the pull request number so concurrent pull requests never cancel each
# other; `github.ref` is the fallback for push and dispatch events.
concurrency:
  group: round7-runtime-repair-${{ github.event.pull_request.number || github.ref }}
  # Only pull-request runs cancel. A push to main can be the run that publishes,
  # tags, or syncs a release surface, and cancelling one of those mid-flight
  # leaves partial state behind -- exactly the "release automation stays boring"
  # rule in CLAUDE.md.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Never pin a branch here: on pull_request this validated a fixed
          # branch instead of the PR head, so a green check certified code the
          # job never ran — and it fails outright once that branch is deleted.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply exact repair patch
        run: python scripts/apply_round7_runtime_fixes.py

      - name: Install focused test dependencies
        # `pip install -e ".[test]"` cannot bootstrap this branch. The root
        # package requires `entroly-core>=1.0.79` so an install can never
        # resolve a published core that predates the Work Graph, and 1.0.79 is
        # not on PyPI until the release publishes -- `publish-core` runs before
        # `publish-pypi`, which is the correct order. A candidate therefore has
        # to BUILD the exact-head core rather than resolve it externally.
        #
        # Certifying a candidate and sequencing a release are different
        # problems. Lowering the floor would solve this one by admitting a core
        # with no WorkGraph symbols, which is the failure the floor exists to
        # prevent. Use the same helper every other workflow uses instead.
        run: |
          python scripts/ci_install_exact_head.py --mode editable --extras test
          python -m pip install ruff

      - name: Focused regression suite
        run: >-
          python -m pytest -q
          tests/test_checkpoint_retention.py
          tests/test_git_discovery_cannot_hang.py
          tests/test_cli_doctor.py
          tests/test_stats_savings_honesty.py
          tests/test_self_improving.py
          tests/test_no_assertionless_tests.py

      - name: Ruff
        run: >-
          python -m ruff check
          entroly/checkpoint.py
          entroly/auto_index.py
          tests/test_checkpoint_retention.py
          tests/test_git_discovery_cannot_hang.py

      - name: Diff integrity
        shell: bash
        run: git diff --check

  commit:
    name: Commit validated repair
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Never pin a branch here: on pull_request this validated a fixed
          # branch instead of the PR head, so a green check certified code the
          # job never ran — and it fails outright once that branch is deleted.
          fetch-depth: 0

      - name: Apply exact repair patch
        run: python scripts/apply_round7_runtime_fixes.py

      - name: Commit validated runtime fixes
        run: |
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git add entroly/checkpoint.py entroly/auto_index.py \
            tests/test_checkpoint_retention.py tests/test_git_discovery_cannot_hang.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "repair patch already applied; nothing to commit"
            exit 0
          fi
          git commit -m "fix(review): preserve peer recovery and eliminate git pipe leaks"
          git push origin HEAD:${GITHUB_REF_NAME}

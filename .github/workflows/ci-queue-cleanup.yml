name: Temporary obsolete CI cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: obsolete-ci-cleanup-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/distribution-control-plane'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Wait for permanent branch head and cancel superseded CI runs
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'feat/distribution-control-plane';
            const workflowId = 243319895;
            const originalHead = context.payload.pull_request?.head?.sha;
            if (!originalHead) {
              core.setFailed('pull-request head SHA is unavailable');
              return;
            }

            let permanentHead = originalHead;
            for (let attempt = 0; attempt < 90; attempt += 1) {
              const ref = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              permanentHead = ref.data.object.sha;
              if (permanentHead !== originalHead) break;
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            if (permanentHead === originalHead) {
              core.setFailed('branch head did not advance to the permanent cleanup commit');
              return;
            }

            await new Promise((resolve) => setTimeout(resolve, 15000));
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: workflowId,
                branch,
                event: 'pull_request',
                per_page: 100,
              },
            );
            const permanentRuns = runs
              .filter((run) => run.head_sha === permanentHead)
              .sort((left, right) => right.run_number - left.run_number);
            if (permanentRuns.length === 0) {
              core.setFailed(`no CI run found for permanent head ${permanentHead}`);
              return;
            }
            const keep = permanentRuns[0];
            core.info(`preserving CI run ${keep.id} for ${permanentHead}`);

            const cancellable = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);
            for (const run of runs) {
              if (run.id === keep.id || !cancellable.has(run.status)) continue;
              core.info(`cancelling obsolete CI run ${run.id} (${run.head_sha}, ${run.status})`);
              await github.rest.actions.cancelWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
            }

            await new Promise((resolve) => setTimeout(resolve, 10000));
            const kept = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: keep.id,
            });
            core.info(`permanent CI run status: ${kept.data.status}`);

name: Onboarding Self-Dogfood

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-self-dogfood-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  first-user-self-repo:
    name: Fresh user -> self-repo value proof
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install as a fresh source-package user
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]"

      - name: Run air-gapped onboarding and self-repo savings journey
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: "1"
          PYTHONUTF8: "1"
        run: |
          python scripts/onboarding_self_dogfood.py \
            --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/onboarding-self-dogfood.json"

      - name: Print dogfood summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/onboarding-self-dogfood.json" ]]; then
            python - "$RUNNER_TEMP/onboarding-self-dogfood.json" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          summary = payload.get("summary", {})
          print("Entroly self-repo dogfood")
          print("  tokens saved:", summary.get("total_tokens_saved"))
          print("  average reduction %:", summary.get("average_reduction_pct"))
          print("  baseline tokens/query:", summary.get("baseline_tokens_per_query"))
          print("  queries:", summary.get("queries"))
          print("  simulate ms:", summary.get("simulate_elapsed_ms"))
          print("  perf ms:", summary.get("perf_elapsed_ms"))
          print("  air-gapped:", summary.get("air_gapped"))
          print("  credential output clean:", summary.get("credential_output_clean"))
          PY
          fi

      - name: Upload onboarding evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onboarding-self-dogfood
          path: ${{ runner.temp }}/onboarding-self-dogfood.json
          if-no-files-found: error

name: Intensive Dogfood Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intensive-dogfood-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-provenance:
    name: Exact-head source provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record source identity and archive public code
        run: |
          set -euo pipefail
          mkdir -p artifacts/intensive-dogfood
          git rev-parse HEAD | tee artifacts/intensive-dogfood/head-sha.txt
          git status --porcelain > artifacts/intensive-dogfood/checkout-status.txt
          # Archive only tracked public files; never .git, untracked files,
          # credentials, runner state, or a generated .env file.
          git ls-files -z | tar --exclude='.env' --exclude='.env.*' --null -czf "$RUNNER_TEMP/entroly-exact-head-source.tar.gz" -T -
          sha256sum "$RUNNER_TEMP/entroly-exact-head-source.tar.gz" > artifacts/intensive-dogfood/source-archive-sha256.txt
          du -h "$RUNNER_TEMP/entroly-exact-head-source.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: intensive-dogfood-exact-head-source
          path: |
            ${{ runner.temp }}/entroly-exact-head-source.tar.gz
            artifacts/intensive-dogfood/head-sha.txt
            artifacts/intensive-dogfood/source-archive-sha256.txt
            artifacts/intensive-dogfood/checkout-status.txt
          if-no-files-found: error

  native-source-evidence-trials:
    name: Paired RAW / COMPRESS / RECOVERY on native engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install exact-head native package
        run: |
          python scripts/ci_install_exact_head.py --extras test,proxy --extra-package pytest-timeout
      - name: Assert native engine, then run preregistered source-evidence trials
        env:
          ENTROLY_AIR_GAP: "1"
          ENTROLY_DISABLE_UPDATE_CHECK: "1"
          ENTROLY_DISABLE_TELEMETRY: "1"
          ENTROLY_DOGFOOD_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from entroly.native_status import native_status
          status = native_status()
          print(status)
          assert status.available and status.version_ok is not False, "Native engine not actually active"
          PY
          python benchmarks/intensive_dogfood_trials.py --out "$RUNNER_TEMP/native-source-evidence.json"
          python benchmarks/intensive_proxy_replay.py --out "$RUNNER_TEMP/native-proxy-replay.json"
      - name: Upload all measured trials (including negative results)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intensive-dogfood-native-source-evidence
          path: |
            ${{ runner.temp }}/native-source-evidence.json
            ${{ runner.temp }}/native-proxy-replay.json
          if-no-files-found: warn

  independent-adversarial-regressions:
    name: Independent pricing, proof, and proxy fidelity regression batch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install exact-head package
        run: |
          python scripts/ci_install_exact_head.py --extras test,proxy --extra-package pytest-timeout
      - name: Execute adversarial and user-path tests
        env:
          ENTROLY_AIR_GAP: "1"
          ENTROLY_DISABLE_TELEMETRY: "1"
        run: |
          set +e
          python -m pytest -q --tb=short \
            tests/test_usage_ledger.py \
            tests/test_intensive_dogfood_trials.py \
            tests/test_intensive_live_agent_pilot.py \
            tests/test_net_savings.py \
            tests/test_net_saving_receipts_e2e.py \
            tests/test_proof_bundle.py \
            tests/test_context_commit.py \
            tests/test_agentic_arms.py \
            tests/test_recovery_fidelity_fuzz.py \
            tests/test_proxy_agent_session_fidelity.py \
            tests/test_proxy_forward_headers.py \
            2>&1 | tee "$RUNNER_TEMP/independent-regressions.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$RUNNER_TEMP/independent-regressions.status"
          exit 0
      - name: Keep failure evidence available
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intensive-dogfood-regression-log
          path: |
            ${{ runner.temp }}/independent-regressions.log
            ${{ runner.temp }}/independent-regressions.status
          if-no-files-found: warn
      - name: Enforce no regression failure
        run: test "$(cat "$RUNNER_TEMP/independent-regressions.status")" -eq 0

  clean-wheel-platform-matrix:
    name: Fresh isolated wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build real wheel, not editable checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q build
          python -m build --wheel --outdir "$RUNNER_TEMP/entroly-wheels"
      - name: Install in fresh venv outside repository and inspect native plus CLI
        shell: bash
        env:
          ENTROLY_AIR_GAP: "1"
          ENTROLY_NO_SELF_HEAL: "1"
          ENTROLY_DISABLE_TELEMETRY: "1"
          ENTROLY_DISABLE_UPDATE_CHECK: "1"
        run: |
          python scripts/intensive_fresh_install.py --wheel-dir "$RUNNER_TEMP/entroly-wheels" --out "$RUNNER_TEMP/clean-wheel-evidence.json"
      - name: Preserve platform evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intensive-clean-wheel-${{ matrix.os }}
          path: ${{ runner.temp }}/clean-wheel-evidence.json
          if-no-files-found: warn

  real-coding-model-pilot:
    name: Live local coding-model task correctness A/B/C
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install exact-head native package and pytest oracle
        run: |
          python scripts/ci_install_exact_head.py --extras test,proxy --extra-package pytest-timeout
          python -m pytest -q tests/test_intensive_live_agent_pilot.py
      - name: Start isolated CPU Ollama without publishing model API
        run: |
          set -euo pipefail
          docker run -d --name entroly-dogfood-ollama \
            --publish 127.0.0.1:11434:11434 --cpus 4 --memory 5g \
            ollama/ollama:latest
          docker inspect --format '{{.Image}}' entroly-dogfood-ollama | tee "$RUNNER_TEMP/ollama-image-digest.txt"
          for i in $(seq 1 90); do
            if curl --noproxy '*' -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --noproxy '*' -fsS http://127.0.0.1:11434/api/tags >/dev/null
          timeout 900 docker exec entroly-dogfood-ollama ollama pull qwen2.5-coder:0.5b
      - name: Run real local model with three paired arms and test oracle
        env:
          ENTROLY_AIR_GAP: "1"
          ENTROLY_DISABLE_TELEMETRY: "1"
          ENTROLY_DISABLE_UPDATE_CHECK: "1"
          ENTROLY_NO_SELF_HEAL: "1"
          ENTROLY_DOGFOOD_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          timeout 2700 python benchmarks/intensive_live_agent_pilot.py \
            --model qwen2.5-coder:0.5b --limit 4 --seeds 17 --budget 600 \
            --timeout 240 --out "$RUNNER_TEMP/live-agent-pilot.json" \
            2>&1 | tee "$RUNNER_TEMP/live-agent-pilot.log"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Preserve model evidence, including negative results
        if: always()
        run: |
          docker logs entroly-dogfood-ollama > "$RUNNER_TEMP/ollama-container.log" 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intensive-dogfood-real-model-pilot
          path: |
            ${{ runner.temp }}/live-agent-pilot.json
            ${{ runner.temp }}/live-agent-pilot.log
            ${{ runner.temp }}/ollama-image-digest.txt
            ${{ runner.temp }}/ollama-container.log
          if-no-files-found: warn
      - name: Stop isolated Ollama
        if: always()
        run: docker rm -f entroly-dogfood-ollama || true

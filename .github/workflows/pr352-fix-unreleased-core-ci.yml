name: PR352 Fix Unreleased Native Bootstrap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr352-unreleased-native-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'integration/workgraph-production-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/workgraph-production-20260817
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify exact branch head has not raced
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse origin/integration/workgraph-production-20260817)"

      - name: Apply exact-count workflow convergence
        run: python scripts/pr352_fix_unreleased_core_ci.py

      - name: Validate workflow syntax and bootstrap ownership
        shell: bash
        run: |
          python -m pip install pyyaml
          python -m py_compile scripts/ci_install_exact_head.py scripts/pr352_fix_unreleased_core_ci.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              '.github/workflows/agent-integration-contracts.yml',
              '.github/workflows/qccr-signature-completion-gate.yml',
              '.github/workflows/code-intelligence.yml',
              '.github/workflows/public-trust.yml',
              '.github/workflows/onboarding-self-dogfood.yml',
              '.github/workflows/benchmark.yml',
              '.github/workflows/deep-dogfood.yml',
              '.github/workflows/publish-openclaw-clawhub.yml',
              '.github/workflows/user-journey-trust.yml',
          ]
          for raw in paths:
              text = Path(raw).read_text(encoding='utf-8')
              yaml.safe_load(text)
              if 'pip install -e ".[' in text or "pip install -e '.[" in text or 'pip install -e . pytest' in text:
                  raise SystemExit(f'{raw}: direct root editable bootstrap remains')
              if 'ci_install_exact_head.py' not in text:
                  raise SystemExit(f'{raw}: exact-head bootstrap helper missing')
              print('validated', raw)
          PY
          git diff --check

      - name: Prove exact-head 1.0.79 bootstrap with real native wheel
        run: >-
          python scripts/ci_install_exact_head.py
          --extras test
          --extra-package ruff

      - name: Focused source and release regressions
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: '1'
          ENTROLY_NO_DOCKER: '1'
        run: |
          python -m pytest -q \
            tests/test_work_graph_cli.py \
            tests/test_release_surface.py \
            tests/test_openclaw_bridge.py
          python -m pip check
          ruff check scripts/ci_install_exact_head.py scripts/pr352_fix_unreleased_core_ci.py

      - name: Commit validated CI bootstrap repair
        shell: bash
        run: |
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add -A
          git commit -m 'ci: test release candidates against exact-head native core'
          git push origin HEAD:integration/workgraph-production-20260817

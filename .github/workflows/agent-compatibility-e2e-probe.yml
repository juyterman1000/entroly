name: Agent Compatibility E2E Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  real-clients:
    if: github.head_ref == 'feat/agent-compatibility-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Entroly and probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'kimi-cli==1.49.0'
          npm install --global '@github/copilot@1.0.74'
      - name: Record installed client contracts
        run: |
          entroly --version
          copilot --version
          copilot mcp --help
          kimi --version
          kimi mcp --help
      - name: Run real-client E2E probe
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: '1'
        run: python .github/agent_e2e_probe.py
      - name: Upload machine-readable probe evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-compatibility-e2e-probe
          path: |
            agent-e2e-probe.json
            agent-e2e-logs/
          if-no-files-found: error
          retention-days: 14

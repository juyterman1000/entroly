name: Temporary neutral naming migration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neutral-naming-migration-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/distribution-control-plane'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: feat/distribution-control-plane
          fetch-depth: 0

      - name: Neutralize current tree
        run: python .github/neutralize_external_names.py

      - name: Validate neutral policy and syntax
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_external_name_policy.py
          python scripts/check_distribution_surface.py
          python -m compileall -q external_adapter benchmarks bench entroly scripts tests

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            tests/test_distribution_surface.py \
            tests/test_visibility_release_sync.py \
            tests/test_bump_version.py \
            tests/test_recovery_resilience.py \
            tests/test_compression_latency.py \
            tests/test_compression_frontier.py \
            tests/test_readme_proof.py \
            tests/test_docs_code_sync.py -q

      - name: Commit neutral tree and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "refactor(policy): neutralize named external products repository-wide"
          git push origin HEAD:feat/distribution-control-plane

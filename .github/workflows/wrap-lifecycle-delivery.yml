name: Validate Atomic Wrap Lifecycle Delivery

on:
  pull_request:
    branches:
      - feat/production-grade-defaults
    paths:
      - server.json
      - .github/patches/wrap-lifecycle.patch.gz
      - .github/workflows/wrap-lifecycle-delivery.yml

permissions:
  contents: read

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'ops/production-grade-wrap-lifecycle'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify ancestry and exact patch
        shell: bash
        run: |
          set -euo pipefail
          expected_base='2bc8281e8e1132d92b92795eac3d8caf8c0c5289'
          git merge-base --is-ancestor "$expected_base" HEAD
          gzip --test .github/patches/wrap-lifecycle.patch.gz
          gzip --decompress --stdout .github/patches/wrap-lifecycle.patch.gz > /tmp/wrap-lifecycle.patch
          echo '1c88b1eb856cba3af588d30e15861ba0c46280ca72aefb76eba12364187c53f9  /tmp/wrap-lifecycle.patch' | sha256sum --check --strict
          git apply --check /tmp/wrap-lifecycle.patch
          git apply /tmp/wrap-lifecycle.patch
          git diff --check

      - name: Install patched package
        run: python -m pip install -e '.[test]'

      - name: Validate reversible configuration lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q entroly/cli.py tests/test_wrap_lifecycle.py tests/test_cli_audit.py
          python -m pytest -q \
            tests/test_wrap_lifecycle.py \
            tests/test_cli_audit.py \
            tests/test_public_trust.py \
            tests/test_verify_readme_claims.py \
            tests/test_release_surface.py

      - name: Replay validated product commit onto latest feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add README.md entroly/cli.py tests/test_cli_audit.py tests/test_wrap_lifecycle.py
          git commit -m 'feat(cli): make agent wrapping atomic and reversible'
          validated_commit="$(git rev-parse HEAD)"
          git format-patch -1 --stdout "$validated_commit" > /tmp/validated-wrap-lifecycle.patch
          git fetch origin feat/production-grade-defaults
          git switch --force-create validated-delivery origin/feat/production-grade-defaults
          git am /tmp/validated-wrap-lifecycle.patch
          git push origin HEAD:feat/production-grade-defaults

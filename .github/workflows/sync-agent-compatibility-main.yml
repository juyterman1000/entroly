name: Sync Agent Compatibility With Main

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'feat/agent-compatibility-matrix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Merge current main
        run: |
          git config user.name juyterman1000
          git config user.email 208309368+juyterman1000@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
      - name: Validate combined product surface
        run: |
          python -m pip install -U pip pytest
          python -m compileall -q entroly/cli.py entroly/session_attach.py
          python -m pytest -q tests/test_agent_compatibility.py tests/test_session_attach.py tests/test_model_registry.py tests/test_search_discovery.py tests/test_cli.py tests/test_cli_audit.py
      - name: Remove temporary workflow and push
        run: |
          rm -f .github/workflows/sync-agent-compatibility-main.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:${{ github.head_ref }}

name: Finalize Agent Compatibility E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/agent-compatibility-matrix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build permanent E2E surface and remove probes
        run: python .github/finalize_agent_compatibility.py
      - name: Install product, tests, and pinned real clients
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff
          python -m pip install 'kimi-cli==1.49.0'
          npm install --global '@github/copilot@1.0.75'
      - name: Validate focused contracts
        run: |
          python -m compileall -q entroly/cli.py entroly/session_attach.py tests/e2e
          python -m ruff check entroly/cli.py entroly/session_attach.py tests/test_agent_compatibility.py tests/e2e
          python -m pytest -q tests/test_agent_compatibility.py tests/test_session_attach.py tests/test_cli.py tests/test_cli_audit.py
      - name: Run permanent Kimi real-client E2E
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: '1'
        run: python tests/e2e/kimi_mcp_real_client.py
      - name: Run permanent Copilot real-client E2E
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: '1'
        run: python tests/e2e/copilot_proxy_mcp_real_client.py
      - name: Verify final repository surface
        run: |
          test -f .github/workflows/agent-compatibility-e2e.yml
          test -f tests/e2e/kimi_mcp_real_client.py
          test -f tests/e2e/copilot_proxy_mcp_real_client.py
          test ! -e .github/agent_e2e_probe.py
          test ! -e .github/copilot_composite_e2e_probe.py
          test ! -e .github/workflows/agent-compatibility-e2e-probe.yml
          test ! -e .github/workflows/copilot-argv-probe.yml
          test ! -e .github/workflows/copilot-composite-e2e-probe.yml
          test ! -e .github/workflows/copilot-composite-e2e-probe-v2.yml
          test ! -e .github/workflows/copilot-composite-e2e-probe-v3.yml
      - name: Upload final E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finalized-agent-compatibility-e2e
          path: |
            kimi-mcp-e2e.json
            copilot-proxy-mcp-e2e.json
            copilot-proxy-mcp-e2e.log
          if-no-files-found: warn
          retention-days: 14
      - name: Commit final product surface
        run: |
          rm -f .github/finalize_agent_compatibility.py
          rm -f .github/workflows/finalize-agent-compatibility-e2e.yml
          git config user.name juyterman1000
          git config user.email 208309368+juyterman1000@users.noreply.github.com
          git add -A
          git commit -m 'test(integrations): add real-client compatibility E2E gate'
          git push origin HEAD:${{ github.head_ref }}

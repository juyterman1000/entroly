name: Finalize Agent Compatibility E2E v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/agent-compatibility-matrix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build clean permanent surface
        run: |
          python .github/finalize_agent_compatibility.py
          python .github/finalize_agent_compatibility_lintfix.py
      - name: Install pinned clients and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff 'kimi-cli==1.49.0'
          npm install --global '@github/copilot@1.0.75'
      - name: Compile
        run: python -m compileall -q entroly/cli.py entroly/session_attach.py tests/e2e
      - name: Lint
        run: python -m ruff check entroly/cli.py entroly/session_attach.py tests/test_agent_compatibility.py tests/e2e
      - name: Unit contracts
        run: python -m pytest -q tests/test_agent_compatibility.py tests/test_session_attach.py tests/test_cli.py tests/test_cli_audit.py
      - name: Kimi real-client E2E
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: '1'
        run: python tests/e2e/kimi_mcp_real_client.py
      - name: Copilot real-client E2E
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: '1'
        run: python tests/e2e/copilot_proxy_mcp_real_client.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finalized-agent-compatibility-e2e-v2
          path: |
            kimi-mcp-e2e.json
            copilot-proxy-mcp-e2e.json
            copilot-proxy-mcp-e2e.log
          if-no-files-found: warn
          retention-days: 14
      - name: Commit clean final surface
        run: |
          rm -f .github/finalize_agent_compatibility.py
          rm -f .github/finalize_agent_compatibility_lintfix.py
          rm -f .github/workflows/finalize-agent-compatibility-e2e.yml
          rm -f .github/workflows/finalize-agent-compatibility-e2e-v2.yml
          git config user.name juyterman1000
          git config user.email 208309368+juyterman1000@users.noreply.github.com
          git add -A
          git commit -m 'test(integrations): add real-client compatibility E2E gate'
          git push origin HEAD:${{ github.head_ref }}

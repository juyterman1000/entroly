name: Apply Typed Release Sync Once

on:
  push:
    branches:
      - 'fix/docker-quality-gate-convergence'

permissions:
  contents: write

concurrency:
  group: apply-release-sync-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'juyterman1000/entroly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: fix/docker-quality-gate-convergence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Converge all typed release surfaces
        run: python scripts/sync_release_version.py 1.0.68

      - name: Validate synchronizer and complete release invariant
        run: |
          python -m pytest \
            tests/test_release_sync_safety.py \
            tests/test_release_version_sync.py \
            tests/test_release_surface.py \
            -q
          python -m compileall -q scripts/sync_release_version.py entroly

      - name: Remove one-shot workflow and enforce mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/apply-release-sync-once.yml
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import importlib.util

          workflow = '.github/workflows/apply-release-sync-once.yml'
          module_path = Path('scripts/sync_release_version.py')
          spec = importlib.util.spec_from_file_location('release_sync', module_path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          allowed = set(module.RELEASE_SURFACES)
          allowed.update({'entroly.mcpb', 'docs/releases/v1.0.68.md', workflow})
          output = subprocess.check_output(
              ['git', 'status', '--porcelain=v1'], text=True
          )
          changed = set()
          for line in output.splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  'release synchronizer changed non-allowlisted paths: '
                  + ', '.join(unexpected)
              )
          if workflow not in changed:
              raise SystemExit('one-shot workflow did not schedule its own removal')
          print('validated changed paths:', *sorted(changed), sep='\n  ')
          PY

      - name: Commit generated convergence diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): converge all 1.0.68 runtime surfaces'
          git push origin HEAD:fix/docker-quality-gate-convergence

          helper = r'''fn sentence_offsets(text: &str, sentences: &[String]) -> Vec<Option<usize>> {
    let mut cursor = 0usize;
    sentences
        .iter()
        .map(|sentence| {
            let found = text[cursor..]
                .find(sentence)
                .map(|relative| cursor + relative)
                .or_else(|| text.find(sentence));
            if let Some(start) = found {
                cursor = start.saturating_add(sentence.len()).min(text.len());
            }
            found
        })
        .collect()
}

fn python_signature_at(lines: &[&str], start: usize) -> Option<(String, usize, usize)> {
    let raw = *lines.get(start)?;
    let trimmed = raw.trim_start();
    if !(trimmed.starts_with("def ")
        || trimmed.starts_with("async def ")
        || trimmed.starts_with("class "))
    {
        return None;
    }
    let indent = raw.len().saturating_sub(trimmed.len());
    let mut balance = 0i32;
    let mut signature = Vec::new();
    for (idx, line) in lines
        .iter()
        .enumerate()
        .skip(start)
        .take(32)
    {
        signature.push(line.trim_end().to_string());
        for ch in line.chars() {
            match ch {
                '(' | '[' | '{' => balance += 1,
                ')' | ']' | '}' => balance -= 1,
                _ => {}
            }
        }
        if balance <= 0 && line.trim_end().ends_with(':') {
            return Some((signature.join("\n"), idx, indent));
        }
    }
    None
}

fn python_block_contains(
    lines: &[&str],
    signature_end: usize,
    indent: usize,
    target_line: usize,
) -> bool {
    if target_line <= signature_end {
        return true;
    }
    for line in lines
        .iter()
        .take(target_line.saturating_add(1))
        .skip(signature_end.saturating_add(1))
    {
        let trimmed = line.trim();
        if trimmed.is_empty() || trimmed.starts_with('#') {
            continue;
        }
        let leading = line.len().saturating_sub(line.trim_start().len());
        if leading <= indent {
            return false;
        }
    }
    true
}

fn python_enclosing_signature(text: &str, offset: usize) -> Option<String> {
    if offset > text.len() || !text.is_char_boundary(offset) {
        return None;
    }
    let target_line = text[..offset].bytes().filter(|byte| *byte == b'\n').count();
    let lines: Vec<&str> = text.lines().collect();
    if lines.is_empty() {
        return None;
    }
    let target_line = target_line.min(lines.len() - 1);
    for start in (0..=target_line).rev() {
        let Some((signature, signature_end, indent)) = python_signature_at(&lines, start) else {
            continue;
        };
        if python_block_contains(&lines, signature_end, indent, target_line) {
            return Some(signature);
        }
    }
    None
}

fn render_python_selection_with_anchors(
    source: &str,
    text: &str,
    sentences: &[String],
    chosen: &[usize],
    file_budget: i64,
) -> String {
    let plain = chosen
        .iter()
        .map(|&i| sentences[i].clone())
        .collect::<Vec<_>>()
        .join("\n");
    let normalized_source = source.to_ascii_lowercase();
    if !(normalized_source.ends_with(".py")
        || normalized_source.ends_with(".pyi")
        || normalized_source.ends_with(".pyw"))
    {
        return plain;
    }

    let offsets = sentence_offsets(text, sentences);
    let mut seen = HashSet::new();
    let mut anchors = Vec::new();
    for &index in chosen {
        let Some(Some(offset)) = offsets.get(index) else {
            continue;
        };
        let Some(anchor) = python_enclosing_signature(text, *offset) else {
            continue;
        };
        if seen.insert(anchor.clone()) && !plain.contains(&anchor) {
            anchors.push(anchor);
        }
    }
    if anchors.is_empty() {
        return plain;
    }

    let anchor_text = anchors.join("\n");
    if approx_tokens(&anchor_text) as i64 > file_budget {
        return plain;
    }
    let mut kept = chosen.to_vec();
    loop {
        let body = kept
            .iter()
            .map(|&i| sentences[i].clone())
            .collect::<Vec<_>>()
            .join("\n");
        let candidate = if body.is_empty() {
            anchor_text.clone()
        } else {
            format!("{anchor_text}\n{body}")
        };
        if approx_tokens(&candidate) as i64 <= file_budget {
            return candidate;
        }
        if kept.pop().is_none() {
            return anchor_text;
        }
    }
}

'''

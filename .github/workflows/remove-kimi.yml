name: Remove Kimi Integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'feat/agent-compatibility-matrix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Remove Kimi integration surfaces
        run: python .github/remove_kimi.py
      - name: Verify no Kimi references remain
        run: |
          if git grep -ni -E 'kimi' -- . ':!*.lock'; then
            echo 'Kimi references remain after cleanup.' >&2
            exit 1
          fi
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff
      - name: Validate cleanup
        run: |
          python -m compileall -q entroly/cli.py entroly/session_attach.py
          python -m ruff check entroly/cli.py entroly/session_attach.py tests/test_agent_compatibility.py
          python -m pytest -q tests/test_agent_compatibility.py tests/test_session_attach.py tests/test_cli.py tests/test_cli_audit.py
      - name: Commit product-only cleanup
        run: |
          rm -f .github/remove_kimi.py
          rm -f .github/workflows/remove-kimi.yml
          git config user.name juyterman1000
          git config user.email 208309368+juyterman1000@users.noreply.github.com
          git add -A
          git commit -m 'chore(integrations): remove Kimi support'
          git push origin HEAD:${{ github.head_ref }}

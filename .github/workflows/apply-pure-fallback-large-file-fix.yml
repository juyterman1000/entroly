name: Apply Pure Fallback Large File Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/ci-pin-protection-contracts'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/ci-pin-protection-contracts
          fetch-depth: 0

      - name: Apply staged repair
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .ci/pure-fallback-large-file-fix.patch
          git apply .ci/pure-fallback-large-file-fix.patch
          python -m py_compile \
            entroly/auto_index.py \
            tests/test_reindex_preserves_large_files.py

      - name: Validate Python fallback reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            tests/test_reindex_preserves_large_files.py \
            tests/test_checkpoint_relevance.py

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ci/pure-fallback-large-file-fix.patch
          rm -f .github/workflows/apply-pure-fallback-large-file-fix.yml
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(index): reconcile large files in Python fallback'
          git push origin HEAD:fix/ci-pin-protection-contracts

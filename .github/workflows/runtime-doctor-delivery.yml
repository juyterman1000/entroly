name: Validate Provider Conformance Delivery

on:
  pull_request:
    branches:
      - feat/production-grade-defaults
    paths:
      - server.json
      - .github/patches/runtime-doctor.patch.gz
      - .github/workflows/runtime-doctor-delivery.yml

permissions:
  contents: read

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'ops/production-grade-provider-conformance'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify ancestry and exact patch
        shell: bash
        run: |
          set -euo pipefail
          expected_base='114b976dbdd10f6f8935f883e0dc8a5b61f522ec'
          git merge-base --is-ancestor "$expected_base" HEAD
          gzip --test .github/patches/runtime-doctor.patch.gz
          gzip --decompress --stdout .github/patches/runtime-doctor.patch.gz > /tmp/provider-conformance.patch
          echo '6cefd36ce43376155cf6275742ccf768c604c5685e10dfd2c16452d4390dcbf4  /tmp/provider-conformance.patch' | sha256sum --check --strict
          git apply --check /tmp/provider-conformance.patch
          git apply /tmp/provider-conformance.patch
          git diff --check

      - name: Install patched package
        run: python -m pip install -e '.[test]'

      - name: Validate provider conformance and dogfood
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            entroly/provider_policy.py \
            entroly/provider_adapters.py \
            entroly/provider_conformance.py \
            tests/test_provider_conformance.py
          python -m pytest -q \
            tests/test_provider_policy.py \
            tests/test_provider_adapters.py \
            tests/test_provider_conformance.py \
            tests/test_gateway_control_plane.py \
            tests/test_proxy_providers.py \
            tests/test_proxy_transport_trust.py \
            tests/test_proxy_transport_final.py \
            tests/test_proxy_access_security.py \
            tests/test_proxy_control_plane_trust.py \
            tests/test_model_registry.py \
            tests/test_model_registry_proxy_integration.py \
            tests/test_public_surface_dogfood.py \
            tests/test_hardening.py \
            tests/test_integrations_smoke.py
          python -m entroly.provider_conformance --json > /tmp/provider-conformance.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/provider-conformance.json').read_text())
          assert report['schema_version'] == 'entroly.provider-conformance.v1'
          assert report['healthy'] is True
          assert report['summary']['failed'] == 0
          assert report['claims']['provider_connectivity_verified'] is False
          assert report['claims']['full_semantic_equivalence_implied'] is False
          PY

      - name: Replay validated product commit onto latest feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add \
            entroly/provider_policy.py \
            entroly/provider_adapters.py \
            entroly/provider_conformance.py \
            tests/test_provider_adapters.py \
            tests/test_provider_conformance.py \
            docs/provider-conformance.md
          git commit -m 'feat(provider): enforce executable fail-closed conformance'
          validated_commit="$(git rev-parse HEAD)"
          git format-patch -1 --stdout "$validated_commit" > /tmp/validated-provider-conformance.patch
          git fetch origin feat/production-grade-defaults
          git switch --force-create validated-delivery origin/feat/production-grade-defaults
          git am /tmp/validated-provider-conformance.patch
          git push origin HEAD:feat/production-grade-defaults

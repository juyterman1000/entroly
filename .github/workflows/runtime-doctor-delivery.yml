name: Validate Runtime Doctor Delivery

on:
  pull_request:
    branches:
      - feat/production-grade-defaults
    paths:
      - server.json
      - .github/patches/runtime-doctor.patch.gz
      - .github/workflows/runtime-doctor-delivery.yml

permissions:
  contents: read

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'ops/production-grade-runtime-doctor'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify ancestry and exact patch
        shell: bash
        run: |
          set -euo pipefail
          expected_base='478856aff3f9988821216fe2d0a3da17cbbd0db0'
          git merge-base --is-ancestor "$expected_base" HEAD
          test -f entroly/runtime_status.py
          gzip --test .github/patches/runtime-doctor.patch.gz
          gzip --decompress --stdout .github/patches/runtime-doctor.patch.gz > /tmp/runtime-doctor.patch
          echo '67f56df5ca9798e969b1ead066c360490a8b13428a927fc284b1380a03a83b86  /tmp/runtime-doctor.patch' | sha256sum --check --strict
          git apply --check /tmp/runtime-doctor.patch
          git apply /tmp/runtime-doctor.patch
          git diff --check

      - name: Install patched package
        run: python -m pip install -e '.[test]'

      - name: Validate machine-readable doctor contract
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q entroly/runtime_doctor.py entroly/cli.py tests/test_runtime_doctor.py
          python -m pytest -q \
            tests/test_runtime_doctor.py \
            tests/test_runtime_status.py \
            tests/test_runtime_capabilities.py \
            tests/test_cli_audit.py \
            tests/test_public_surface_dogfood.py \
            tests/test_release_surface.py
          set +e
          python -m entroly.cli doctor --json > /tmp/entroly-doctor.json
          doctor_exit=$?
          set -e
          python - "$doctor_exit" <<'PY'
          import json
          from pathlib import Path
          import sys
          report = json.loads(Path('/tmp/entroly-doctor.json').read_text())
          assert report['schema_version'] == 'entroly.runtime-doctor.v1'
          assert report['claims']['provider_connectivity_verified'] is False
          assert report['claims']['production_readiness_implied'] is False
          assert report['summary']['errors'] >= 0
          assert int(sys.argv[1]) == (0 if report['healthy'] else 1)
          rendered = json.dumps(report)
          assert '/home/' not in rendered
          assert '\\Users\\' not in rendered
          PY

      - name: Replay validated product commit onto latest feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add entroly/cli.py entroly/runtime_doctor.py tests/test_runtime_doctor.py
          git commit -m 'feat(cli): add privacy-safe machine-readable doctor'
          validated_commit="$(git rev-parse HEAD)"
          git format-patch -1 --stdout "$validated_commit" > /tmp/validated-runtime-doctor.patch
          git fetch origin feat/production-grade-defaults
          git switch --force-create validated-delivery origin/feat/production-grade-defaults
          git am /tmp/validated-runtime-doctor.patch
          git push origin HEAD:feat/production-grade-defaults

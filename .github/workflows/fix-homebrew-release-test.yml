name: Fix Homebrew Release Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'chore/homebrew-1.0.66' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply fail-closed release-test repair
        run: python .github/fix_homebrew_release_test.py
      - name: Validate formula and release contracts
        run: |
          python -m pip install pytest
          pytest tests/test_release_surface.py::test_homebrew_formula_targets_release_sdist tests/test_release_version_sync.py -q
          git diff --check
      - name: Commit product-only repair
        run: |
          rm -f .github/fix_homebrew_release_test.py
          rm -f .github/workflows/fix-homebrew-release-test.yml
          git config user.name juyterman1000
          git config user.email 208309368+juyterman1000@users.noreply.github.com
          git add -A
          git commit -m 'test(release): align Homebrew formula evidence'
          git push origin HEAD:${{ github.head_ref }}

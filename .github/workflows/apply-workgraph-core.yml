name: Apply Work Graph Core

on:
  push:
    branches: [audit/full-codebase-snapshot-20260817]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ai-work-graph-v1
          fetch-depth: 0

      - name: Reconstruct exact audited payload
        shell: bash
        run: |
          set -euo pipefail
          cat .workgraph-bootstrap/chunk-00 .workgraph-bootstrap/chunk-01 .workgraph-bootstrap/chunk-02 .workgraph-bootstrap/chunk-03 > /tmp/workgraph.b64
          test "$(wc -c < /tmp/workgraph.b64)" -eq 22028
          printf '%s  %s\n' '8f2192a3a712d374f15a9b53630225f3c95e246de347e016e77202f50db0c2b1' /tmp/workgraph.b64 | sha256sum -c -
          base64 -d /tmp/workgraph.b64 > /tmp/workgraph.tar.xz
          printf '%s  %s\n' '611bece0014ecd6df974d9b98db7cee14c5492845882e4be3ce039b0e41d8ef7' /tmp/workgraph.tar.xz | sha256sum -c -
          tar -xJf /tmp/workgraph.tar.xz -C "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate shared engine and capture exact diagnostics
        id: validate
        shell: bash
        run: |
          set +e
          : > /tmp/workgraph-validation.log

          echo '== cargo fmt ==' | tee -a /tmp/workgraph-validation.log
          cargo fmt --manifest-path entroly-engine/Cargo.toml >>/tmp/workgraph-validation.log 2>&1
          fmt_status=$?

          unexpected=$(git diff --name-only | grep -Ev '^(entroly-engine/Cargo.toml|entroly-engine/src/lib.rs|entroly-engine/src/work_graph.rs)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'ERROR: rustfmt changed files outside the Work Graph patch:' | tee -a /tmp/workgraph-validation.log
            printf '%s\n' "$unexpected" | tee -a /tmp/workgraph-validation.log
            fmt_status=1
          fi

          echo '== cargo test ==' | tee -a /tmp/workgraph-validation.log
          cargo test --manifest-path entroly-engine/Cargo.toml --all-targets >>/tmp/workgraph-validation.log 2>&1
          test_status=$?

          echo '== cargo clippy ==' | tee -a /tmp/workgraph-validation.log
          cargo clippy --manifest-path entroly-engine/Cargo.toml --all-targets -- -D warnings >>/tmp/workgraph-validation.log 2>&1
          clippy_status=$?

          printf '\nfmt=%s test=%s clippy=%s\n' "$fmt_status" "$test_status" "$clippy_status" | tee -a /tmp/workgraph-validation.log
          cat /tmp/workgraph-validation.log

          if [ "$fmt_status" -eq 0 ] && [ "$test_status" -eq 0 ] && [ "$clippy_status" -eq 0 ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Publish failure diagnostics to feature branch
        if: steps.validate.outputs.ok != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/workgraph-validation.log .workgraph-bootstrap/validation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workgraph-bootstrap/validation.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore(work-graph): publish Rust validation diagnostics'
            git push origin HEAD:feat/ai-work-graph-v1
          fi

      - name: Commit validated semantic core only
        if: steps.validate.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .workgraph-bootstrap
          git rm -f .github/workflows/workgraph-assemble.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entroly-engine/Cargo.toml entroly-engine/src/lib.rs entroly-engine/src/work_graph.rs
          git commit -m 'feat(engine): add evidence-backed AI Work Graph core'
          git push origin HEAD:feat/ai-work-graph-v1

name: Validate Work Graph Integration

on:
  push:
    branches: [audit/full-codebase-snapshot-20260817]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ai-work-graph-v1
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Wire thin bindings into shipped surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def insert_once(path: str, needle: str, addition: str) -> None:
              p = Path(path)
              text = p.read_text()
              if addition.strip() in text:
                  return
              if needle not in text:
                  raise SystemExit(f"registration anchor missing in {path}: {needle!r}")
              p.write_text(text.replace(needle, needle + addition, 1))

          insert_once(
              "entroly-core/src/lib.rs",
              "mod witness;\n",
              "mod work_graph_bindings;\n",
          )
          insert_once(
              "entroly-core/src/lib.rs",
              "    m.add_class::<PyDedupIndex>()?;\n",
              "    work_graph_bindings::register(m)?;\n",
          )
          insert_once(
              "entroly-wasm/src/lib.rs",
              "pub(crate) use entroly_engine::utilization;\n",
              "mod work_graph_bindings;\n",
          )
          insert_once(
              "entroly-wasm/index.js",
              "const { VaultObserver } = require('./js/vault_observer');\n",
              "const { WorkGraph } = require('./js/work_graph');\n"
              "const { RepositoryDiscoveryError, discoverRepositoryObservation } = require('./js/work_graph_repo');\n",
          )
          insert_once(
              "entroly-wasm/index.js",
              "  WasmEntrolyEngine,\n",
              "  WorkGraph,\n"
              "  RepositoryDiscoveryError,\n"
              "  discoverRepositoryObservation,\n",
          )

          dts = Path("entroly-wasm/index.d.ts")
          dts_text = dts.read_text()
          for export_line in (
              'export * from "./js/work_graph";\n',
              'export * from "./js/work_graph_repo";\n',
          ):
              if export_line not in dts_text:
                  dts_text = dts_text.rstrip() + "\n\n" + export_line
          dts.write_text(dts_text)

          package_path = Path("entroly-wasm/package.json")
          package = json.loads(package_path.read_text())
          files = package.setdefault("files", [])
          for item in (
              "js/work_graph.js",
              "js/work_graph.d.ts",
              "js/work_graph_repo.js",
              "js/work_graph_repo.d.ts",
          ):
              if item not in files:
                  files.append(item)
          package.setdefault("scripts", {})["test"] = (
              "node test_wasm_e2e.js && "
              "node test_work_graph.js && "
              "node test_work_graph_repo.js"
          )
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          init_path = Path("entroly/__init__.py")
          init_text = init_path.read_text()
          graph_marker = "from .work_graph import WorkGraph, WorkGraphUnavailableError"
          if graph_marker not in init_text:
              init_text = (
                  init_text.rstrip()
                  + "\n\n# AI Work Graph — shared Rust temporal work-state engine. Python remains\n"
                  + "# orchestration-only; inference/trust/handoff semantics live in Rust.\n"
                  + "try:\n"
                  + "    from .work_graph import WorkGraph, WorkGraphUnavailableError  # noqa: F401\n"
                  + "except ImportError:\n"
                  + "    pass\n"
              )
          repo_marker = "from .work_graph_repo import RepositoryDiscoveryError, discover_repository_observation"
          if repo_marker not in init_text:
              init_text = (
                  init_text.rstrip()
                  + "\n\nfrom .work_graph_repo import (  # noqa: F401\n"
                  + "    RepositoryDiscoveryError,\n"
                  + "    discover_repository_observation,\n"
                  + ")\n"
              )
          init_path.write_text(init_text)
          PY

      - name: Validate engine, PyO3, WASM, Python and npm contracts
        id: validate
        shell: bash
        run: |
          set +e
          LOG=/tmp/workgraph-integration.log
          : > "$LOG"
          failed=0

          run_check() {
            name="$1"; shift
            printf '\n===== %s =====\n' "$name" | tee -a "$LOG"
            "$@" >>"$LOG" 2>&1
            status=$?
            printf 'status=%s\n' "$status" | tee -a "$LOG"
            if [ "$status" -ne 0 ]; then failed=1; fi
          }

          run_check rustfmt_engine rustfmt --edition 2021 --check entroly-engine/src/work_graph.rs
          run_check rustfmt_core rustfmt --edition 2021 --check entroly-core/src/work_graph_bindings.rs
          run_check rustfmt_wasm rustfmt --edition 2021 --check entroly-wasm/src/work_graph_bindings.rs

          # Refresh only what Cargo needs after the shared-engine dependency and
          # binding modules, then prove subsequent builds work with --locked.
          run_check lock_engine cargo check --manifest-path entroly-engine/Cargo.toml
          run_check lock_core cargo check --manifest-path entroly-core/Cargo.toml
          run_check lock_wasm cargo check --manifest-path entroly-wasm/Cargo.toml

          run_check test_engine cargo test --manifest-path entroly-engine/Cargo.toml --all-targets --locked
          run_check clippy_engine cargo clippy --manifest-path entroly-engine/Cargo.toml --all-targets --locked -- -D warnings
          run_check test_core cargo test --manifest-path entroly-core/Cargo.toml --lib --locked
          run_check clippy_core cargo clippy --manifest-path entroly-core/Cargo.toml --all-targets --locked -- -D warnings
          run_check test_wasm_host cargo test --manifest-path entroly-wasm/Cargo.toml --lib --locked
          run_check check_wasm32 cargo check --manifest-path entroly-wasm/Cargo.toml --target wasm32-unknown-unknown --locked
          run_check clippy_wasm32 cargo clippy --manifest-path entroly-wasm/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings

          run_check python_compile python -m compileall -q \
            entroly/work_graph.py entroly/work_graph_repo.py \
            tests/test_work_graph_bindings.py tests/test_work_graph_repo.py
          run_check python_tools python -m pip install -q maturin pytest ruff
          run_check python_ruff ruff check \
            entroly/work_graph.py entroly/work_graph_repo.py \
            tests/test_work_graph_bindings.py tests/test_work_graph_repo.py
          run_check python_git_observer python -m pytest -q tests/test_work_graph_repo.py
          run_check maturin_develop bash -lc 'cd entroly-core && maturin develop --release'
          run_check python_contract python -m pytest -q tests/test_work_graph_bindings.py tests/test_work_graph_repo.py

          if command -v wasm-pack >/dev/null 2>&1; then
            echo 'wasm-pack already available' >>"$LOG"
          else
            run_check wasm_pack_install cargo install wasm-pack --locked
          fi
          run_check wasm_pack_build bash -lc 'cd entroly-wasm && wasm-pack build --target nodejs --out-dir pkg'
          run_check node_existing_contract node entroly-wasm/test_wasm_e2e.js
          run_check node_workgraph_contract node entroly-wasm/test_work_graph.js
          run_check node_git_observer node entroly-wasm/test_work_graph_repo.js
          run_check node_workgraph_syntax node --check entroly-wasm/js/work_graph.js
          run_check node_git_syntax node --check entroly-wasm/js/work_graph_repo.js
          run_check npm_pack bash -lc 'cd entroly-wasm && npm pack --dry-run'
          run_check git_diff_check git diff --check

          cat "$LOG"
          if [ "$failed" -eq 0 ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Publish exact integration diagnostics safely
        if: steps.validate.outputs.ok != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          git fetch origin feat/ai-work-graph-v1
          git rebase origin/feat/ai-work-graph-v1
          cp /tmp/workgraph-integration.log .workgraph-validation-bindings.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workgraph-validation-bindings.txt
          git commit -m 'chore(work-graph): publish cross-runtime validation diagnostics'
          git push origin HEAD:feat/ai-work-graph-v1

      - name: Commit validated cross-runtime integration safely
        if: steps.validate.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/workgraph-integration.patch
          git reset --hard HEAD
          git clean -fd
          git fetch origin feat/ai-work-graph-v1
          git rebase origin/feat/ai-work-graph-v1
          git apply /tmp/workgraph-integration.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            entroly-engine/Cargo.lock \
            entroly-core/Cargo.lock \
            entroly-core/src/lib.rs \
            entroly-core/src/work_graph_bindings.rs \
            entroly-wasm/Cargo.lock \
            entroly-wasm/src/lib.rs \
            entroly-wasm/src/work_graph_bindings.rs \
            entroly-wasm/index.js \
            entroly-wasm/index.d.ts \
            entroly-wasm/package.json \
            entroly-wasm/js/work_graph.js \
            entroly-wasm/js/work_graph.d.ts \
            entroly-wasm/js/work_graph_repo.js \
            entroly-wasm/js/work_graph_repo.d.ts \
            entroly-wasm/test_work_graph.js \
            entroly-wasm/test_work_graph_repo.js \
            entroly/__init__.py \
            entroly/work_graph.py \
            entroly/work_graph_repo.py \
            tests/test_work_graph_bindings.py \
            tests/test_work_graph_repo.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat: expose AI Work Graph across Python and npm'
            git push origin HEAD:feat/ai-work-graph-v1
          fi

name: Apply Work Graph Core

on:
  push:
    branches: [audit/full-codebase-snapshot-20260817]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ai-work-graph-v1
          fetch-depth: 0

      - name: Reconstruct exact clippy-clean payload
        shell: bash
        run: |
          set -euo pipefail
          cat .workgraph-bootstrap/v4-00 .workgraph-bootstrap/v4-01 .workgraph-bootstrap/v4-02 > /tmp/workgraph.b64
          test "$(wc -c < /tmp/workgraph.b64)" -eq 27804
          printf '%s  %s\n' '21c90d989f1b618918a7069405d55bb7ef83fb9ce3348535945eb836d021c4e8' /tmp/workgraph.b64 | sha256sum -c -
          base64 -d /tmp/workgraph.b64 > /tmp/workgraph.tar.xz
          printf '%s  %s\n' 'bc285978581e3b22294736653b1ec744cc423f4c08c84d17af87e1ca57b164f1' /tmp/workgraph.tar.xz | sha256sum -c -
          tar -xJf /tmp/workgraph.tar.xz -C "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format new module only
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 entroly-engine/src/work_graph.rs

      - name: Validate shared engine
        id: validate
        shell: bash
        run: |
          set +e
          : > /tmp/workgraph-validation.log
          echo '== rustfmt work_graph --check ==' | tee -a /tmp/workgraph-validation.log
          rustfmt --edition 2021 --check entroly-engine/src/work_graph.rs >>/tmp/workgraph-validation.log 2>&1
          fmt_status=$?
          echo '== cargo test ==' | tee -a /tmp/workgraph-validation.log
          cargo test --manifest-path entroly-engine/Cargo.toml --all-targets >>/tmp/workgraph-validation.log 2>&1
          test_status=$?
          echo '== cargo clippy ==' | tee -a /tmp/workgraph-validation.log
          cargo clippy --manifest-path entroly-engine/Cargo.toml --all-targets -- -D warnings >>/tmp/workgraph-validation.log 2>&1
          clippy_status=$?
          printf '\nfmt=%s test=%s clippy=%s\n' "$fmt_status" "$test_status" "$clippy_status" | tee -a /tmp/workgraph-validation.log
          cat /tmp/workgraph-validation.log
          if [ "$fmt_status" -eq 0 ] && [ "$test_status" -eq 0 ] && [ "$clippy_status" -eq 0 ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Publish failure diagnostics to feature branch
        if: steps.validate.outputs.ok != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/workgraph-validation.log .workgraph-bootstrap/validation-final.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workgraph-bootstrap/validation-final.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore(work-graph): publish final Rust diagnostics'
            git push origin HEAD:feat/ai-work-graph-v1
          fi

      - name: Commit validated semantic core only
        if: steps.validate.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .workgraph-bootstrap
          git rm -f .github/workflows/workgraph-assemble.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entroly-engine/Cargo.toml entroly-engine/src/lib.rs entroly-engine/src/work_graph.rs
          git commit -m 'feat(engine): add evidence-backed AI Work Graph core'
          git push origin HEAD:feat/ai-work-graph-v1

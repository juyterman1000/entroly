name: PR280 bounded demo repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr280-demo-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'audit/deep-dogfood-20260804'
    name: Replace unbounded demo indexing path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENTROLY_DISABLE_UPDATE_CHECK: "1"
      ENTROLY_NO_DOCKER: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/deep-dogfood-20260804
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply root-cause repair and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("entroly/cli.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def cmd_demo(args):\n")
          end = text.index("\ndef _simulation_queries(args) -> list[str]:\n", start)
          replacement = '''def cmd_demo(args):
              """Run the bounded, no-key local demo through the shared simulation path.

              ``demo``, ``simulate``, and ``perf`` must measure the same indexed
              surface.  Keeping a separate auto-index implementation here previously
              bypassed the smoke-test file cap and could spend minutes ingesting a
              large repository before printing any result.
              """
              report = _run_local_simulation(args)
              if getattr(args, "json", False):
                  print(json.dumps(report, indent=2))
                  return

              _print_local_simulation(report, title="Entroly Demo", include_perf=False)
              if report["files_indexed"] == 0:
                  return

              from entroly.value_tracker import estimate_cost

              per_query_saved = report["total_tokens_saved"] // max(
                  len(report["queries"]), 1
              )
              print(
                  f"  {C.BOLD}Per-query savings{C.RESET} "
                  f"(current input rates, {per_query_saved:,} tokens saved/query):"
              )
              for model in ("gpt-4o", "claude-sonnet-4", "gemini-2.5-pro"):
                  print(
                      f"    {C.CYAN}{model:25s}{C.RESET} "
                      f"${estimate_cost(per_query_saved, model):.4f}/query"
                  )
              print(
                  f"  {C.GRAY}Multiply by your actual request volume. "
                  f"We don't know what that is.{C.RESET}"
              )

              recommended = _recommend_quality(
                  _detect_project_type(), report["files_indexed"]
              )
              print(f"""
              {C.GREEN}{C.BOLD}Get started:{C.RESET}
                {C.CYAN}entroly go{C.RESET}                One command: init + proxy + dashboard
                {C.CYAN}entroly proxy --quality {recommended}{C.RESET}  Start optimizing
            """)
          '''
          # The source is top-level, so remove the indentation used to keep this
          # workflow's embedded Python readable.
          import textwrap
          replacement = textwrap.dedent(replacement)
          text = text[:start] + replacement + text[end:]

          old_parser = '''    # entroly demo (Gap #41)
              subparsers.add_parser(
                  "demo",
                  help="Quick-win demo: before/after comparison showing token savings",
              )
          '''
          old_parser = textwrap.dedent(old_parser).replace(
              "# entroly demo", "    # entroly demo"
          ).replace("subparsers.add_parser", "    subparsers.add_parser").replace(
              '    "demo",', '        "demo",'
          ).replace(
              '    help="Quick-win', '        help="Quick-win'
          ).replace("\n)", "\n    )")
          # Use a literal known-good block rather than relying on indentation
          # transformations above if the exact source is present.
          old_parser = '''    # entroly demo (Gap #41)
              subparsers.add_parser(
                  "demo",
                  help="Quick-win demo: before/after comparison showing token savings",
              )
          '''
          old_parser = textwrap.dedent(old_parser)
          old_parser = old_parser.replace("subparsers", "    subparsers", 1)
          old_parser = old_parser.replace('\n    "demo",', '\n        "demo",')
          old_parser = old_parser.replace('\n    help=', '\n        help=')
          old_parser = old_parser.replace('\n)', '\n    )')
          canonical_old = '''    # entroly demo (Gap #41)
              subparsers.add_parser(
                  "demo",
                  help="Quick-win demo: before/after comparison showing token savings",
              )
          '''
          canonical_old = textwrap.dedent(canonical_old)
          # Exact block from cli.py:
          canonical_old = """    # entroly demo (Gap #41)\n    subparsers.add_parser(\n        \"demo\",\n        help=\"Quick-win demo: before/after comparison showing token savings\",\n    )\n"""
          new_parser = """    # entroly demo (bounded local measurement)\n    demo_parser = subparsers.add_parser(\n        \"demo\",\n        help=\"Quick-win demo: before/after comparison showing token savings\",\n    )\n    _add_local_measure_args(demo_parser)\n"""
          if text.count(canonical_old) != 1:
              raise SystemExit(
                  f"expected one demo parser block, found {text.count(canonical_old)}"
              )
          text = text.replace(canonical_old, new_parser)
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_demo_dogfood.py")
          test_path.write_text('''from __future__ import annotations

import ast
import inspect
from types import SimpleNamespace

from entroly import cli


def test_demo_delegates_to_bounded_shared_simulation(monkeypatch, capsys):
    args = SimpleNamespace(
        max_files=7,
        budget=2048,
        baseline=0,
        query=[],
        json=False,
    )
    report = {
        "files_indexed": 7,
        "repo_tokens_indexed": 20_000,
        "budget": 2048,
        "baseline_tokens_per_query": 20_000,
        "queries": [{"query": "q"}],
        "total_tokens_saved": 12_000,
    }
    observed = {}

    def fake_run(received):
        observed["args"] = received
        return report

    monkeypatch.setattr(cli, "_run_local_simulation", fake_run)
    monkeypatch.setattr(cli, "_print_local_simulation", lambda *a, **k: None)
    monkeypatch.setattr(cli, "_detect_project_type", lambda: "python")
    monkeypatch.setattr(cli, "_recommend_quality", lambda *_: "balanced")

    cli.cmd_demo(args)

    assert observed["args"] is args
    assert "Get started" in capsys.readouterr().out


def test_demo_cannot_reintroduce_direct_auto_indexing():
    tree = ast.parse(inspect.getsource(cli.cmd_demo))
    calls = {
        node.func.id
        for node in ast.walk(tree)
        if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
    }
    assert "_run_local_simulation" in calls
    assert "auto_index" not in calls


def test_demo_json_output_is_machine_readable(monkeypatch, capsys):
    args = SimpleNamespace(json=True)
    report = {
        "mode": "local_no_llm",
        "files_indexed": 0,
        "queries": [],
        "total_tokens_saved": 0,
    }
    monkeypatch.setattr(cli, "_run_local_simulation", lambda _: report)

    cli.cmd_demo(args)

    import json

    assert json.loads(capsys.readouterr().out) == report
''', encoding="utf-8")
          PY

      - name: Validate focused behavior and real large-repo journey
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]" pytest-timeout psutil
          python -m compileall -q entroly tests/test_demo_dogfood.py
          python -m pytest tests/test_demo_dogfood.py tests/test_cli.py -q --tb=short --timeout=120
          export HOME="$RUNNER_TEMP/demo-home"
          export ENTROLY_DIR="$RUNNER_TEMP/demo-home/.entroly"
          mkdir -p "$HOME" "$ENTROLY_DIR"
          timeout 90 entroly demo > "$RUNNER_TEMP/demo-default.log" 2>&1
          timeout 30 entroly demo --max-files 1 --json > "$RUNNER_TEMP/demo-json.log" 2>&1
          python -m json.tool "$RUNNER_TEMP/demo-json.log" >/dev/null
          grep -F "Entroly Demo" "$RUNNER_TEMP/demo-default.log"

      - name: Commit only verified product and test changes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr280-demo-repair.yml
          git add entroly/cli.py tests/test_demo_dogfood.py
          git diff --cached --check
          changed="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' entroly/cli.py tests/test_demo_dogfood.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git commit -m "fix(cli): bound demo indexing through shared simulation"
          git push origin HEAD:audit/deep-dogfood-20260804

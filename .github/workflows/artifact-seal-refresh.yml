name: Temporary canonical artifact seal refresh

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artifact-seal-refresh-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/distribution-control-plane'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/distribution-control-plane
          fetch-depth: 0

      - name: Install focused dependencies
        run: python -m pip install -e ".[test]"

      - name: Refresh canonical sidecar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          artifact = Path("benchmarks/results/receipt_fragment_fidelity_default.json")
          sidecar = artifact.with_suffix(artifact.suffix + ".sha256")
          canonical = artifact.read_bytes().replace(b"\r\n", b"\n")
          digest = hashlib.sha256(canonical).hexdigest()
          sidecar.write_text(f"{digest}  {artifact.name}\n", encoding="ascii")
          print(f"canonical artifact digest: {digest}")
          PY

      - name: Validate evidence and policy contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_readme_claims.py
          python scripts/check_external_name_policy.py
          python scripts/check_distribution_surface.py

      - name: Commit validated sidecar only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git restore --source=HEAD --worktree --staged -- .github/workflows/artifact-seal-refresh.yml
          git add benchmarks/results/receipt_fragment_fidelity_default.json.sha256
          if git diff --cached --quiet; then
            echo "Sidecar already canonical."
            exit 0
          fi
          git commit -m "fix(evidence): seal neutral fidelity artifact canonically"
          git push origin HEAD:feat/distribution-control-plane

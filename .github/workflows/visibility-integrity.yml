name: Visibility and Distribution Integrity

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/visibility-integrity.yml'
      - 'CITATION.cff'
      - 'README.md'
      - 'codemeta.json'
      - 'docs/BENCHMARKS.md'
      - 'docs/distribution/**'
      - 'docs/independent-review-program.md'
      - 'docs/press-kit.md'
      - 'llms.txt'
      - 'marketing/**'
      - 'pyproject.toml'
      - 'scripts/bump_version.py'
      - 'scripts/check_distribution_surface.py'
      - 'scripts/check_external_name_policy.py'
      - 'server.json'
      - 'tests/test_distribution_surface.py'
      - 'tests/test_visibility_release_sync.py'
  push:
    branches:
      - main
    paths:
      - '.claude-plugin/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/visibility-integrity.yml'
      - 'CITATION.cff'
      - 'README.md'
      - 'codemeta.json'
      - 'docs/BENCHMARKS.md'
      - 'docs/distribution/**'
      - 'docs/independent-review-program.md'
      - 'docs/press-kit.md'
      - 'llms.txt'
      - 'marketing/**'
      - 'pyproject.toml'
      - 'scripts/bump_version.py'
      - 'scripts/check_distribution_surface.py'
      - 'scripts/check_external_name_policy.py'
      - 'server.json'
      - 'tests/test_distribution_surface.py'
      - 'tests/test_visibility_release_sync.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visibility-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate owned visibility surface
        run: |
          python scripts/check_distribution_surface.py
          python scripts/check_external_name_policy.py

      - name: Run visibility and release-sync tests
        run: >-
          python -m pytest
          tests/test_distribution_surface.py
          tests/test_visibility_release_sync.py
          tests/test_bump_version.py
          -q

      - name: Verify launch assets remain drafts
        shell: bash
        run: |
          set -euo pipefail
          grep -RFl 'Status: prepared, not submitted.' marketing/launch/*.md >/dev/null
          if grep -REi '\b(zero quality loss|guaranteed savings|best context (tool|engine|compressor))\b' marketing/launch; then
            echo '::error::Launch assets contain an unsupported claim.'
            exit 1
          fi

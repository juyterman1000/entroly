name: PR280 trusted transactional repair

on:
  pull_request:
    branches: [main]
  push:
    branches: [audit/deep-dogfood-20260804]

permissions:
  contents: write

concurrency:
  group: pr280-trusted-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'audit/deep-dogfood-20260804'
    name: Repair bounded demo and restore audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENTROLY_DISABLE_UPDATE_CHECK: "1"
      ENTROLY_NO_DOCKER: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/deep-dogfood-20260804
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply exact root-cause repair and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          cli_path = Path("entroly/cli.py")
          text = cli_path.read_text(encoding="utf-8")
          start = text.index("def cmd_demo(args):\n")
          end = text.index("\ndef _simulation_queries(args) -> list[str]:\n", start)
          replacement = textwrap.dedent('''
          def cmd_demo(args):
              """Run the bounded no-key demo through the shared simulation path.

              ``demo``, ``simulate``, and ``perf`` must measure the same indexed
              surface. A separate auto-index path previously bypassed the file cap
              and could spend minutes ingesting a large repository before printing.
              """
              report = _run_local_simulation(args)
              if getattr(args, "json", False):
                  print(json.dumps(report, indent=2))
                  return

              _print_local_simulation(report, title="Entroly Demo", include_perf=False)
              if report["files_indexed"] == 0:
                  return

              from entroly.value_tracker import estimate_cost

              per_query_saved = report["total_tokens_saved"] // max(
                  len(report["queries"]), 1
              )
              print(
                  f"  {C.BOLD}Per-query savings{C.RESET} "
                  f"(current input rates, {per_query_saved:,} tokens saved/query):"
              )
              for model in ("gpt-4o", "claude-sonnet-4", "gemini-2.5-pro"):
                  cost = estimate_cost(per_query_saved, model)
                  print(f"    {C.CYAN}{model:25s}{C.RESET} ${cost:.4f}/query")
              print(
                  f"  {C.GRAY}Multiply by your actual request volume. "
                  f"We don't know what that is.{C.RESET}"
              )

              recommended = _recommend_quality(
                  _detect_project_type(), report["files_indexed"]
              )
              print(f"""
              {C.GREEN}{C.BOLD}Get started:{C.RESET}
                {C.CYAN}entroly go{C.RESET}                One command: init + proxy + dashboard
                {C.CYAN}entroly proxy --quality {recommended}{C.RESET}  Start optimizing
            """)
          ''').lstrip()
          text = text[:start] + replacement + text[end:]

          old_parser = """    # entroly demo (Gap #41)\n    subparsers.add_parser(\n        \"demo\",\n        help=\"Quick-win demo: before/after comparison showing token savings\",\n    )\n"""
          new_parser = """    # entroly demo (bounded local measurement)\n    demo_parser = subparsers.add_parser(\n        \"demo\",\n        help=\"Quick-win demo: before/after comparison showing token savings\",\n    )\n    _add_local_measure_args(demo_parser)\n"""
          if text.count(old_parser) != 1:
              raise SystemExit(f"expected one demo parser block, found {text.count(old_parser)}")
          cli_path.write_text(text.replace(old_parser, new_parser), encoding="utf-8")

          Path("tests/test_demo_dogfood.py").write_text('''from __future__ import annotations

import ast
import inspect
import json
from types import SimpleNamespace

from entroly import cli


def test_demo_delegates_to_bounded_shared_simulation(monkeypatch, capsys):
    args = SimpleNamespace(max_files=7, budget=2048, baseline=0, query=[], json=False)
    report = {
        "files_indexed": 7,
        "repo_tokens_indexed": 20_000,
        "budget": 2048,
        "baseline_tokens_per_query": 20_000,
        "queries": [{"query": "q"}],
        "total_tokens_saved": 12_000,
    }
    observed = {}

    def fake_run(received):
        observed["args"] = received
        return report

    monkeypatch.setattr(cli, "_run_local_simulation", fake_run)
    monkeypatch.setattr(cli, "_print_local_simulation", lambda *a, **k: None)
    monkeypatch.setattr(cli, "_detect_project_type", lambda: "python")
    monkeypatch.setattr(cli, "_recommend_quality", lambda *_: "balanced")
    cli.cmd_demo(args)
    assert observed["args"] is args
    assert "Get started" in capsys.readouterr().out


def test_demo_cannot_reintroduce_direct_auto_indexing():
    tree = ast.parse(inspect.getsource(cli.cmd_demo))
    calls = {
        node.func.id
        for node in ast.walk(tree)
        if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
    }
    assert "_run_local_simulation" in calls
    assert "auto_index" not in calls


def test_demo_json_output_is_machine_readable(monkeypatch, capsys):
    args = SimpleNamespace(json=True)
    report = {
        "mode": "local_no_llm",
        "files_indexed": 0,
        "queries": [],
        "total_tokens_saved": 0,
    }
    monkeypatch.setattr(cli, "_run_local_simulation", lambda _: report)
    cli.cmd_demo(args)
    assert json.loads(capsys.readouterr().out) == report
''', encoding="utf-8")
          PY

      - name: Validate focused and real clean-user behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]" pytest-timeout psutil
          python -m compileall -q entroly tests/test_demo_dogfood.py
          python -m pytest tests/test_demo_dogfood.py tests/test_cli.py -q --tb=short --timeout=120
          export HOME="$RUNNER_TEMP/demo-home"
          export ENTROLY_DIR="$RUNNER_TEMP/demo-home/.entroly"
          mkdir -p "$HOME" "$ENTROLY_DIR"
          timeout 90 entroly demo > "$RUNNER_TEMP/demo-default.log" 2>&1
          timeout 30 entroly demo --max-files 1 --json > "$RUNNER_TEMP/demo-json.log" 2>&1
          python -m json.tool "$RUNNER_TEMP/demo-json.log" >/dev/null
          grep -F "Entroly Demo" "$RUNNER_TEMP/demo-default.log"

      - name: Restore permanent workflow and final audit definitions
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr280-demo-repair.yml
          rm -f .github/workflows/pr280-demo-repair-push.yml

          cat > .github/workflows/visibility-integrity.yml <<'YAML'
          name: Visibility and Distribution Integrity

          on:
            pull_request:
              paths:
                - '.claude-plugin/**'
                - '.github/ISSUE_TEMPLATE/**'
                - '.github/workflows/visibility-integrity.yml'
                - 'CITATION.cff'
                - 'codemeta.json'
                - 'docs/distribution/**'
                - 'docs/independent-review-program.md'
                - 'docs/press-kit.md'
                - 'llms.txt'
                - 'marketing/**'
                - 'pyproject.toml'
                - 'scripts/bump_version.py'
                - 'scripts/check_distribution_surface.py'
                - 'scripts/check_external_name_policy.py'
                - 'server.json'
                - 'tests/test_distribution_surface.py'
                - 'tests/test_visibility_release_sync.py'
            push:
              branches: [main]
              paths:
                - '.claude-plugin/**'
                - '.github/ISSUE_TEMPLATE/**'
                - '.github/workflows/visibility-integrity.yml'
                - 'CITATION.cff'
                - 'codemeta.json'
                - 'docs/distribution/**'
                - 'docs/independent-review-program.md'
                - 'docs/press-kit.md'
                - 'llms.txt'
                - 'marketing/**'
                - 'pyproject.toml'
                - 'scripts/bump_version.py'
                - 'scripts/check_distribution_surface.py'
                - 'scripts/check_external_name_policy.py'
                - 'server.json'
                - 'tests/test_distribution_surface.py'
                - 'tests/test_visibility_release_sync.py'
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: visibility-integrity-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            validate:
              name: Python ${{ matrix.python-version }}
              runs-on: ubuntu-latest
              strategy:
                fail-fast: false
                matrix:
                  python-version: ['3.10', '3.14']
              steps:
                - name: Checkout
                  uses: actions/checkout@v6
                - name: Set up Python
                  uses: actions/setup-python@v7
                  with:
                    python-version: ${{ matrix.python-version }}
                - name: Install focused test dependency
                  run: python -m pip install --disable-pip-version-check pytest
                - name: Validate owned visibility surface
                  run: |
                    python scripts/check_distribution_surface.py
                    python scripts/check_external_name_policy.py
                - name: Run visibility and release-sync tests
                  run: >-
                    python -m pytest
                    tests/test_distribution_surface.py
                    tests/test_visibility_release_sync.py
                    tests/test_bump_version.py
                    -q
                - name: Verify launch assets remain drafts
                  shell: bash
                  run: |
                    set -euo pipefail
                    grep -RFl 'Status: prepared, not submitted.' marketing/launch/*.md >/dev/null
                    if grep -REi '\b(zero quality loss|guaranteed savings|best context (tool|engine|compressor))\b' marketing/launch; then
                      echo '::error::Launch assets contain an unsupported claim.'
                      exit 1
                    fi
          YAML

          cat > .github/workflows/deep-audit-export.yml <<'YAML'
          name: Deep audit final gate

          on:
            push:
              branches: [audit/deep-dogfood-20260804]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          concurrency:
            group: deep-audit-final-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            audit:
              name: Clean-user journeys and complete Python surface
              runs-on: ubuntu-latest
              timeout-minutes: 45
              env:
                ENTROLY_DISABLE_UPDATE_CHECK: "1"
                ENTROLY_NO_DOCKER: "1"
                PYTHONUTF8: "1"
              steps:
                - uses: actions/checkout@v6
                  with:
                    fetch-depth: 0
                - uses: actions/setup-python@v7
                  with:
                    python-version: "3.12"
                - name: Compile and install source-package surface
                  run: |
                    python -m compileall -q entroly tests scripts benchmarks examples
                    python -m pip install --upgrade pip
                    python -m pip install -e ".[test,proxy]" pytest-timeout psutil bandit PyYAML
                    python -m pip check
                - name: Run documented no-key user journeys
                  shell: bash
                  run: |
                    set -euo pipefail
                    export HOME="$RUNNER_TEMP/clean-home"
                    export ENTROLY_DIR="$RUNNER_TEMP/clean-home/.entroly"
                    mkdir -p "$HOME" "$ENTROLY_DIR"
                    entroly --version
                    entroly capabilities
                    entroly config
                    entroly doctor
                    timeout 90 entroly verify-claims
                    timeout 90 entroly simulate
                    timeout 90 entroly demo
                    timeout 90 entroly health
                    timeout 30 entroly demo --max-files 1 --json | python -m json.tool >/dev/null
                - name: Run complete pure-Python-compatible suite
                  run: |
                    pytest tests/ -q --tb=short --timeout=120 -p no:cacheprovider \
                      --ignore=tests/functional_test.py \
                      --ignore=tests/test_e2e.py \
                      --ignore=tests/test_ios.py \
                      --ignore=tests/test_rust_cogops.py \
                      --ignore=tests/test_deep_functional.py \
                      --ignore=tests/test_engine_isolation.py \
                      --ignore=tests/test_localization.py \
                      --ignore=tests/test_benchmark_harness.py
                - name: Capture all Bandit findings and enforce high severity
                  if: always()
                  shell: bash
                  run: |
                    set +e
                    mkdir -p "$RUNNER_TEMP/deep-audit"
                    bandit -r entroly -f json -o "$RUNNER_TEMP/deep-audit/bandit-all.json"
                    bandit -r entroly -lll -iii
                    status=$?
                    set -e
                    exit "$status"
                - name: Upload final audit evidence
                  if: always()
                  uses: actions/upload-artifact@v7
                  with:
                    name: deep-audit-final-evidence
                    path: ${{ runner.temp }}/deep-audit/
                    if-no-files-found: warn
                    retention-days: 3
          YAML

      - name: Commit verified source repair and restored workflows
        shell: bash
        run: |
          set -euo pipefail
          git add -A .github/workflows/deep-audit-export.yml \
            .github/workflows/visibility-integrity.yml \
            .github/workflows/pr280-demo-repair.yml \
            .github/workflows/pr280-demo-repair-push.yml \
            entroly/cli.py tests/test_demo_dogfood.py
          git diff --cached --check
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git commit -m "fix(cli): bound demo indexing through shared simulation"
          git push origin HEAD:audit/deep-dogfood-20260804

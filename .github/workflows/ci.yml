name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - "integration/**"

env:
  PIP_RETRIES: 10
  PIP_TIMEOUT: 120
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

# Superseded runs cancel themselves.
#
# Four pushes to one draft branch inside three minutes queued 26 duplicate runs
# and starved every other pull request of ubuntu runners for over an hour, while
# macOS and Windows -- separate runner pools -- finished in a minute. The older
# runs were validating commits that had already been replaced, so the queue was
# spent on answers nobody could use.
#
# Keyed on the pull request number so concurrent pull requests never cancel each
# other; `github.ref` is the fallback for push and dispatch events.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only pull-request runs cancel. A push to main can be the run that publishes,
  # tags, or syncs a release surface, and cancelling one of those mid-flight
  # leaves partial state behind -- exactly the "release automation stays boring"
  # rule in CLAUDE.md.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.12.9

      - name: Run ruff check
        run: ruff check entroly/

  openclaw-context-engine:
    name: OpenClaw Context Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # `pip install -e .` resolves entroly-core from PyPI, and a release
      # candidate raises that minimum before the core is published -- so this
      # job failed at dependency resolution, never reaching a test:
      #
      #   ERROR: No matching distribution found for entroly-core<2,>=1.0.79
      #
      # The canonical helper builds the native core from this same checkout
      # first. Reused rather than reimplemented: this file already carried three
      # different bootstrap strategies, and only the divergent one was broken.
      - name: Install Python bridge test dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/ci_install_exact_head.py --extra-package pytest

      - name: Test Python bridge contract
        run: pytest tests/test_openclaw_bridge.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"

      - name: Test OpenClaw plugin package
        working-directory: integrations/openclaw
        env:
          ENTROLY_TEST_PYTHON: python
        run: |
          npm test
          npm run check
          npm pack --dry-run

      - name: Test minimum supported OpenClaw host
        working-directory: integrations/openclaw
        run: |
          smoke_dir="$RUNNER_TEMP/entroly-openclaw-host-smoke"
          mkdir -p "$smoke_dir"
          plugin_tarball="$(npm pack --pack-destination "$smoke_dir")"
          npm install --prefix "$smoke_dir" --no-save --ignore-scripts --package-lock=false openclaw@2026.6.11 "$smoke_dir/$plugin_tarball"
          node --input-type=module -e "await import('file://$smoke_dir/node_modules/entroly-openclaw/index.js')"

  memory-os:
    name: MemoryOS Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MemoryOS test surface without runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install pytest pytest-timeout --timeout 120 --retries 5

      - name: Run MemoryOS/Fabric tests
        run: pytest tests/test_memory_os.py tests/test_memory_cli.py tests/test_memory_launcher.py tests/test_memory_package_metadata.py tests/test_memory_stress_benchmark.py tests/test_memory_e2e_demo.py tests/test_memory_fabric.py tests/test_memory_fabric_benchmark.py tests/test_memory_fabric_e2e_demo.py -v --tb=short --timeout=60

      - name: Run MemoryOS stress benchmark
        run: python benchmarks/memory_stress_test.py --json

      - name: Run MemoryOS end-to-end demo
        run: python examples/memory_os_e2e_demo.py --json

      - name: Run Memory Fabric stress benchmark
        run: python benchmarks/memory_fabric_stress_test.py --json

      - name: Run Memory Fabric end-to-end demo
        run: python examples/memory_fabric_e2e_demo.py --json

  rust-tests:
    name: Rust Tests + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: entroly-core

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Python
        # pyo3 needs libpython at link time when the extension-module feature
        # is off (which it is for `cargo test --lib`).
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            entroly-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('entroly-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # entroly-engine holds the shared algorithms and must be exercised in BOTH
      # feature configurations. The default (no `python`) build is what
      # entroly-wasm compiles against, so a break there ships to npm even though
      # no Python test would notice it.
      - name: Clippy — engine (no python == the WebAssembly configuration)
        run: cargo clippy --manifest-path ../entroly-engine/Cargo.toml --all-targets -- -D warnings

      - name: Clippy — engine (python)
        run: cargo clippy --manifest-path ../entroly-engine/Cargo.toml --all-targets --features python -- -D warnings

      - name: Test — engine (no python == the WebAssembly configuration)
        run: cargo test --manifest-path ../entroly-engine/Cargo.toml --lib

      - name: Test — engine (python)
        run: cargo test --manifest-path ../entroly-engine/Cargo.toml --lib --features python

      - name: Clippy (lint)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --lib

  # The npm package had no CI at all, which is how entroly-wasm accumulated
  # 4,065 lines of drift from the core and shipped a similarity estimator the
  # PyO3 build had already corrected. Compiling for wasm32 on every push is what
  # makes the shared-engine split self-enforcing rather than a convention.
  wasm-build:
    name: WebAssembly Build + Drift Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            entroly-wasm/target
          key: ${{ runner.os }}-wasm-${{ hashFiles('entroly-wasm/Cargo.toml', 'entroly-engine/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Build for wasm32
        run: cargo check --manifest-path entroly-wasm/Cargo.toml --target wasm32-unknown-unknown

      - name: Clippy (wasm32)
        run: cargo clippy --manifest-path entroly-wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

      - name: Test (host target)
        run: cargo test --manifest-path entroly-wasm/Cargo.toml --lib

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"

      # Cross-runtime parity has to gate on the exact head, and it did not.
      # entroly-wasm's `npm test` runs only in deep-dogfood.yml, which is
      # triggered on pull_request to main and had not run on this SHA at all --
      # so the npm half of the shared semantics was ungated here while this job
      # reported green for building the same crate.
      #
      # Scoped to the receipt parity check rather than the whole npm suite: the
      # full suite belongs in deep-dogfood where it already lives, and this job
      # only needs to prove that the runtime it builds still agrees with Rust
      # and Python on the canonical commitment.
      - name: Cross-runtime Context Receipt parity
        working-directory: entroly-wasm
        run: |
          cargo install wasm-pack --locked
          npm run build
          node test_context_receipt_parity.js

      # Structural guard: re-adding a local copy of an engine module is exactly
      # how the two builds diverged before. Compilation alone will not catch it,
      # because a shadowing local `mod` is perfectly valid Rust.
      - name: Guard against re-duplicating engine modules
        run: |
          dupes=""
          for m in $(sed -n 's/^pub mod \([a-z0-9_]*\);$/\1/p' entroly-engine/src/lib.rs); do
            if [ -f "entroly-wasm/src/$m.rs" ]; then dupes="$dupes $m"; fi
            if [ -f "entroly-core/src/$m.rs" ]; then dupes="$dupes $m(core)"; fi
          done
          if [ -n "$dupes" ]; then
            echo "::error::These modules exist in entroly-engine AND in a binding crate:$dupes"
            echo "The binding crates must consume the engine, not re-copy it."
            exit 1
          fi
          echo "No duplicated engine modules."

  proxy-binary:
    name: Single-Binary Proxy (--features proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            entroly-core/target
          key: ${{ runner.os }}-cargo-proxy-${{ hashFiles('entroly-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The proxy server is behind the `proxy` feature, so the default
      # rust-tests job never compiles it. Build + lint + e2e it here so the
      # feature-gated code path cannot rot silently.
      - name: Clippy (proxy feature)
        working-directory: entroly-core
        run: cargo clippy --bin entroly-rs --features proxy -- -D warnings

      - name: Build proxy binary
        working-directory: entroly-core
        run: cargo build --release --bin entroly-rs --features proxy

      - name: CLI smoke test
        run: python scripts/binary_cli_smoke.py entroly-core/target/release/entroly-rs

      - name: Proxy end-to-end (compress + headers + SSE + concurrency)
        run: python scripts/proxy_e2e.py entroly-core/target/release/entroly-rs

  integration:
    name: Build Wheel + Functional Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # This cap has to leave room for the suite rather than track it. It sat at
    # 15 minutes from v1.0, when the suite was a fraction of its current size,
    # and by 2026-08-17 all five matrix entries were finishing in 13.7-14.3
    # minutes — under 80 seconds of margin each. The 3.11 entry then crossed
    # the line on ordinary runner variance and cancelled the job mid-suite:
    # 3825 tests passing, nothing broken, main red. The per-test `--timeout=60`
    # below is the real hang guard; this number only has to stay clear of
    # normal variance.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          # Receipt-fidelity tests compare against a pinned historical corpus.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install maturin and build entroly-core wheel
        run: |
          .venv/bin/pip install maturin --timeout 120 --retries 5
          cd entroly-core
          ../.venv/bin/maturin develop --release

      - name: Install entroly Python package
        run: |
          # maturin develop already installed entroly-core into the venv.
          # Install only the remaining runtime deps (mcp, httpx, starlette)
          # without re-resolving entroly-core from PyPI (0.3.0 isn't there yet).
          .venv/bin/pip install --timeout 120 --retries 5 -e . "mcp>=1.28.1,<2" "httpx>=0.27" "starlette>=0.37" "uvicorn>=0.30" psutil

      - name: Verify imports
        run: |
          .venv/bin/python -c "from entroly_core import EntrolyEngine; print('rust engine ok')"
          .venv/bin/python -c "from entroly.server import EntrolyEngine; print('server ok')"
          .venv/bin/python -c "from entroly.cli import _detect_project_type; print('cli ok')"
          .venv/bin/python -c "from entroly.auto_index import _should_index; print('auto_index ok')"
          .venv/bin/python -c "from entroly.verifiers import trace_provenance, forge_loop; print('verifiers ok')"

      - name: Run functional test
        run: .venv/bin/python tests/functional_test.py

      - name: Run production edge-case test
        run: .venv/bin/python tests/test_production_e2e.py

      - name: Run Python tests
        run: |
          .venv/bin/pip install pytest pytest-timeout --timeout 120 --retries 5
          # --durations prints the slowest tests on every run, so the growth
          # that consumed the old budget stays visible in the log instead of
          # only surfacing the next time it runs out of one.
          .venv/bin/pytest tests/ -v --tb=short -x --timeout=60 --durations=15

      - name: Run entroly-core integration tests
        run: |
          .venv/bin/python entroly-core/tests/test_integration.py
          .venv/bin/python entroly-core/tests/test_brutal.py

  python-fallback:
    # The 'integration' job always builds the Rust wheel, so it only ever
    # exercises the native path. But `pip install entroly` (no extras) ships
    # the PURE-PYTHON fallback — and that is what most users actually run.
    # That surface was untested in CI, which is exactly how an empty-output
    # bug in the Python compressor (tfidf IDF-degeneracy → "" → annihilated
    # prompt) shipped while every native-path test stayed green. This job
    # pins the base-install surface so that class of regression can't recur.
    name: Pure-Python Fallback (base `pip install entroly`, no Rust engine)
    runs-on: ubuntu-latest
    # Same stale-budget problem as 'integration', one push behind it: measured
    # at 11.8 minutes against the old 15, and it grows from the same suite.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          # Receipt-fidelity tests compare against a pinned historical corpus.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install entroly WITHOUT the native engine
        run: |
          # entroly-core IS a base dependency (users get the Rust engine by
          # default), so a plain `pip install -e .` pulls the engine once an
          # entroly-core wheel exists on PyPI — and this job would then test the
          # wrong surface. Install with --no-deps to genuinely exclude the
          # engine, then add exactly the runtime deps a real
          # `pip install entroly[proxy]` resolves (minus the native core).
          # Do NOT drop --no-deps.
          pip install --no-deps --timeout 120 --retries 5 -e .
          pip install --timeout 120 --retries 5 \
            "mcp>=1.28.1,<2" "httpx>=0.27" "starlette>=0.37" "uvicorn>=0.30" psutil \
            pytest pytest-timeout

      - name: Assert the Rust engine is genuinely absent
        run: |
          # If entroly_core leaks in, this job would silently test the wrong
          # surface. Fail loudly instead.
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("entroly_core") is not None:
              sys.exit("entroly_core is importable — this job must test the "
                       "pure-Python fallback, not the native engine.")
          from entroly.server import EntrolyEngine
          assert EntrolyEngine()._use_rust is False, "engine claims Rust is active"
          print("confirmed: pure-Python fallback surface")
          PY

      - name: Run the pure-Python test surface
        run: |
          # Tests that hard-require the native engine (import entroly_core at
          # module load, or assert Rust-exact numerics/result shapes) are
          # excluded — they belong to the 'integration' job. Everything else,
          # including the compress()/universal_compress non-annihilation
          # contract, MUST pass on the base install.
          pytest tests/ -v --tb=short --timeout=60 --durations=15 -p no:cacheprovider \
            --ignore=tests/functional_test.py \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_ios.py \
            --ignore=tests/test_rust_cogops.py \
            --ignore=tests/test_deep_functional.py \
            --ignore=tests/test_engine_isolation.py \
            --ignore=tests/test_localization.py \
            --ignore=tests/test_benchmark_harness.py

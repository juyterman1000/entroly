name: Context Snapshot Cross-Runtime Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'entroly/work_context_snapshot_store.py'
      - 'entroly/work_graph_store.py'
      - 'entroly/repository_intelligence/**'
      - 'entroly-wasm/**'
      - 'tests/test_work_context_snapshot_cross_runtime.py'
      - 'scripts/ci_install_exact_head.py'
      - '.github/workflows/context-snapshot-parity.yml'
  push:
    branches: [main]
    paths:
      - 'entroly/work_context_snapshot_store.py'
      - 'entroly/work_graph_store.py'
      - 'entroly/repository_intelligence/**'
      - 'entroly-wasm/**'
      - 'tests/test_work_context_snapshot_cross_runtime.py'
      - 'scripts/ci_install_exact_head.py'
      - '.github/workflows/context-snapshot-parity.yml'

permissions:
  contents: read

concurrency:
  group: context-snapshot-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install exact-head Python/native package
        run: python scripts/ci_install_exact_head.py --extras test
      - name: Build exact-head WASM package
        run: |
          cargo install wasm-pack --locked
          npm --prefix entroly-wasm run build
      - name: Syntax check Node snapshot store
        run: node --check entroly-wasm/js/work_context_snapshot_store.js
      - name: Run Python-Node snapshot parity
        run: pytest tests/test_work_context_snapshot_cross_runtime.py -q -rs
      - name: Run full npm package tests
        run: npm --prefix entroly-wasm test
      - name: Verify published tarball contains snapshot runtime and types
        run: |
          npm --prefix entroly-wasm pack --dry-run --json > "$RUNNER_TEMP/entroly-wasm-pack.json"
          python - "$RUNNER_TEMP/entroly-wasm-pack.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          files = {entry["path"] for entry in payload[0]["files"]}
          required = {
              "js/work_context_snapshot_store.js",
              "js/work_context_snapshot_store.d.ts",
              "index.js",
              "index.d.ts",
          }
          missing = sorted(required - files)
          if missing:
              raise SystemExit(f"npm tarball missing snapshot recovery surface: {missing}")
          print("npm snapshot recovery tarball surface: PASS")
          PY

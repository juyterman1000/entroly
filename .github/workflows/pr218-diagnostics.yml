name: PR 218 Python Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr218-python-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-python:
    name: Targeted Python traceback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,proxy]" pytest-timeout

      - name: Capture targeted pytest traceback
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -vv --tb=long --maxfail=20 \
            tests/test_context_pipeline.py \
            tests/test_provenance_exact_spans.py \
            tests/test_mcp_payload_bounds.py \
            2>&1 | tee "$RUNNER_TEMP/pr218-pytest.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload traceback artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr218-pytest-diagnostics
          path: ${{ runner.temp }}/pr218-pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Record diagnostic status
        if: always()
        run: echo "Targeted pytest exit status was ${{ steps.pytest.outputs.status }}"

name: Apply AI Cost Discovery Update

on:
  push:
    branches:
      - docs/ai-cost-model-discovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/ai-cost-model-discovery
          fetch-depth: 0

      - name: Apply model, README, SEO, and AEO changes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')
          TODAY = '2026-07-26'
          MODEL_SOURCE = 'https://platform.claude.com/docs/en/about-claude/models/overview'

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path}: expected block not found')
              write(path, text.replace(old, new, 1))

          # README hero: lead with the user outcome, then state the assurance mechanism.
          old_hero = '''<h1 align="center">Entroly — The Open-Source Context OS for AI Agents</h1>

          <p align="center"><b>Keep your agent. Give it a Context OS.</b><br>
          The observability, governance, and decision layer for AI context.<br>
          Entroly brings together what agents read, remember, trust, recover, spend, and learn—without replacing the model or agent runtime you already use.</p>

          <p align="center">
            <sub>Integrates with Claude Code, Codex, OpenClaw, GitHub Copilot, Cursor, Aider, MCP clients, and custom provider applications. Choose the supported setup path for your client.</sub>
          </p>

          <p align="center">
            <sub>Context selection + recoverable compression · receipts record what was used, omitted, and risky · local-first · Python with optional Rust acceleration · Node/WASM runtime</sub>
          </p>'''
          new_hero = '''<h1 align="center">Entroly — Lower the Operational Cost of AI Agents</h1>

          <p align="center"><b>Reduce token usage. Preserve answer-critical evidence. Prove what your agent saw.</b><br>
          A low-friction, drop-in Context Assurance layer for the models and developer tools you already use.<br>
          Entroly selects context under an explicit budget, keeps omitted evidence recoverable, and emits receipts—without replacing your model, codebase, or agent architecture.</p>

          <p align="center">
            <sub>Works with Claude Fable 5, Claude Opus 5, Claude Sonnet 5, GPT-5.6, Gemini, local models, Claude Code, Codex, OpenClaw, GitHub Copilot, Cursor, Aider, MCP clients, and compatible provider applications through supported proxy, wrapper, MCP, CLI, and SDK paths.</sub>
          </p>

          <p align="center">
            <sub>Budgeted context selection · content-addressed evidence · included/omitted evidence receipts · exact recovery · local-first · optional Rust acceleration</sub>
          </p>'''
          replace_once('README.md', old_hero, new_hero)

          readme = read('README.md')
          cost_section = '''## Lower AI operational cost without blind trimming

          **Direct answer:** Entroly can lower provider-bound AI input costs by selecting answer-relevant evidence under a token budget before a supported request reaches the model. A zero-code proxy route is available for compatible API traffic; wrappers, MCP, CLI, SDK, and native integrations cover developer tools and local models. Savings are workload-specific, so Entroly reports measured reduction and provenance instead of promising one universal percentage.

          | Current model or platform | Supported Entroly path | What Entroly adds |
          |---|---|---|
          | **Claude Fable 5, Claude Opus 5, Claude Sonnet 5** | Anthropic-compatible proxy/API routes | Budgeted input selection, Context Receipts, exact recovery, and provider-observed input-cost accounting where visible |
          | **GPT-5.6 and OpenAI-compatible models** | Responses/chat-compatible proxy and SDK routes | Evidence selection before inference, cache-aware context handling, receipts, and measured provider-bound reduction |
          | **Gemini, Bedrock, Ollama, LM Studio, and local models** | Provider-specific or compatible proxy/SDK routes | Model-neutral context selection and recovery; dollar savings are claimed only where provider delivery and pricing are observable |
          | **Claude Code, Codex, OpenClaw, GitHub Copilot, Cursor, and Aider** | Attach, wrapper, MCP, plugin, or integration path | Low-friction adoption without replacing the agent loop or rewriting the codebase |

          Entroly is not a blind text trimmer. It chooses evidence before compression, records what was included and omitted, keeps exact originals addressable, and can verify generated claims against the supplied evidence.

          [Read the AI cost optimization guide](docs/ai-cost-optimization.html) · [Compare Entroly and Headroom](docs/entroly-vs-headroom.html)

          ---

          '''
          marker = '## See value in your first session\n'
          if cost_section.strip() not in readme:
              if marker not in readme:
                  raise SystemExit('README insertion marker missing')
              readme = readme.replace(marker, cost_section + marker, 1)
              write('README.md', readme)

          # Keep the PyPI landing page aligned, without claiming a universal saving.
          pypi = read('PYPI_README.md')
          pypi = pypi.replace(
              '<h1 align="center">Entroly — Context Assurance That Helps Lower AI Costs</h1>',
              '<h1 align="center">Entroly — Lower the Operational Cost of AI Agents</h1>',
              1,
          )
          pypi = pypi.replace(
              '<p align="center"><b>Use less unnecessary AI context without rebuilding how you work.</b><br>\nEntroly selects useful evidence, removes avoidable repetition, keeps important originals recoverable, and records what your AI received.</p>',
              '<p align="center"><b>Reduce token usage without blindly trimming answer-critical evidence.</b><br>\nEntroly selects useful evidence under a budget, keeps omitted originals recoverable, and records what your AI received.</p>',
              1,
          )
          pypi = pypi.replace(
              'It works through supported proxy, wrapper, plugin, SDK, and MCP paths with Claude Code, Codex, OpenClaw, Hermes Agent, OpenCode, GitHub Copilot, Cursor, Aider, local models, and OpenAI/Anthropic-compatible applications.',
              'It works through supported proxy, wrapper, plugin, SDK, and MCP paths with Claude Fable 5, Claude Opus 5, Claude Sonnet 5, GPT-5.6, Claude Code, Codex, OpenClaw, Hermes Agent, OpenCode, GitHub Copilot, Cursor, Aider, local models, and compatible provider applications.',
              1,
          )
          write('PYPI_README.md', pypi)

          # Explicitly register current Claude models in both Python and Rust snapshots.
          current_models = [
              {
                  'id': 'anthropic/claude-fable-5',
                  'provider': 'anthropic',
                  'aliases': ['anthropic/claude-fable-5', 'claude-fable-5'],
                  'context_window': 1_000_000,
                  'max_output_tokens': 128_000,
                  'supports_tools': True,
                  'supports_vision': True,
                  'supports_reasoning': True,
                  'input_price_per_million': 10.0,
                  'output_price_per_million': 50.0,
                  'trust': 'verified',
                  'source': MODEL_SOURCE,
                  'verified_at': TODAY,
              },
              {
                  'id': 'anthropic/claude-opus-5',
                  'provider': 'anthropic',
                  'aliases': ['anthropic/claude-opus-5', 'claude-opus-5'],
                  'context_window': 1_000_000,
                  'max_output_tokens': 128_000,
                  'supports_tools': True,
                  'supports_vision': True,
                  'supports_reasoning': True,
                  'input_price_per_million': 5.0,
                  'output_price_per_million': 25.0,
                  'trust': 'verified',
                  'source': MODEL_SOURCE,
                  'verified_at': TODAY,
              },
              {
                  'id': 'anthropic/claude-sonnet-5',
                  'provider': 'anthropic',
                  'aliases': ['anthropic/claude-sonnet-5', 'claude-sonnet-5'],
                  'context_window': 1_000_000,
                  'max_output_tokens': 128_000,
                  'supports_tools': True,
                  'supports_vision': True,
                  'supports_reasoning': True,
                  'input_price_per_million': 3.0,
                  'output_price_per_million': 15.0,
                  'trust': 'verified',
                  'source': MODEL_SOURCE,
                  'verified_at': TODAY,
              },
          ]
          registry_path = ROOT / 'entroly/models/registry.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          registry['generated_at'] = TODAY
          replace_ids = {item['id'] for item in current_models}
          models = [m for m in registry['models'] if m.get('id') not in replace_ids]
          insert_at = next(
              (i for i, model in enumerate(models) if model.get('id') == 'anthropic/claude-opus-4.6'),
              len(models),
          )
          models[insert_at:insert_at] = current_models
          registry['models'] = models
          registry_text = json.dumps(registry, indent=2, ensure_ascii=False) + '\n'
          write('entroly/models/registry.json', registry_text)
          write('entroly-core/model_registry.json', registry_text)

          # Model-registry regression proving current aliases, budgets, and prices.
          model_tests = read('tests/test_model_registry.py')
          current_test = '''\n\n@pytest.mark.parametrize(\n    ("alias", "model_id", "input_price", "output_price"),\n    [\n        ("claude-fable-5", "anthropic/claude-fable-5", 10.0, 50.0),\n        ("claude-opus-5", "anthropic/claude-opus-5", 5.0, 25.0),\n        ("claude-sonnet-5", "anthropic/claude-sonnet-5", 3.0, 15.0),\n    ],\n)\ndef test_current_claude_5_models_have_verified_context_and_pricing(\n    alias, model_id, input_price, output_price\n):\n    result = get_model_registry().resolve(alias)\n\n    assert result.capability is not None\n    assert result.capability.id == model_id\n    assert result.trust is RegistryTrust.VERIFIED\n    assert result.context_window == 1_000_000\n    assert result.capability.max_output_tokens == 128_000\n    assert result.capability.input_price_per_million == input_price\n    assert result.capability.output_price_per_million == output_price\n    assert result.capability.supports_reasoning is True\n    assert result.warning is None\n'''
          if 'test_current_claude_5_models_have_verified_context_and_pricing' not in model_tests:
              model_tests = model_tests.replace(
                  '\n\ndef test_unknown_model_fails_visibly_with_conservative_fallback():',
                  current_test + '\n\ndef test_unknown_model_fails_visibly_with_conservative_fallback():',
                  1,
              )
              write('tests/test_model_registry.py', model_tests)

          # Search-facing AI cost page: concise title, visible direct answer, current models, and FAQ parity.
          cost = read('docs/ai-cost-optimization.html')
          replacements = {
              '<title>AI Cost Optimization: Reduce Token Waste with Entroly</title>': '<title>Reduce AI Operational Costs with Entroly Context Assurance</title>',
              'content="Learn how Entroly reduces avoidable AI token usage with budgeted evidence selection, recoverable compression, receipts, and model-neutral Context Assurance."': 'content="Lower provider-bound AI input costs for Claude Opus 5, Fable 5, Sonnet 5, GPT-5.6, coding agents, and local models with evidence selection, receipts, and exact recovery."',
              'content="AI Cost Optimization: Reduce Token Waste with Entroly"': 'content="Reduce AI Operational Costs with Entroly Context Assurance"',
              'content="Reduce unnecessary model input while preserving exact evidence, receipts, and verification."': 'content="Lower avoidable AI input costs while preserving exact evidence, receipts, recovery, and verification."',
              'content="AI Cost Optimization with Entroly"': 'content="Reduce AI Operational Costs with Entroly"',
              'content="Context Assurance for reducing avoidable token usage without replacing your AI model or agent."': 'content="Context Assurance for Claude Opus 5, Fable 5, Sonnet 5, GPT-5.6, coding agents, and local models."',
              '"headline": "AI Cost Optimization: Reduce Token Waste with Entroly"': '"headline": "Reduce AI Operational Costs with Entroly Context Assurance"',
              '"dateModified": "2026-07-25"': f'"dateModified": "{TODAY}"',
              '<p class="eyebrow">AI cost optimization with evidence protection</p>': '<p class="eyebrow">Lower AI operational cost with evidence protection</p>',
              '<h1>Entroly reduces avoidable AI token usage without losing important evidence.</h1>': '<h1>Entroly lowers AI operational costs without blindly trimming context.</h1>',
              '<p class="lead">Entroly is a model-neutral Context Assurance layer. It selects useful information under a budget, removes avoidable repetition, preserves exact originals, and records what the model received.</p>': '<p class="lead">Entroly is a model-neutral Context Assurance layer for Claude Fable 5, Claude Opus 5, Claude Sonnet 5, GPT-5.6, coding agents, and local models. It selects useful evidence under a budget, removes avoidable repetition, preserves exact originals, and records what the model received.</p>',
              '<div class="answer"><strong>Direct answer:</strong> Entroly can help lower LLM API input costs by reducing unnecessary context before a supported provider-bound request. It does not promise a fixed percentage, and it does not blindly shorten prompts.</div>': '<div class="answer"><strong>Direct answer:</strong> Entroly can lower provider-bound AI input costs by selecting answer-relevant evidence before a supported request reaches Claude Opus 5, Fable 5, Sonnet 5, GPT-5.6, or another compatible model. It does not promise a fixed percentage, and it does not blindly shorten prompts.</div>',
          }
          for old, new in replacements.items():
              if old not in cost:
                  raise SystemExit(f'cost page replacement missing: {old[:80]}')
              cost = cost.replace(old, new, 1)

          model_section = '''\n  <h2>Current models and developer tools</h2>\n  <table>\n    <thead><tr><th>Model or platform</th><th>How Entroly fits</th></tr></thead>\n    <tbody>\n      <tr><td>Claude Fable 5, Claude Opus 5, Claude Sonnet 5</td><td>Use a supported Anthropic-compatible proxy or API route. Entroly recognizes the current model IDs and applies the correct 1M-token window and published input/output pricing metadata.</td></tr>\n      <tr><td>GPT-5.6 and OpenAI-compatible models</td><td>Use a supported Responses or chat-compatible path for provider-bound measurement, receipts, evidence selection, and exact recovery.</td></tr>\n      <tr><td>Claude Code, Codex, OpenClaw, GitHub Copilot, Cursor, Aider</td><td>Use the supported attach, wrapper, MCP, plugin, or integration path. A small one-time setup is required; the agent loop and codebase architecture remain yours.</td></tr>\n      <tr><td>Ollama, LM Studio, and other local models</td><td>Use a compatible local route for context selection and receipts. Entroly reports context reduction but does not invent provider-dollar savings where no paid provider request is observed.</td></tr>\n    </tbody>\n  </table>\n  <p>Model names are not merely search keywords: the bundled registry records context windows, output limits, pricing provenance, and verification dates used by Entroly's budget and cost calculations.</p>\n'''
          anchor = '\n  <h2>What is measured—and what is not</h2>'
          if 'Current models and developer tools' not in cost:
              if anchor not in cost:
                  raise SystemExit('cost page model-section anchor missing')
              cost = cost.replace(anchor, model_section + anchor, 1)

          comparison_link = '<p>For a feature-by-feature positioning review, see <a href="entroly-vs-headroom.html">Entroly vs Headroom: Context Assurance or Compression?</a></p>\n'
          if 'entroly-vs-headroom.html' not in cost:
              cost = cost.replace('\n  <h2>Why this is more than prompt compression</h2>', '\n  ' + comparison_link + '\n  <h2>Why this is more than prompt compression</h2>', 1)

          # Add visible FAQs and matching JSON-LD questions.
          visible_faq = '''\n  <h2>Frequently asked questions</h2>\n  <h3>Can Entroly reduce Claude Opus 5 or Fable 5 API costs?</h3>\n  <p>Entroly can reduce provider-bound input tokens before a supported request reaches those models. The actual dollar effect depends on the selected evidence, model pricing, prompt caching, output usage, and workload. Entroly does not claim to lower a fixed Claude subscription price.</p>\n  <h3>Does Entroly require changes to my agent architecture?</h3>\n  <p>No architecture rewrite is required. Compatible API traffic can use the proxy path; developer tools can use attach, wrapper, MCP, plugin, or native integration paths. Each path still requires a small one-time setup.</p>\n  <h3>How is Entroly different from Headroom?</h3>\n  <p>Both projects provide local context optimization and reversible paths. Headroom publicly emphasizes broad content compression, wrappers, and output shaping. Entroly emphasizes Context Assurance: budgeted evidence selection, included/omitted evidence receipts, exact hash recovery, verification, and fail-closed savings accounting.</p>\n'''
          if '<h2>Frequently asked questions</h2>' not in cost:
              cost = cost.replace('\n  <h2>Evidence</h2>', visible_faq + '\n  <h2>Evidence</h2>', 1)

          faq_marker = '''          {\n            "@type": "Question",\n            "name": "Does Entroly blindly trim prompts?",\n            "acceptedAnswer": {"@type": "Answer", "text": "No. Entroly performs budgeted evidence selection, preserves exact originals through content-addressed handles, produces Context Receipts, and can verify whether claims are supported by supplied evidence."}\n          }'''
          faq_replacement = faq_marker + ''',\n          {\n            "@type": "Question",\n            "name": "Can Entroly reduce Claude Opus 5 or Fable 5 API costs?",\n            "acceptedAnswer": {"@type": "Answer", "text": "Entroly can reduce provider-bound input tokens before a supported request reaches Claude Opus 5 or Fable 5. Actual cost impact depends on model pricing, selected evidence, prompt caching, output usage, and workload."}\n          },\n          {\n            "@type": "Question",\n            "name": "How is Entroly different from Headroom?",\n            "acceptedAnswer": {"@type": "Answer", "text": "Both provide local context optimization and reversible paths. Headroom emphasizes broad content compression, wrappers, and output shaping. Entroly emphasizes Context Assurance through budgeted evidence selection, Context Receipts, exact hash recovery, verification, and fail-closed accounting."}\n          }'''
          if 'Can Entroly reduce Claude Opus 5 or Fable 5 API costs?' not in cost.split('</script>', 1)[0]:
              if faq_marker not in cost:
                  raise SystemExit('cost page FAQ JSON-LD marker missing')
              cost = cost.replace(faq_marker, faq_replacement, 1)
          write('docs/ai-cost-optimization.html', cost)

          # Dedicated, factual comparison intent page. This is deliberately balanced.
          comparison = '''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Entroly vs Headroom: Context Assurance or Compression?</title>
            <meta name="description" content="Compare Entroly and Headroom for AI token reduction, context compression, proxy deployment, exact recovery, evidence receipts, verification, and agent integrations.">
            <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1">
            <link rel="canonical" href="https://juyterman1000.github.io/entroly/docs/entroly-vs-headroom.html">
            <meta property="og:site_name" content="Entroly">
            <meta property="og:type" content="article">
            <meta property="og:title" content="Entroly vs Headroom: Context Assurance or Compression?">
            <meta property="og:description" content="A factual comparison of two local AI context optimization projects and the different problems they prioritize.">
            <meta property="og:url" content="https://juyterman1000.github.io/entroly/docs/entroly-vs-headroom.html">
            <meta property="og:image" content="https://raw.githubusercontent.com/juyterman1000/entroly/main/docs/assets/logo.png">
            <meta name="twitter:card" content="summary">
            <meta name="twitter:title" content="Entroly vs Headroom">
            <meta name="twitter:description" content="Context Assurance compared with broad context compression for AI agents.">
            <script type="application/ld+json">
            {
              "@context": "https://schema.org",
              "@graph": [
                {
                  "@type": "SoftwareApplication",
                  "name": "Entroly",
                  "applicationCategory": "DeveloperApplication",
                  "applicationSubCategory": "AI Cost Optimization and Context Assurance",
                  "operatingSystem": "Windows, macOS, Linux",
                  "url": "https://juyterman1000.github.io/entroly/docs/entroly-vs-headroom.html",
                  "codeRepository": "https://github.com/juyterman1000/entroly",
                  "downloadUrl": "https://pypi.org/project/entroly/",
                  "license": "https://opensource.org/licenses/Apache-2.0",
                  "description": "A local-first Context Assurance layer with budgeted evidence selection, Context Receipts, exact recovery, verification, and evidence-classified cost accounting.",
                  "offers": {"@type": "Offer", "price": "0.00", "priceCurrency": "USD"}
                },
                {
                  "@type": "TechArticle",
                  "headline": "Entroly vs Headroom: Context Assurance or Compression?",
                  "description": "A dated, source-linked comparison of local AI context optimization approaches.",
                  "url": "https://juyterman1000.github.io/entroly/docs/entroly-vs-headroom.html",
                  "dateModified": "2026-07-26",
                  "author": {"@type": "Organization", "name": "Entroly", "url": "https://github.com/juyterman1000/entroly"}
                },
                {
                  "@type": "BreadcrumbList",
                  "itemListElement": [
                    {"@type": "ListItem", "position": 1, "name": "Entroly", "item": "https://juyterman1000.github.io/entroly/docs/index.html"},
                    {"@type": "ListItem", "position": 2, "name": "Entroly vs Headroom", "item": "https://juyterman1000.github.io/entroly/docs/entroly-vs-headroom.html"}

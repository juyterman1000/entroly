              :root{color-scheme:dark;--bg:#07070b;--panel:#111119;--text:#f8fafc;--muted:#a1a1aa;--accent:#8b5cf6;--line:#27272a;--green:#4ade80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:980px;margin:auto;padding:56px 24px 90px}nav{margin-bottom:52px;color:var(--muted);font-size:15px}nav a,a{color:#c4b5fd}h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.05;letter-spacing:-.04em;margin:.2em 0}h2{margin-top:2.2em;font-size:1.8rem}.eyebrow{color:#c4b5fd;text-transform:uppercase;letter-spacing:.12em;font-weight:800;font-size:13px}.lead{color:#d4d4d8;font-size:1.2rem;max-width:830px}.answer{background:linear-gradient(145deg,rgba(139,92,246,.16),rgba(74,222,128,.06));border:1px solid rgba(139,92,246,.4);border-radius:18px;padding:24px 28px;margin:34px 0}table{width:100%;border-collapse:collapse;background:var(--panel)}th,td{border:1px solid var(--line);padding:14px;vertical-align:top;text-align:left}.note{border-left:4px solid var(--green);padding:10px 18px;background:rgba(74,222,128,.06)}footer{margin-top:70px;padding-top:28px;border-top:1px solid var(--line);color:var(--muted)}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

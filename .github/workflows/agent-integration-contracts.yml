name: Agent Integration Contracts

on:
  pull_request:
    paths:
      - "README.md"
      - "PYPI_README.md"
      - "pyproject.toml"
      - "entroly/pyproject.toml"
      - "entroly/npm/package.json"
      - "entroly/npm-alias/package.json"
      - "entroly-wasm/package.json"
      - "entroly/integrations/**"
      - "integrations/hermes/**"
      - "integrations/openclaw/**"
      - "integrations/opencode/**"
      - "docs/ai-cost-optimization.html"
      - "docs/agent-integrations.html"
      - "docs/openclaw-context-engine.html"
      - "docs/hermes-context-engine.html"
      - "docs/opencode-context-assurance.html"
      - "docs/product/entroly-simple-mode.md"
      - "docs/robots.txt"
      - "docs/sitemap.xml"
      - "docs/llms.txt"
      - "docs/llms-full.txt"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "tests/test_agent_exact_recovery_integrations.py"
      - "tests/test_agent_integration_packages.py"
      - "tests/test_discovery_metadata.py"
      - "tests/test_search_discovery.py"
      - ".github/workflows/agent-integration-contracts.yml"

permissions:
  contents: read

# Superseded runs cancel themselves.
#
# Four pushes to one draft branch inside three minutes queued 26 duplicate runs
# and starved every other pull request of ubuntu runners for over an hour, while
# macOS and Windows -- separate runner pools -- finished in a minute. The older
# runs were validating commits that had already been replaced, so the queue was
# spent on answers nobody could use.
#
# Keyed on the pull request number so concurrent pull requests never cancel each
# other; `github.ref` is the fallback for push and dispatch events.
concurrency:
  group: agent-integration-contracts-${{ github.event.pull_request.number || github.ref }}
  # Only pull-request runs cancel. A push to main can be the run that publishes,
  # tags, or syncs a release surface, and cancelling one of those mid-flight
  # leaves partial state behind -- exactly the "release automation stays boring"
  # rule in CLAUDE.md.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact-head package and test dependencies
        run: python scripts/ci_install_exact_head.py --extras test
      - name: Run focused integration and discovery contracts
        run: >-
          python -m pytest -q
          tests/test_agent_exact_recovery_integrations.py
          tests/test_agent_integration_packages.py
          tests/test_hermes_context_engine.py
          tests/test_discovery_metadata.py
          tests/test_search_discovery.py
          --junitxml=agent-integration-${{ matrix.python-version }}.xml
      - name: Upload machine-readable result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-integration-${{ matrix.python-version }}
          path: agent-integration-${{ matrix.python-version }}.xml
          if-no-files-found: error

name: Code Intelligence Optional Extra

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Superseded runs cancel themselves.
#
# Four pushes to one draft branch inside three minutes queued 26 duplicate runs
# and starved every other pull request of ubuntu runners for over an hour, while
# macOS and Windows -- separate runner pools -- finished in a minute. The older
# runs were validating commits that had already been replaced, so the queue was
# spent on answers nobody could use.
#
# Keyed on the pull request number so concurrent pull requests never cancel each
# other; `github.ref` is the fallback for push and dispatch events.
concurrency:
  group: code-intelligence-${{ github.event.pull_request.number || github.ref }}
  # Only pull-request runs cancel. A push to main can be the run that publishes,
  # tags, or syncs a release surface, and cancelling one of those mid-flight
  # leaves partial state behind -- exactly the "release automation stays boring"
  # rule in CLAUDE.md.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parser-extra:
    name: Parser Extra (explicit acquisition + offline reuse)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install optional parser surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[code-intelligence,test]"
          # `benchmarks/results/language_symbol_coverage.json` is a byte-exact
          # record of ONE grammar pack: it embeds
          # `environment.tree_sitter_language_pack`, and the verify step below
          # regenerates the whole payload and compares it byte for byte. The
          # extra deliberately floats (`>=1.14.3,<2`) so users pick up grammar
          # fixes, which means every upstream release silently invalidates the
          # published artifact. 1.15.8 shipped on 2026-08-23 and turned main red
          # on the very next push — a dependency bump that had nothing to do
          # with parsing — because the gate resolved 1.15.8 against an artifact
          # recorded under 1.14.3.
          #
          # So pin the *verification* environment, not the user-facing range.
          # The artifact says results "must be regenerated and reviewed for a
          # different grammar pack": moving it changes published coverage
          # claims (C3, F#, Groovy, Nim and OCaml are recorded gaps), so that is
          # a reviewed decision, not something CI absorbs on upstream's
          # schedule. Bump this pin in the same commit that regenerates the
          # artifact.
          python -m pip install "tree-sitter-language-pack==1.14.3"

      - name: Warm required grammars with explicit acquisition
        env:
          ENTROLY_TREE_SITTER_ALLOW_DOWNLOAD: "1"
          ENTROLY_AIR_GAP: "0"
        run: |
          python -m pytest -q \
            tests/test_tree_sitter_support.py \
            tests/test_parser_compatibility.py \
            tests/test_language_open_registry_contract.py \
            tests/test_code_intelligence_conformance.py \
            tests/test_universal_code_intelligence.py

      - name: Verify published language-symbol coverage
        env:
          ENTROLY_TREE_SITTER_ALLOW_DOWNLOAD: "1"
          ENTROLY_AIR_GAP: "0"
        run: |
          python benchmarks/language_symbol_coverage.py \
            --baseline-ref 2eeecb8733103fe7234133f48b105f271662b219 \
            --check

      - name: Re-run parser regressions with acquisition disabled
        env:
          ENTROLY_TREE_SITTER_ALLOW_DOWNLOAD: "0"
          ENTROLY_AIR_GAP: "1"
        run: |
          python - <<'PY'
          import tree_sitter_language_pack as pack

          cached = set(pack.downloaded_languages())
          print("downloaded grammar cache entries:", ", ".join(sorted(cached)) or "<none>")
          PY
          python -m pytest -q \
            tests/test_tree_sitter_support.py \
            tests/test_parser_compatibility.py \
            tests/test_language_open_registry_contract.py \
            tests/test_code_intelligence_conformance.py \
            tests/test_universal_code_intelligence.py
          python benchmarks/language_symbol_coverage.py \
            --baseline-ref 2eeecb8733103fe7234133f48b105f271662b219 \
            --check

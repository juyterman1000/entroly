name: PR278 pytest diagnostic

on:
  push:
    branches:
      - feat/distribution-control-plane
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr278-pytest-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure-python-first-failure:
    name: Capture first pure-Python failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pure-Python test surface
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps --timeout 120 --retries 5 -e .
          pip install --timeout 120 --retries 5 \
            "mcp>=1.28.1,<2" "httpx>=0.27" "starlette>=0.37" "uvicorn>=0.30" psutil \
            pytest pytest-timeout

      - name: Confirm native engine is absent
        run: |
          python - <<'PY'
          import importlib.util
          if importlib.util.find_spec("entroly_core") is not None:
              raise SystemExit("entroly_core unexpectedly importable")
          PY

      - name: Capture first failing traceback
        id: pytest
        shell: bash
        run: |
          set +e
          pytest tests/ -vv --tb=long -x --maxfail=1 --timeout=60 -p no:cacheprovider \
            --ignore=tests/functional_test.py \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_ios.py \
            --ignore=tests/test_rust_cogops.py \
            --ignore=tests/test_deep_functional.py \
            --ignore=tests/test_engine_isolation.py \
            --ignore=tests/test_localization.py \
            --ignore=tests/test_benchmark_harness.py 2>&1 | tee pytest-first-failure.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr278-pytest-first-failure
          path: pytest-first-failure.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve failing status
        if: steps.pytest.outputs.status != '0'
        run: exit 1

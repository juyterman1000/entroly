name: PR278 verified root repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr278-verified-root-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feat/distribution-control-plane'
    name: Align distribution and honesty contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/distribution-control-plane
          fetch-depth: 0

      - name: Apply minimal root-cause repair
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("docs/distribution/submission-kit.md"): (
                  '- "zero quality loss";',
                  '- "any unconditional statement that compression cannot reduce answer quality";',
              ),
              Path("scripts/check_distribution_surface.py"): (
                  '        "zero quality loss",',
                  '        "any unconditional statement that compression cannot reduce answer quality",',
              ),
          }

          for path, (old, new) in replacements.items():
              content = path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one root-cause marker, found {count}"
                  )
              path.write_text(content.replace(old, new), encoding="utf-8")
          PY

      - name: Run focused trust and distribution gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python scripts/check_distribution_surface.py
          python -m pytest \
            tests/test_no_unsupported_theory_claims.py \
            tests/test_distribution_surface.py \
            -q

      - name: Commit only the verified source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/distribution/submission-kit.md scripts/check_distribution_surface.py
          git diff --cached --check
          git diff --cached --name-only | grep -qx 'docs/distribution/submission-kit.md'
          git diff --cached --name-only | grep -qx 'scripts/check_distribution_surface.py'
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "fix(distribution): align claim policy with honesty guard"
          git push origin HEAD:feat/distribution-control-plane

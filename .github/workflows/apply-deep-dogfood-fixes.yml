name: Apply Deep Dogfood Fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'dogfood/deep-runtime-20260727' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dogfood/deep-runtime-20260727
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply exact-count replacements
        run: python scripts/apply_deep_dogfood_fixes.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,proxy]' pytest-timeout psutil ruff

      - name: Prove the repaired trust boundaries
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: '1'
          PYTHONUTF8: '1'
        run: |
          python -m compileall -q entroly tests
          ruff check \
            entroly/multimodal.py \
            entroly/image_optimizer.py \
            entroly/value_tracker.py \
            tests/test_multimodal_dogfood.py \
            tests/test_value_tracker_dogfood.py \
            tests/test_mcp_entrypoint_dogfood.py
          python -m pytest -q --tb=short --timeout=150 \
            tests/test_multimodal_dogfood.py \
            tests/test_value_tracker_dogfood.py \
            tests/test_docker_launcher_trust.py

      - name: Verify scope and commit product repairs
        run: |
          set -euo pipefail
          test ! -e scripts/apply_deep_dogfood_fixes.py
          test ! -e .github/workflows/apply-deep-dogfood-fixes.yml
          git diff --check
          git status --short
          git config user.name juyterman1000
          git config user.email 208309368+juyterman1000@users.noreply.github.com
          git add -A
          git commit -m 'fix(dogfood): repair multimodal and value trust boundaries'
          git push origin HEAD:dogfood/deep-runtime-20260727

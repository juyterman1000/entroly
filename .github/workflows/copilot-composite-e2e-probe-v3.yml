name: Copilot Composite E2E Probe v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  copilot-real-client:
    if: github.head_ref == 'feat/agent-compatibility-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Entroly and pinned Copilot CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm install --global '@github/copilot@1.0.74'
      - name: Canonicalize Copilot argument ordering for probe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/copilot_composite_e2e_probe.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(
              index
              for index in range(len(lines) - 1)
              if lines[index].strip() == '"-s",' and lines[index + 1].strip() == '"-p",'
          )
          end = next(
              index
              for index in range(start, len(lines))
              if lines[index].strip() == '"--no-remote-export",'
          )
          indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
          replacement = [
              f'{indent}"-s",',
              f'{indent}f"--allow-tool={{server_name}}",',
              f'{indent}"--no-color",',
              f'{indent}"--no-ask-user",',
              f'{indent}"--no-auto-update",',
              f'{indent}"--no-custom-instructions",',
              f'{indent}"--disable-builtin-mcps",',
              f'{indent}"--no-remote",',
              f'{indent}"--no-remote-export",',
              f'{indent}f"--prompt=Use the get_stats tool from MCP server {{server_name}} exactly once. After the tool succeeds, return exactly E2E_OK.",',
          ]
          lines[start : end + 1] = replacement
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Run real Copilot proxy and MCP composite probe
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: '1'
        run: python .github/copilot_composite_e2e_probe.py
      - name: Upload composite E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: copilot-composite-e2e-probe-v3
          path: |
            copilot-composite-e2e.json
            copilot-composite-e2e.log
          if-no-files-found: error
          retention-days: 14

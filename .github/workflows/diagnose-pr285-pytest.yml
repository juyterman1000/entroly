name: Diagnose PR285 first pytest failure

on:
  push:
    branches:
      - feat/gateway-same-provider-execution
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing-surface-first-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pure-Python CI surface
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps --timeout 120 --retries 5 -e .
          pip install --timeout 120 --retries 5 \
            "mcp>=1.28.1,<2" "httpx>=0.27" "starlette>=0.37" "uvicorn>=0.30" psutil \
            pytest pytest-timeout

      - name: Capture routing-surface first failure
        shell: bash
        run: |
          set +e
          pytest -vv --tb=short -x --timeout=60 -p no:cacheprovider \
            tests/test_docs_code_sync.py \
            tests/test_container_user_journeys.py \
            tests/test_proxy_routing_authority.py \
            tests/test_proxy_routing_official_guard.py \
            tests/test_proxy_routing_safety.py \
            > routing-first-failure.txt 2>&1
          code=$?
          cat routing-first-failure.txt
          printf '%s\n' "$code" > routing-exit-code.txt
          exit "$code"

      - name: Upload routing-surface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr285-routing-first-failure
          path: |
            routing-first-failure.txt
            routing-exit-code.txt
          if-no-files-found: error
          retention-days: 1

  full-first-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pure-Python CI surface
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps --timeout 120 --retries 5 -e .
          pip install --timeout 120 --retries 5 \
            "mcp>=1.28.1,<2" "httpx>=0.27" "starlette>=0.37" "uvicorn>=0.30" psutil \
            pytest pytest-timeout

      - name: Capture first pytest failure
        shell: bash
        run: |
          set +e
          pytest tests/ -vv --tb=short -x --timeout=60 -p no:cacheprovider \
            --ignore=tests/functional_test.py \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_ios.py \
            --ignore=tests/test_rust_cogops.py \
            --ignore=tests/test_deep_functional.py \
            --ignore=tests/test_engine_isolation.py \
            --ignore=tests/test_localization.py \
            --ignore=tests/test_benchmark_harness.py \
            > pytest-first-failure.txt 2>&1
          code=$?
          cat pytest-first-failure.txt
          printf '%s\n' "$code" > pytest-exit-code.txt
          exit "$code"

      - name: Upload first-failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr285-pytest-first-failure
          path: |
            pytest-first-failure.txt
            pytest-exit-code.txt
          if-no-files-found: error
          retention-days: 1

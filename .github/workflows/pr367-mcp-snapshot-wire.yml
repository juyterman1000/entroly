name: PR367 MCP Snapshot Wire

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr367-mcp-snapshot-wire.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/codebase-intelligence-integrity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/codebase-intelligence-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact guarded MCP snapshot wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('entroly/work_graph_mcp.py')
          s = p.read_text(encoding='utf-8')
          def rep(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {n}')
              s = s.replace(old, new, 1)

          rep('import base64\nimport binascii\n', '', 'codec imports')
          rep(
              'from .hardening import sanitize_injected_context\n',
              'from .hardening import sanitize_injected_context\n'
              'from .work_context_snapshot_store import (\n'
              '    CONTEXT_SNAPSHOT_TOKEN_PREFIX,\n'
              '    WorkContextSnapshotStore,\n'
              ')\n',
              'snapshot import',
          )
          rep(
              '_CONTEXT_TOKEN_PREFIX = "vctx1."\n'
              '_MAX_CONTEXT_TOKEN_BYTES = ((_MAX_CONTRACT_BYTES + 2) // 3) * 4 + len(\n'
              '    _CONTEXT_TOKEN_PREFIX\n'
              ')\n',
              '_CONTEXT_TOKEN_PREFIX = CONTEXT_SNAPSHOT_TOKEN_PREFIX\n',
              'token constants',
          )

          a = s.index('def _encode_context_token(context: dict[str, Any]) -> str:\n')
          b = s.index('def _ttl_ms(ttl_seconds: float) -> int:\n', a)
          helpers = '''def _snapshot_store(repository_id: object) -> WorkContextSnapshotStore:\n    repo_id = _bounded_id(repository_id, "repository_id")\n    return WorkContextSnapshotStore(WorkGraphStore(repo_id))\n\n\ndef _snapshot_token_from_receipt_id(receipt_id: object) -> str:\n    value = str(receipt_id or "")\n    prefix = "vctx_"\n    if not value.startswith(prefix):\n        raise ValueError("recovery handle receipt_id is not a verified context id")\n    return WorkContextSnapshotStore.token_for_commitment(value[len(prefix):])\n\n\ndef _encode_context_token(context: dict[str, Any], repository_id: object) -> str:\n    """Persist exact committed context and return a short content-addressed token."""\n    return _snapshot_store(repository_id).put_json(context)\n\n\ndef _decode_context_token(token: str, repository_id: object | None = None) -> dict[str, Any]:\n    """Resolve a repository-scoped snapshot and re-verify its inner commitment."""\n    if repository_id is None:\n        repository_id = _store_for_path(_project_path()).repo_id\n    return _snapshot_store(repository_id).get_json(token)\n\n\n'''
          s = s[:a] + helpers + s[b:]

          rep(
              '    canonical_receipt: dict[str, Any],\n',
              '    context_token: str,\n    canonical_receipt: dict[str, Any],\n',
              'renderer token arg',
          )
          rep(
              '        "context_token": _encode_context_token(context),\n',
              '        "context_token": context_token,\n',
              'renderer token use',
          )

          rep(
              '        recorded_graph, event_id = store.record_context_receipt(\n'
              '            canonical,\n'
              '            agent_id=str(agent_id),\n'
              '            session_id=str(session_id),\n'
              '        )\n'
              '        return _render_context_result(\n'
              '            "work_compile_context",\n'
              '            context=context,\n'
              '            canonical_receipt=canonical,\n',
              '        source_commitment = str(context["receipt"]["context_sha256"])\n'
              '        if canonical.get("source_commitment") != source_commitment:\n'
              '            raise WorkGraphStateError("canonical receipt lost source commitment")\n'
              '        context_token = _encode_context_token(context, scope["repo_id"])\n'
              '        recorded_graph, event_id = store.record_context_receipt(\n'
              '            canonical,\n'
              '            agent_id=str(agent_id),\n'
              '            session_id=str(session_id),\n'
              '        )\n'
              '        return _render_context_result(\n'
              '            "work_compile_context",\n'
              '            context=context,\n'
              '            context_token=context_token,\n'
              '            canonical_receipt=canonical,\n',
              'compile persist-before-publish',
          )

          old = '''    try:\n        if isinstance(context, str):\n            bounded_context = _decode_context_token(context)\n        else:\n            bounded_context = _bounded_contract(context, "context")\n            if not isinstance(bounded_context, dict):\n                raise ValueError("context must be a JSON object or context token")\n        bounded_handle = _bounded_contract(recovery_handle, "recovery_handle")\n        if not isinstance(bounded_handle, dict):\n            raise ValueError("recovery_handle must be a JSON object")\n        selected_ref = _bounded_ref(context_ref, "context_ref")\n'''
          new = '''    try:\n        bounded_handle = _bounded_contract(recovery_handle, "recovery_handle")\n        if not isinstance(bounded_handle, dict):\n            raise ValueError("recovery_handle must be a JSON object")\n        handle = verify_recovery_handle(bounded_handle)\n        path = _project_path(project)\n        store = _store_for_path(path)\n        if handle.get("repository_id") != store.repo_id:\n            raise ValueError("recovery handle belongs to another repository")\n        if isinstance(context, str):\n            expected_token = _snapshot_token_from_receipt_id(handle.get("receipt_id"))\n            if context != expected_token:\n                raise ValueError("context token does not match recovery handle parent")\n            bounded_context = _decode_context_token(context, store.repo_id)\n        else:\n            bounded_context = _bounded_contract(context, "context")\n            if not isinstance(bounded_context, dict):\n                raise ValueError("context must be a JSON object or context token")\n        selected_ref = _bounded_ref(context_ref, "context_ref")\n'''
          rep(old, new, 'fault verify-before-read')
          rep('        handle = verify_recovery_handle(bounded_handle)\n', '', 'duplicate handle verify')
          rep(
              '        path = _project_path(project)\n        service = RepositoryIntelligenceService(path)\n',
              '        service = RepositoryIntelligenceService(path)\n',
              'duplicate project path',
          )
          rep(
              '        store = _store_for_path(path)\n        graph = store.submit_repository_observation(\n',
              '        graph = store.submit_repository_observation(\n',
              'duplicate graph store',
          )
          rep(
              '        recorded_graph, event_id = store.record_context_receipt(\n'
              '            canonical,\n'
              '            agent_id=str(agent_id),\n'
              '            session_id=str(session_id),\n'
              '        )\n'
              '        return _render_context_result(\n'
              '            "work_context_fault",\n'
              '            context=recovered,\n'
              '            canonical_receipt=canonical,\n',
              '        context_token = _encode_context_token(recovered, scope["repo_id"])\n'
              '        recorded_graph, event_id = store.record_context_receipt(\n'
              '            canonical,\n'
              '            agent_id=str(agent_id),\n'
              '            session_id=str(session_id),\n'
              '        )\n'
              '        return _render_context_result(\n'
              '            "work_context_fault",\n'
              '            context=recovered,\n'
              '            context_token=context_token,\n'
              '            canonical_receipt=canonical,\n',
              'fault persist-before-publish',
          )
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile entroly/work_graph_mcp.py
          git diff --check
          git diff --stat
          grep -n 'CONTEXT_SNAPSHOT_TOKEN_PREFIX\|context_token = _encode_context_token' entroly/work_graph_mcp.py
      - name: Commit verified target diff and remove one-shot workflow
        run: |
          rm -f .github/workflows/pr367-mcp-snapshot-wire.yml
          git config user.name 'entroly-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'no target diff' >&2; exit 1; }
          git commit -m 'fix(context): use repository-scoped snapshot tokens'
          git push origin HEAD:fix/codebase-intelligence-integrity

name: PR367 Snapshot Canonical Placement Hardening

on:
  push:
    branches: [pr367-context-snapshot-parity]
    paths:
      - '.github/workflows/pr367-rust-snapshot-wiring.yml'

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pr367-context-snapshot-parity
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Enforce Python-canonical commitment field placement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('entroly-engine/src/verified_context_snapshot.rs')
          text = path.read_text(encoding='utf-8')
          old = (
              '    let mut remove_start = field_positions[0];\n'
              '    let mut remove_end = remove_start + field.len();\n'
              "    if bytes.get(remove_end) == Some(&b',') {\n"
          )
          new = (
              '    let mut remove_start = field_positions[0];\n'
              '    let mut remove_end = remove_start + field.len();\n'
              '\n'
              '    // `context_sha256` is excluded from its own hash, so moving only this\n'
              "    // field could otherwise preserve the preimage. Python's producer writes\n"
              '    // sorted object keys; enforce the exact lexicographic successor (or final\n'
              '    // object position) so Node cannot accept a byte layout Python rejects.\n'
              '    let successor = receipt\n'
              '        .keys()\n'
              '        .filter(|key| key.as_str() > "context_sha256")\n'
              '        .min();\n'
              '    match successor {\n'
              '        Some(key) => {\n'
              "            if !key.is_ascii() || key.contains('\"') || key.contains('\\\\') {\n"
              '                return Err(VerifiedContextSnapshotError::NonCanonicalCommitmentField);\n'
              '            }\n'
              '            let expected_suffix = format!(",\\\"{key}\\\":");\n'
              '            if !bytes[remove_end..].starts_with(expected_suffix.as_bytes()) {\n'
              '                return Err(VerifiedContextSnapshotError::NonCanonicalCommitmentField);\n'
              '            }\n'
              '        }\n'
              '        None => {\n'
              "            if bytes.get(remove_end) != Some(&b'}') {\n"
              '                return Err(VerifiedContextSnapshotError::NonCanonicalCommitmentField);\n'
              '            }\n'
              '        }\n'
              '    }\n'
              '\n'
              "    if bytes.get(remove_end) == Some(&b',') {\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one commitment-removal anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)

          test_anchor = (
              '    #[test]\n'
              '    fn fails_closed_on_tamper_or_wrong_external_commitment() {\n'
          )
          test_block = (
              '    #[test]\n'
              '    fn rejects_reordered_context_hash_field_even_when_preimage_is_unchanged() {\n'
              '        let (digest, bytes) = fixture();\n'
              '        let text = String::from_utf8(bytes).unwrap();\n'
              '        let canonical = format!(\n'
              '            "\\\"commitment_scope\\\":\\\"{}\\\",\\\"context_sha256\\\":\\\"{}\\\"",\n'
              '            VERIFIED_CONTEXT_COMMITMENT_SCOPE, digest,\n'
              '        );\n'
              '        let reordered = format!(\n'
              '            "\\\"context_sha256\\\":\\\"{}\\\",\\\"commitment_scope\\\":\\\"{}\\\"",\n'
              '            digest, VERIFIED_CONTEXT_COMMITMENT_SCOPE,\n'
              '        );\n'
              '        let mutated = text.replace(&canonical, &reordered);\n'
              '        assert_ne!(mutated, text);\n'
              '        assert_eq!(\n'
              '            verify_verified_context_snapshot_bytes(mutated.as_bytes(), &digest),\n'
              '            Err(VerifiedContextSnapshotError::NonCanonicalCommitmentField)\n'
              '        );\n'
              '    }\n'
              '\n'
          )
          if text.count(test_anchor) != 1:
              raise SystemExit(f'expected one test anchor, found {text.count(test_anchor)}')
          text = text.replace(test_anchor, test_block + test_anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and test shared verifier
        run: |
          cargo fmt --manifest-path entroly-engine/Cargo.toml --all
          cargo test --manifest-path entroly-engine/Cargo.toml verified_context_snapshot --lib
          cargo clippy --manifest-path entroly-engine/Cargo.toml --all-targets -- -D warnings
      - name: Commit verified hardening
        run: |
          git config user.name 'Jupyterman'
          git config user.email 'fastrunner10090@gmail.com'
          git add entroly-engine/src/verified_context_snapshot.rs
          git commit -m 'fix(engine): enforce canonical snapshot hash placement'
          git fetch origin pr367-context-snapshot-parity
          git rebase origin/pr367-context-snapshot-parity
          git push origin HEAD:pr367-context-snapshot-parity

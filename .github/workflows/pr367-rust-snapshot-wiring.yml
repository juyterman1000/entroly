name: PR367 NPM Snapshot Verifier Wiring

on:
  push:
    branches: [pr367-context-snapshot-parity]
    paths:
      - '.github/workflows/pr367-rust-snapshot-wiring.yml'

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pr367-context-snapshot-parity
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Require snapshot verifier in stale-WASM guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('entroly-wasm/index.js')
          text = path.read_text(encoding='utf-8')
          old = (
              '    !wasmExports.contextReceiptBuildJSON ||\n'
              '    !wasmExports.recoveryHandleBuildJSON ||'
          )
          new = (
              '    !wasmExports.contextReceiptBuildJSON ||\n'
              '    !wasmExports.verifiedContextSnapshotVerifyBytes ||\n'
              '    !wasmExports.recoveryHandleBuildJSON ||'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale-WASM anchor, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build current WASM and verify npm root
        run: |
          cargo install wasm-pack --locked
          npm --prefix entroly-wasm run build
          node entroly-wasm/test_work_graph_root_exports.js
      - name: Commit verified npm guard
        run: |
          git config user.name 'Jupyterman'
          git config user.email 'fastrunner10090@gmail.com'
          git add entroly-wasm/index.js
          git commit -m 'fix(npm): rebuild when snapshot verifier binding is stale'
          git fetch origin pr367-context-snapshot-parity
          git rebase origin/pr367-context-snapshot-parity
          git push origin HEAD:pr367-context-snapshot-parity

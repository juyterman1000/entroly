name: Validate Runtime Capabilities Delivery

on:
  pull_request:
    branches:
      - feat/production-grade-defaults
    paths:
      - server.json
      - .github/patches/runtime-capabilities.patch.gz
      - .github/workflows/runtime-capabilities-delivery.yml

permissions:
  contents: read

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'ops/production-grade-runtime-capabilities'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify ancestry and exact patch
        shell: bash
        run: |
          set -euo pipefail
          expected_base='2bc8281e8e1132d92b92795eac3d8caf8c0c5289'
          git merge-base --is-ancestor "$expected_base" HEAD
          test -f tests/test_wrap_lifecycle.py
          gzip --test .github/patches/runtime-capabilities.patch.gz
          gzip --decompress --stdout .github/patches/runtime-capabilities.patch.gz > /tmp/runtime-capabilities.patch
          echo '75dc30234bb078c8bcb1c982cd521c17b49c675cc682f071580f7a8dcba81836  /tmp/runtime-capabilities.patch' | sha256sum --check --strict
          git apply --check /tmp/runtime-capabilities.patch
          git apply /tmp/runtime-capabilities.patch
          git diff --check

      - name: Install patched package
        run: python -m pip install -e '.[test]'

      - name: Validate offline runtime capability surface
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q entroly/runtime_capabilities.py entroly/cli.py tests/test_runtime_capabilities.py
          python -m pytest -q \
            tests/test_runtime_capabilities.py \
            tests/test_cli_audit.py \
            tests/test_public_surface_dogfood.py \
            tests/test_release_surface.py \
            tests/test_memory_package_metadata.py
          python -m entroly.cli capabilities --json > /tmp/entroly-capabilities.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/entroly-capabilities.json').read_text())
          assert report['schema_version'] == 'entroly.runtime-capabilities.v1'
          assert report['claims']['provider_connectivity_verified'] is False
          assert report['claims']['benchmark_leadership_implied'] is False
          assert report['claims']['production_readiness_implied'] is False
          assert 'path' not in report['engine']['native']
          assert 'error' not in report['engine']['native']
          PY

      - name: Replay validated product commit onto latest feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add README.md entroly/cli.py entroly/runtime_capabilities.py tests/test_runtime_capabilities.py
          git commit -m 'feat(cli): report installed runtime capabilities safely'
          validated_commit="$(git rev-parse HEAD)"
          git format-patch -1 --stdout "$validated_commit" > /tmp/validated-runtime-capabilities.patch
          git fetch origin feat/production-grade-defaults
          git switch --force-create validated-delivery origin/feat/production-grade-defaults
          git am /tmp/validated-runtime-capabilities.patch
          git push origin HEAD:feat/production-grade-defaults

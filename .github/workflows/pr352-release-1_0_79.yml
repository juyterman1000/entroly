name: PR352 Guarded Release 1.0.79

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr352-release-1-0-79-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'integration/workgraph-production-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/workgraph-production-20260817
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify exact branch head has not raced
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/integration/workgraph-production-20260817)"

      - name: Synchronize approved release surfaces
        run: python scripts/sync_release_version.py 1.0.79

      - name: Verify release metadata and dependency minimums
        shell: bash
        run: |
          python -m pip install pytest hatchling --timeout 120 --retries 5
          PYTHONPATH=. pytest tests/test_release_surface.py -q
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('pyproject.toml').read_text(encoding='utf-8')
          assert 'version = "1.0.79"' in root
          minimums = re.findall(r'entroly-core>=(\d+\.\d+\.\d+)', root)
          assert minimums and set(minimums) == {'1.0.79'}, minimums

          native = Path('entroly/native_status.py').read_text(encoding='utf-8')
          assert 'MIN_ENTROLY_CORE_VERSION = "1.0.79"' in native
          print('release candidate and native minimum converge at 1.0.79')
          PY
          git diff --check

      - name: Commit synchronized release candidate
        shell: bash
        run: |
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Release surfaces already synchronized; nothing to commit.'
            exit 0
          fi
          git commit -m 'release: prepare Entroly 1.0.79 Work Graph candidate'
          git push origin HEAD:integration/workgraph-production-20260817

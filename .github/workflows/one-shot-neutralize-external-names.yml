name: One-shot neutral external naming migration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: neutral-external-naming-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'feat/distribution-control-plane'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: feat/distribution-control-plane
          fetch-depth: 0

      - name: Neutralize current-tree references and add generic adapter contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.')
          skip_parts = {'.git', '.venv', 'node_modules', 'target', '__pycache__'}
          temporary = {
              Path('.github/workflows/competitor-name-audit.yml'),
              Path('.github/workflows/one-shot-neutralize-external-names.yml'),
          }

          # Apply longest/specific forms first. The temporary workflow is removed
          # before the permanent guard runs, so the final tree contains none of
          # these source terms.
          replacements = (
              ('headroomlabs-ai/headroom', 'operator/external-adapter'),
              ('docs.headroomlabs.ai', 'github.com/juyterman1000/entroly/blob/main/docs/BENCHMARKS.md'),
              ('headroom-docs.vercel.app', 'github.com/juyterman1000/entroly/blob/main/docs/BENCHMARKS.md'),
              ('headroom-ai', 'external-adapter'),
              ('HEADROOM', 'EXTERNAL'),
              ('Headroom', 'External Baseline'),
              ('headroom', 'external'),
              ('LEAN-CTX', 'EXTERNAL-CONTEXT-TOOL'),
              ('LEAN_CTX', 'EXTERNAL_CONTEXT_TOOL'),
              ('LEANCTX', 'EXTERNAL_CONTEXT_TOOL'),
              ('Lean-CTX', 'External Context Tool'),
              ('Lean_CTX', 'External Context Tool'),
              ('LeanCTX', 'External Context Tool'),
              ('lean-ctx', 'external-context-tool'),
              ('lean_ctx', 'external_context_tool'),
              ('leanctx', 'external_context_tool'),
          )

          changed: list[str] = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              relative = path.relative_to(root)
              if relative in temporary or any(part in skip_parts for part in relative.parts):
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)

              # URLs copied from external product documentation are not retained
              # under anonymized or broken hostnames. Point readers to Entroly's
              # neutral benchmark-methodology page instead.
              updated = re.sub(
                  r'https?://[^\s\]\)"\']*(?:external(?:[_-]adapter|[_-]baseline|context[_-]tool))[^\s\]\)"\']*',
                  'https://github.com/juyterman1000/entroly/blob/main/docs/BENCHMARKS.md',
                  updated,
                  flags=re.IGNORECASE,
              )

              # Repository benchmark adapters no longer claim a concrete external
              # distribution. Version and implementation are supplied by the
              # operator through the generic adapter contract.
              updated = updated.replace(
                  'importlib.metadata.version("external-adapter")',
                  'os.environ.get("ENTROLY_EXTERNAL_ADAPTER_VERSION", "operator-provided")',
              )
              updated = updated.replace(
                  "importlib.metadata.version('external-adapter')",
                  "os.environ.get('ENTROLY_EXTERNAL_ADAPTER_VERSION', 'operator-provided')",
              )
              updated = updated.replace(
                  '_distribution_record_sha256("external-adapter")',
                  'None',
              )
              updated = updated.replace(
                  "_distribution_record_sha256('external-adapter')",
                  'None',
              )

              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(relative.as_posix())

          adapter_files = {
              Path('external_adapter/__init__.py'): '''"""Operator-supplied adapter contract for neutral external baselines.

The Entroly repository does not bundle, identify, install, or endorse another
context product. Benchmark operators provide import targets explicitly through
environment variables. Importing an external adapter without that configuration
fails closed.
"""

from __future__ import annotations

import importlib
import os
from typing import Any


def resolve_symbol(variable: str) -> Any:
    spec = os.environ.get(variable, "").strip()
    if not spec or ":" not in spec:
        raise RuntimeError(
            f"{variable} must be set to an operator-controlled 'module:symbol' import target"
        )
    module_name, symbol_name = spec.split(":", 1)
    if not module_name or not symbol_name:
        raise RuntimeError(f"invalid external adapter import target in {variable}")
    module = importlib.import_module(module_name)
    try:
        return getattr(module, symbol_name)
    except AttributeError as error:
        raise RuntimeError(
            f"external adapter symbol {symbol_name!r} is unavailable in {module_name!r}"
        ) from error


def compress(*args: Any, **kwargs: Any) -> Any:
    implementation = resolve_symbol("ENTROLY_EXTERNAL_ADAPTER_COMPRESS")
    return implementation(*args, **kwargs)


__all__ = ["compress", "resolve_symbol"]
''',
              Path('external_adapter/cache/__init__.py'): '"""Generic recovery-store adapter namespace."""\n',
              Path('external_adapter/cache/backends/__init__.py'): '"""Generic external backend adapter namespace."""\n',
              Path('external_adapter/cache/backends/sqlite.py'): '''"""Operator-supplied persistent-backend class."""

from external_adapter import resolve_symbol


class SQLiteBackend:
    def __new__(cls, *args, **kwargs):
        implementation = resolve_symbol("ENTROLY_EXTERNAL_ADAPTER_BACKEND")
        return implementation(*args, **kwargs)
''',
              Path('external_adapter/cache/compression_store.py'): '''"""Operator-supplied recovery-store compatibility contract."""

from __future__ import annotations

from typing import Any

from external_adapter import resolve_symbol


class CompressionStore:
    def __new__(cls, *args: Any, **kwargs: Any) -> Any:
        implementation = resolve_symbol("ENTROLY_EXTERNAL_ADAPTER_STORE")
        return implementation(*args, **kwargs)


def set_request_compression_store(store: Any) -> Any:
    implementation = resolve_symbol("ENTROLY_EXTERNAL_ADAPTER_SET_REQUEST_STORE")
    return implementation(store)


def clear_request_compression_store() -> Any:
    implementation = resolve_symbol("ENTROLY_EXTERNAL_ADAPTER_CLEAR_REQUEST_STORE")
    return implementation()


__all__ = [
    "CompressionStore",
    "set_request_compression_store",
    "clear_request_compression_store",
]
''',
          }
          for path, content in adapter_files.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
              changed.append(path.as_posix())

          guard = Path('scripts/check_external_name_policy.py')
          guard.write_text('''#!/usr/bin/env python3
"""Fail when prohibited external product names enter the current tree.

Names are represented only by SHA-256 digests. This keeps the policy itself
brand-neutral while detecting plain, hyphenated, underscored, URL, package, and
identifier forms after alphanumeric normalization.
"""

from __future__ import annotations

import hashlib
import sys
from pathlib import Path


ROOT = Path(__file__).resolve().parents[1]
PROHIBITED = {
    8: {"26e93d81a9553eabd165301cad992369094b6a1759a62e94a998a94aa5315902"},
    7: {"d8a564a233ed75c8d55c193f8a56b5937cb2b5dec3b3566fa0537f7fa434dca7"},
}
SKIP_PARTS = {".git", ".venv", "node_modules", "target", "__pycache__"}


def normalized(value: str) -> str:
    return "".join(character for character in value.casefold() if character.isalnum())


def violations() -> list[str]:
    found: list[str] = []
    for path in sorted(candidate for candidate in ROOT.rglob("*") if candidate.is_file()):
        relative = path.relative_to(ROOT)
        if any(part in SKIP_PARTS for part in relative.parts):
            continue
        try:
            text = path.read_text(encoding="utf-8")
        except (UnicodeDecodeError, OSError):
            continue
        for line_number, line in enumerate(text.splitlines(), start=1):
            value = normalized(line)
            for length, digests in PROHIBITED.items():
                if len(value) < length:
                    continue
                for index in range(len(value) - length + 1):
                    digest = hashlib.sha256(value[index : index + length].encode()).hexdigest()
                    if digest in digests:
                        found.append(f"{relative}:{line_number}")
                        break
                else:
                    continue
                break
    return found


def main() -> int:
    found = violations()
    if found:
        print("prohibited external product name found in current tree:", file=sys.stderr)
        for location in found:
            print(f"- {location}", file=sys.stderr)
        return 1
    print("external-name policy check passed")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
''', encoding='utf-8')
          changed.append(guard.as_posix())

          # Keep permanent workflows and ownership aware of the policy guard.
          workflow = Path('.github/workflows/visibility-integrity.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          workflow_text = workflow_text.replace(
              '      - name: Validate owned visibility surface\n        run: python scripts/check_distribution_surface.py\n',
              '      - name: Validate owned visibility surface\n        run: |\n          python scripts/check_distribution_surface.py\n          python scripts/check_external_name_policy.py\n',
          )
          workflow.write_text(workflow_text, encoding='utf-8')

          codeowners = Path('.github/CODEOWNERS')
          codeowners_text = codeowners.read_text(encoding='utf-8')
          if '/scripts/check_external_name_policy.py @juyterman1000' not in codeowners_text:
              codeowners_text = codeowners_text.replace(
                  '/scripts/check_distribution_surface.py @juyterman1000\n',
                  '/scripts/check_distribution_surface.py @juyterman1000\n/scripts/check_external_name_policy.py @juyterman1000\n',
              )
          codeowners.write_text(codeowners_text, encoding='utf-8')

          # Remove temporary workflows before scanning or committing.
          for path in temporary:
              path.unlink(missing_ok=True)

          print(f'updated {len(set(changed))} paths')
          PY

      - name: Validate neutral current tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_external_name_policy.py
          python scripts/check_distribution_surface.py
          python -m compileall -q external_adapter benchmarks bench entroly scripts tests

      - name: Run focused regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            tests/test_distribution_surface.py \
            tests/test_visibility_release_sync.py \
            tests/test_bump_version.py \
            tests/test_recovery_resilience.py \
            tests/test_compression_latency.py \
            tests/test_compression_frontier.py \
            tests/test_readme_proof.py \
            tests/test_docs_code_sync.py -q

      - name: Commit neutralized tree and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No neutralization changes required."
            exit 0
          fi
          git commit -m "refactor(policy): neutralize named external products repository-wide"
          git push origin HEAD:feat/distribution-control-plane

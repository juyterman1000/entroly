name: Release Binary (entroly-rs)

# Builds the standalone single-binary proxy for each platform and attaches the
# artifacts to the GitHub Release for the tag. Triggered by the same
# coordinated Entroly release workflow after its release and quality gates.
#
# Native builds only: entroly-core links pyo3, which needs libpython at build
# time, so cross-compilation is impractical. Each target is built on a matching
# native runner with Python set up. (linux-aarch64 is a documented follow-on.)

on:
  workflow_call:
    inputs:
      tag:
        description: Existing GitHub Release tag to attach binaries to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-15-intel, target: x86_64-apple-darwin,     ext: "" }
          - { os: macos-14,      target: aarch64-apple-darwin,     ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,  ext: ".exe" }
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        # pyo3 needs libpython at link time for the binary (extension-module
        # feature is off here).
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SEMVER_RE='^entroly-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$RELEASE_TAG" =~ $SEMVER_RE ]]; then
            echo "Invalid coordinated release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build entroly-rs (--features proxy)
        working-directory: entroly-core
        run: cargo build --release --bin entroly-rs --features proxy --target ${{ matrix.target }}

      - name: Smoke test entroly-rs CLI
        run: python scripts/binary_cli_smoke.py "entroly-core/target/${{ matrix.target }}/release/entroly-rs${{ matrix.ext }}"

      - name: Package
        shell: bash
        run: |
          bin="entroly-core/target/${{ matrix.target }}/release/entroly-rs${{ matrix.ext }}"
          name="entroly-rs-${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bin" "dist/entroly-rs.exe"
            (cd dist && 7z a "${name}.zip" "entroly-rs.exe")
            rm "dist/entroly-rs.exe"
            archive="dist/${name}.zip"
          else
            tar -czf "dist/${name}.tar.gz" -C "entroly-core/target/${{ matrix.target }}/release" "entroly-rs"
            archive="dist/${name}.tar.gz"
          fi
          # Checksum from inside dist/ so the sidecar names the file the way a
          # user receives it. `sha256sum` echoes back whatever path it was
          # given, so passing "dist/<archive>" published a build-machine path
          # into every release:
          #
          #     2e4a23f1...  dist/entroly-rs-x86_64-unknown-linux-gnu.tar.gz
          #
          # `sha256sum -c` then looks for "dist/<archive>" relative to the
          # user's download directory and fails "No such file or directory" --
          # the documented verification step could not succeed for anyone, on
          # any platform. It also blocks the Scoop autoupdate hash extraction
          # recorded against `scoop-main` in docs/distribution/targets.json,
          # since Scoop matches on the basename.
          archive_name="$(basename "$archive")"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive_name" > "${archive_name}.sha256")
          else
            (cd dist && shasum -a 256 "$archive_name" > "${archive_name}.sha256")
          fi
          cat "${archive}.sha256"
          ls -la dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: dist/*
          # This action PATCHes the release with whatever it is given, and its
          # `draft` input defaults to false. Omitting it would publish the draft
          # from whichever matrix target finished first, re-exposing the empty
          # release this draft-first flow exists to prevent. The caller's
          # finalize-release job owns the transition to published.
          draft: true

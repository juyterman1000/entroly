name: Apply SDK Budget Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'dogfood/deep-runtime-20260727' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dogfood/deep-runtime-20260727
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply exact-count replacements
        run: python scripts/apply_sdk_budget_fix.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,proxy]' pytest-timeout psutil ruff

      - name: Prove SDK budget and public-surface contracts
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: '1'
          PYTHONUTF8: '1'
        run: |
          python -m compileall -q entroly tests
          ruff check entroly/sdk.py tests/test_public_surface_dogfood.py tests/test_sdk_content_aware.py
          python -m pytest -q --tb=short --timeout=150 \
            tests/test_public_surface_dogfood.py \
            tests/test_sdk_content_aware.py \
            tests/test_context_receipts.py

      - name: Verify scope and commit product repair
        run: |
          set -euo pipefail
          test ! -e scripts/apply_sdk_budget_fix.py
          test ! -e .github/workflows/apply-sdk-budget-fix.yml
          git diff --check
          git status --short
          git config user.name juyterman1000
          git config user.email 208309368+juyterman1000@users.noreply.github.com
          git add -A
          git commit -m 'fix(sdk): enforce conversation budgets without touching recent turns'
          git push origin HEAD:dogfood/deep-runtime-20260727

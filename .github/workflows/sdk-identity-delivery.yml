name: Validate SDK Identity-First Delivery

on:
  pull_request:
    branches:
      - feat/production-grade-defaults
    paths:
      - server.json
      - .github/patches/sdk-identity-main-1071.patch.gz.b64
      - .github/workflows/sdk-identity-delivery.yml

permissions:
  contents: read

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'ops/production-grade-sdk-identity'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 32
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify exact base and signed patch
        shell: bash
        run: |
          set -euo pipefail
          expected_base='07f0e31c12e97f3f545e895d9a548e60d87692a9'
          git merge-base --is-ancestor "$expected_base" HEAD
          test "$(git hash-object entroly/sdk.py)" = '432f1d3dff6cbdeaa9c2954e32468df8a2b955b8'
          test "$(git hash-object tests/test_sdk_content_aware.py)" = 'be4776d4a3b27831f6675b163805befc8efd20af'
          test "$(git hash-object .github/patches/sdk-identity-main-1071.patch.gz.b64)" = '5e4479d5d049dbac82e50ed0ca7de87330bbb118'
          base64 --decode .github/patches/sdk-identity-main-1071.patch.gz.b64 > /tmp/sdk-identity.patch.gz
          gzip --test /tmp/sdk-identity.patch.gz
          gzip --decompress --stdout /tmp/sdk-identity.patch.gz > /tmp/sdk-identity.patch
          echo '2277a751cbb605f103a7cdd5d267a10f1d0d74f3c29ce94abc77947aaff0a264  /tmp/sdk-identity.patch' | sha256sum --check --strict
          git apply --check /tmp/sdk-identity.patch
          git apply /tmp/sdk-identity.patch
          git diff --check

      - name: Install current package
        run: python -m pip install -e '.[test]'

      - name: Validate identity-first SDK behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q entroly/sdk.py tests/test_sdk_content_aware.py
          python -m pytest -q \
            tests/test_sdk_content_aware.py \
            tests/test_sdk_parity.py \
            tests/test_sdk_optimize_engine_parity.py \
            tests/test_public_surface_dogfood.py \
            tests/test_hardening.py \
            tests/test_bipt.py \
            tests/test_readme_features_langfuse.py \
            tests/test_tool_message_compression.py \
            tests/test_provider_adapters.py \
            tests/test_provider_policy.py \
            tests/test_model_registry.py \
            tests/test_model_registry_proxy_integration.py

      - name: Replay validated product commit onto latest feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add entroly/sdk.py tests/test_sdk_content_aware.py
          git commit -m 'fix(sdk): preserve identity before message pruning'
          validated_commit="$(git rev-parse HEAD)"
          git format-patch -1 --stdout "$validated_commit" > /tmp/validated-sdk-identity.patch
          git fetch origin feat/production-grade-defaults
          git switch --force-create validated-delivery origin/feat/production-grade-defaults
          git am /tmp/validated-sdk-identity.patch
          git push origin HEAD:feat/production-grade-defaults

name: Repair PR 205 README Contracts

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feat/agent-compatibility-matrix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply fail-closed README repair
        id: apply
        continue-on-error: true
        run: |
          set +e
          python .github/repair_pr205_readme.py > readme-repair.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Capture exact match diagnostics
        if: always()
        run: |
          python - <<'PY' > readme-repair-diagnostic.txt
          from pathlib import Path
          import re
          text = Path('README.md').read_text(encoding='utf-8')
          checks = {
              'old_identity': 'Entroly uses budgeted context selection, content-addressed recovery, and auditable receipts to lower provider-bound inference expenditure—without rewriting your codebase or agent architecture.',
              'new_identity': 'content-addressed evidence',
              'see_value_anchor': '  <a href="#see-value-in-your-first-session"><b>See value</b></a> ·\n',
              'ai_cost_link': 'docs/ai-cost-optimization.html',
              'old_stars_alt': 'alt="Entroly repository and GitHub stars"',
              'new_stars_alt': 'alt="Entroly GitHub stars"',
              'marketplace_badge': 'lobehub.com/badge/',
              'prism_scope_marker': 'PRISM-R is an opt-in research prototype',
          }
          for name, value in checks.items():
              print(f'{name}={text.count(value)}')
          print('prism_bounded_blocks=' + str(len(re.findall(r'<sub>These are offline exact-evidence pilots on frozen SQuAD v2 subsets,.*?</sub>', text, flags=re.DOTALL))))
          print('apply_exit_code=${{ steps.apply.outputs.exit_code }}')
          print('--- repair log ---')
          print(Path('readme-repair.log').read_text(encoding='utf-8', errors='replace'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr205-readme-repair-diagnostic
          path: readme-repair-diagnostic.txt
      - name: Validate README structure
        run: |
          test "${{ steps.apply.outputs.exit_code }}" = "0"
          ! grep -q 'lobehub.com/badge/' README.md
          grep -q 'content-addressed evidence' README.md
          grep -q 'docs/ai-cost-optimization.html' README.md
          grep -q 'alt="Entroly GitHub stars"' README.md
          grep -q 'PRISM-R is an opt-in research prototype' README.md
          git diff --check
      - name: Commit README repair
        run: |
          rm -f .github/repair_pr205_readme.py
          rm -f .github/workflows/repair-pr205-readme.yml
          git config user.name juyterman1000
          git config user.email 208309368+juyterman1000@users.noreply.github.com
          git add -A
          git commit -m 'fix(docs): align cost positioning with trust contracts'
          git push origin HEAD:${{ github.head_ref }}

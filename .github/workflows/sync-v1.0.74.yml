name: Synchronize release 1.0.74

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-version:
    if: github.head_ref == 'release/v1.0.74'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v1.0.74
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Synchronize every approved release surface
        run: python scripts/bump_version.py 1.0.74

      - name: Verify version and release-surface contracts
        run: |
          python -m pytest -q \
            tests/test_bump_version.py \
            tests/test_release_version_sync.py \
            tests/test_release_surface.py \
            tests/test_release_surface_consistency.py

      - name: Remove one-shot workflow
        run: rm .github/workflows/sync-v1.0.74.yml

      - name: Commit synchronized release identity
        run: |
          git config user.name 'juyterman1000'
          git config user.email 'fastrunner10090@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No release changes were generated.' >&2
            exit 1
          fi
          git commit -m 'chore(release): synchronize version 1.0.74 everywhere'
          git push origin HEAD:release/v1.0.74

name: Commit Identity Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded runs cancel themselves.
#
# Four pushes to one draft branch inside three minutes queued 26 duplicate runs
# and starved every other pull request of ubuntu runners for over an hour, while
# macOS and Windows -- separate runner pools -- finished in a minute. The older
# runs were validating commits that had already been replaced, so the queue was
# spent on answers nobody could use.
#
# Keyed on the pull request number so concurrent pull requests never cancel each
# other; `github.ref` is the fallback for push and dispatch events.
concurrency:
  group: commit-identity-guard-${{ github.event.pull_request.number || github.ref }}
  # Only pull-request runs cancel. A push to main can be the run that publishes,
  # tags, or syncs a release surface, and cancelling one of those mid-flight
  # leaves partial state behind -- exactly the "release automation stays boring"
  # rule in CLAUDE.md.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-identity:
    name: Commit Identity Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify commit author and committer
        env:
          EXPECTED_LOGIN: juyterman1000
          EXPECTED_NOREPLY_EMAIL: 208309368+juyterman1000@users.noreply.github.com
          EXPECTED_ACCOUNT_EMAIL: fastrunner10090@gmail.com
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path

          expected_login = os.environ["EXPECTED_LOGIN"]
          owner_emails = {
              os.environ["EXPECTED_NOREPLY_EMAIL"],
              os.environ["EXPECTED_ACCOUNT_EMAIL"],
          }
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          event_name = os.environ["GITHUB_EVENT_NAME"]

          if event_name == "pull_request":
              rev = f'{event["pull_request"]["base"]["sha"]}..{event["pull_request"]["head"]["sha"]}'
          else:
              before = event.get("before", "")
              after = event["after"]
              rev = after if not before or set(before) == {"0"} else f"{before}..{after}"

          rows = subprocess.check_output(
              [
                  "git",
                  "log",
                  "--first-parent",
                  "--format=%H%x1f%an%x1f%ae%x1f%cn%x1f%ce%x1e",
                  rev,
              ],
              text=True,
          )

          def owner_identity(_name: str, email: str) -> bool:
              return email in owner_emails

          def github_service_committer(name: str, email: str) -> bool:
              return name in {"GitHub", "web-flow"} and (
                  email == "noreply@github.com"
                  or email.endswith("+web-flow@users.noreply.github.com")
              )

          def git_output(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True)

          def changed_paths(commit: str) -> set[str]:
              return set(
                  git_output(
                      "diff-tree", "--no-commit-id", "--name-only", "-r", commit
                  ).splitlines()
              )

          def dependency_path(path: str) -> bool:
              dependency_files = {
                  "Cargo.lock",
                  "Cargo.toml",
                  "Pipfile",
                  "Pipfile.lock",
                  "go.mod",
                  "go.sum",
                  "package-lock.json",
                  "package.json",
                  "pnpm-lock.yaml",
                  "poetry.lock",
                  "pyproject.toml",
                  "requirements-dev.txt",
                  "requirements.txt",
                  "uv.lock",
                  "yarn.lock",
              }
              name = Path(path).name
              return (
                  name in dependency_files
                  or name.startswith("requirements")
                  and name.endswith(".txt")
                  or path.startswith(".github/workflows/")
                  and Path(path).suffix in {".yml", ".yaml"}
                  or path == ".github/dependabot.yml"
              )

          def trusted_dependabot_author(
              commit: str,
              author_name: str,
              author_email: str,
              committer_name: str,
              committer_email: str,
          ) -> bool:
              if (
                  author_name != "dependabot[bot]"
                  or author_email
                  != "49699333+dependabot[bot]@users.noreply.github.com"
                  or not github_service_committer(committer_name, committer_email)
              ):
                  return False

              paths = changed_paths(commit)
              if not paths or not all(dependency_path(path) for path in paths):
                  return False

              if event_name == "pull_request":
                  pull_request = event.get("pull_request", {})
                  head = pull_request.get("head", {})
                  head_repository = head.get("repo") or {}
                  return (
                      (pull_request.get("user") or {}).get("login")
                      == "dependabot[bot]"
                      and str(head.get("ref", "")).startswith("dependabot/")
                      and head_repository.get("full_name")
                      == os.environ["GITHUB_REPOSITORY"]
                  )

              if event_name != "push" or event.get("ref") != "refs/heads/main":
                  return False
              if event.get("sender", {}).get("login") != expected_login:
                  return False
              subject = git_output("show", "-s", "--format=%s", commit).strip()
              return bool(
                  re.fullmatch(
                      r"(?:(?:build|chore)\(deps(?:-[^)]+)?\): (?:bump|update)|Bump|Update) "
                      r".+ \(#\d+\)",
                      subject,
                      re.IGNORECASE,
                  )
              )

          def trusted_homebrew_automation_author(
              commit: str,
              author_name: str,
              author_email: str,
              committer_name: str,
              committer_email: str,
          ) -> bool:
              if event_name != "push" or event.get("ref") != "refs/heads/main":
                  return False
              if event.get("sender", {}).get("login") != expected_login:
                  return False
              if (
                  author_name != "github-actions[bot]"
                  or author_email
                  != "41898282+github-actions[bot]@users.noreply.github.com"
                  or not github_service_committer(committer_name, committer_email)
              ):
                  return False

              parents = git_output("rev-list", "--parents", "-n", "1", commit).split()
              if len(parents) != 2:
                  return False

              message = git_output("show", "-s", "--format=%B", commit)
              lines = message.splitlines()
              if not lines:
                  return False
              subject_match = re.fullmatch(
                  r"Update Homebrew formula for (\d+\.\d+\.\d+) \(#\d+\)",
                  lines[0],
              )
              if not subject_match:
                  return False
              coauthor_emails = {
                  match.group(1)
                  for line in lines[1:]
                  if (
                      match := re.fullmatch(
                          r"Co-authored-by: .+ <([^<>]+)>", line, re.IGNORECASE
                      )
                  )
              }
              if owner_emails.isdisjoint(coauthor_emails):
                  return False

              if changed_paths(commit) != {
                  "packaging/homebrew/entroly.rb",
                  "tests/test_release_surface.py",
              }:
                  return False

              version = subject_match.group(1)
              formula = git_output(
                  "show", f"{commit}:packaging/homebrew/entroly.rb"
              )
              release_test = git_output(
                  "show", f"{commit}:tests/test_release_surface.py"
              )
              formula_sha = re.search(
                  r'^\s*sha256 "([0-9a-f]{64})"$', formula, re.MULTILINE
              )
              test_sha = re.search(
                  r'^HOMEBREW_FORMULA_SHA256 = "([0-9a-f]{64})"$',
                  release_test,
                  re.MULTILINE,
              )
              return bool(
                  f"entroly-{version}.tar.gz" in formula
                  and f'HOMEBREW_FORMULA_VERSION = "{version}"' in release_test
                  and formula_sha
                  and test_sha
                  and formula_sha.group(1) == test_sha.group(1)
              )

          def exact_github_actions_bot(
              author_name: str,
              author_email: str,
              committer_name: str,
              committer_email: str,
          ) -> bool:
              return (
                  author_name == "github-actions[bot]"
                  and author_email
                  == "41898282+github-actions[bot]@users.noreply.github.com"
                  and committer_name == "github-actions[bot]"
                  and committer_email
                  == "41898282+github-actions[bot]@users.noreply.github.com"
              )

          def attested_qccr_validation_commit(
              commit: str,
              author_name: str,
              author_email: str,
              committer_name: str,
              committer_email: str,
          ) -> bool:
              attestations = {
                  "082a6c038ca5bde1eb02ee865f18207256a4c904": (
                      "fix(qccr): preserve query-rooted dependency evidence",
                      {
                          "entroly-qccr/src/dependency_anchor.rs",
                          "entroly-qccr/src/lib.rs",
                      },
                  ),
                  "dd5a0d8310c6d564939fcff91d7684cee87ad23a": (
                      "fix(qccr): make dependency anchors atomic",
                      {"entroly-qccr/src/lib.rs"},
                  ),
              }
              expected = attestations.get(commit)
              if expected is None or not exact_github_actions_bot(
                  author_name, author_email, committer_name, committer_email
              ):
                  return False
              expected_subject, expected_paths = expected
              subject = git_output("show", "-s", "--format=%s", commit).strip()
              return subject == expected_subject and changed_paths(commit) == expected_paths

          def attested_historical_workgraph_automation_commit(
              commit: str,
              author_name: str,
              author_email: str,
              committer_name: str,
              committer_email: str,
          ) -> bool:
              # These immutable objects were produced by temporary Work Graph
              # assembly/finalization workflows before the integration branch
              # adopted the current identity guard. They were individually
              # audited during PR #352 hardening. This is deliberately not a
              # reusable bot exception: SHA, subject, exact path set, author,
              # and committer all have to match.
              attestations = {
                  "e67429e7b921734c2a9f7fce0c093914ea880019": (
                      "chore(work-graph): record finalizer diagnostics",
                      {".workgraph-finalize-result.txt"},
                  ),
                  "37b87ac6c5f67103e4335cab6e5e6eea77716f52": (
                      "chore(work-graph): record finalizer diagnostics",
                      {".workgraph-finalize-result.txt"},
                  ),
                  "8ec369ad21d54008da2a71d4030143051ae9148d": (
                      "chore(work-graph): record finalizer diagnostics",
                      {".workgraph-finalize-result.txt"},
                  ),
                  "ab1e7121aa69a21b67c4e887d7795da2f5b46e3c": (
                      "feat: register AI Work Graph across Python and npm",
                      {
                          "entroly-core/src/lib.rs",
                          "entroly-wasm/index.d.ts",
                          "entroly-wasm/index.js",
                          "entroly-wasm/package.json",
                          "entroly-wasm/src/lib.rs",
                          "entroly/__init__.py",
                      },
                  ),
                  "9287691fcc08ad2b98163c352e3b3fb90f34c33a": (
                      "chore(work-graph): publish cross-runtime validation diagnostics",
                      {".workgraph-validation-bindings.txt"},
                  ),
                  "51aaadffee8913f4d8fae21e8ae7f0f7213081d5": (
                      "chore(work-graph): record finalizer diagnostics",
                      {".workgraph-finalize-result.txt"},
                  ),
                  "173a231c79abe6ac64d09221d8dbb278d0a3ddd5": (
                      "feat(engine): add evidence-backed AI Work Graph core",
                      {
                          ".github/workflows/workgraph-assemble.yml",
                          ".workgraph-bootstrap/chunk-00",
                          ".workgraph-bootstrap/chunk-01",
                          ".workgraph-bootstrap/chunk-02",
                          ".workgraph-bootstrap/chunk-03",
                          ".workgraph-bootstrap/v3-00",
                          ".workgraph-bootstrap/v3-01",
                          ".workgraph-bootstrap/v3-02",
                          ".workgraph-bootstrap/v3-03",
                          ".workgraph-bootstrap/v3-04",
                          ".workgraph-bootstrap/v4-00",
                          ".workgraph-bootstrap/v4-01",
                          ".workgraph-bootstrap/v4-02",
                          ".workgraph-bootstrap/validation-v4.txt",
                          ".workgraph-bootstrap/validation.txt",
                          "entroly-engine/Cargo.toml",
                          "entroly-engine/src/lib.rs",
                          "entroly-engine/src/work_graph.rs",
                      },
                  ),
                  "a65beb70723582f04475f1e50958ce000240c1b6": (
                      "chore(work-graph): publish Rust v4 validation diagnostics",
                      {".workgraph-bootstrap/validation-v4.txt"},
                  ),
                  "4cd5fc603f363f04140f2673b258345c3b662513": (
                      "chore(work-graph): publish Rust validation diagnostics",
                      {".workgraph-bootstrap/validation.txt"},
                  ),
              }
              expected = attestations.get(commit)
              if expected is None or not exact_github_actions_bot(
                  author_name, author_email, committer_name, committer_email
              ):
                  return False
              expected_subject, expected_paths = expected
              subject = git_output("show", "-s", "--format=%s", commit).strip()
              return subject == expected_subject and changed_paths(commit) == expected_paths

          failures = []
          for row in rows.split("\x1e"):
              row = row.strip("\r\n")
              if not row:
                  continue
              commit, an, ae, cn, ce = row.split("\x1f")
              attested_qccr = attested_qccr_validation_commit(commit, an, ae, cn, ce)
              attested_workgraph = attested_historical_workgraph_automation_commit(
                  commit, an, ae, cn, ce
              )
              if (
                  not owner_identity(an, ae)
                  and not trusted_dependabot_author(commit, an, ae, cn, ce)
                  and not trusted_homebrew_automation_author(commit, an, ae, cn, ce)
                  and not attested_qccr
                  and not attested_workgraph
              ):
                  failures.append(f"{commit[:12]} author is {an} <{ae}>")
              if (
                  not owner_identity(cn, ce)
                  and not github_service_committer(cn, ce)
                  and not attested_qccr
                  and not attested_workgraph
              ):
                  failures.append(f"{commit[:12]} committer is {cn} <{ce}>")

          if failures:
              print("Commit identity guard failed.")
              print(f"Required author account: {expected_login} via a verified owner email")
              print(
                  "Allowed automation: path-scoped Dependabot PRs, reviewed Homebrew release "
                  "updates, immutable attested QCCR validation commits, and immutable audited "
                  "historical Work Graph automation objects"
              )
              print(
                  "Allowed committers: the owner account, GitHub web-flow, or an exact immutable attested object"
              )
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)

          print(f"Commit identity OK for {rev}")
          PY

          LIMIT, BUDGET, SEED = 5, 2000, 20260807
          payload = json.loads((REPO / 'benchmarks/results/graph_lane_tasks.json').read_text(encoding='utf-8'))
          probes = build_probes([Task(**row) for row in payload['tasks']], LIMIT)
          corpus = sorted({str(path.relative_to(REPO)).replace('\\', '/') for path in _tracked_python_files()})

          def signature_lines(callee, rel):
              text = (REPO / rel).read_text(encoding='utf-8', errors='replace')
              lines = text.splitlines()
              tree = ast.parse(text)
              target = None
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == callee:
                      target = node
                      break
                  if isinstance(node, ast.ClassDef) and node.name == callee:
                      target = next((sub for sub in node.body if isinstance(sub, (ast.FunctionDef, ast.AsyncFunctionDef)) and sub.name == '__init__'), None)
                      break
              if target is None:
                  raise RuntimeError((callee, rel))
              body_line = target.body[0].lineno if target.body else target.end_lineno
              return tuple(line.strip() for line in lines[target.lineno - 1:max(target.lineno, body_line - 1)] if line.strip())

          full = delivered = 0
          for idx, probe in enumerate(probes, 1):
              pool = _pool_for(probe.task, corpus, 48, SEED)
              texts = {rel: _read(rel) for rel in pool}
              context = _context_for('qccr', probe, pool, texts, BUDGET)
              sig = signature_lines(probe.task.callee, probe.task.callee_file)
              file_delivered = f'### {probe.task.callee_file}' in context
              full_signature = all(line in context for line in sig)
              delivered += int(file_delivered)
              full += int(full_signature)
              print('FIX_PROBE', idx, f'callee={probe.task.callee!r}', f'file_delivered={file_delivered}', f'full_signature_present={full_signature}', f'gold_presence={tuple((param, param in context) for param in probe.params)!r}', f'context_tokens={_tokens(context)}')
          print(f'FIX_SUMMARY full_signatures={full}/5 defining_files_delivered={delivered}/5')
          if full < 4:
              raise SystemExit(f'complete signature survival did not reach 4/5: {full}/5')
          if delivered < 5:

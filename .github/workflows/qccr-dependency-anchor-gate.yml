name: QCCR Dependency Anchor Gate

on:
  pull_request:
    branches: [main]

jobs:
  validate-clean-and-persist:
    if: github.head_ref == 'diagnostic/qccr-rendering-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout exact uncontaminated pre-fix candidate
        uses: actions/checkout@v6
        with:
          ref: d333f1d9c3d72ae32692583d4318eceb99e90944
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Create test environment
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin ruff --timeout 120 --retries 5
          .venv/bin/pip install -e '.[test]' --timeout 120 --retries 5

      - name: Apply query-rooted dependency-anchor candidate
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path

          path = Path('entroly-qccr/src/lib.rs')
          text = path.read_text(encoding='utf-8')

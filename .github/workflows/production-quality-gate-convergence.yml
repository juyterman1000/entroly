name: One-time Production Quality Gate Convergence

on:
  push:
    branches: [fix/docker-quality-gate-convergence]
    paths:
      - '.github/workflows/production-quality-gate-convergence.yml'

permissions:
  contents: write

concurrency:
  group: entroly-production-quality-gate-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/docker-quality-gate-convergence
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Align the production quality gate with the tested package contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/entroly-publish.yml')
          text = path.read_text(encoding='utf-8')

          old_install = '''          .venv/bin/pip install --timeout 120 --retries 5 -e . \\
            "mcp>=1.6.0" "httpx>=0.27" "starlette>=0.37" \\
            "uvicorn>=0.30" psutil pytest pytest-timeout'''
          new_install = '''          .venv/bin/pip install --timeout 120 --retries 5 -e . \\
            "mcp>=1.28.1,<2" "httpx>=0.28.1" "starlette>=1.3.1" \\
            "uvicorn>=0.51.0" psutil pytest pytest-timeout'''
          if old_install not in text and new_install not in text:
              raise SystemExit('production quality-gate dependency block did not match expected old or new form')
          text = text.replace(old_install, new_install)

          old_test = '        run: .venv/bin/pytest tests/ -q --tb=short -x --timeout=60'
          new_test = '''        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          .venv/bin/python -m pytest tests/ -q --tb=short -x --timeout=60'''
          if old_test not in text and new_test not in text:
              raise SystemExit('production quality-gate test step did not match expected old or new form')
          text = text.replace(old_test, new_test)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Prove the main-branch failure path is repaired
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/entroly-publish.yml').read_text(encoding='utf-8')
          quality_gate = text.split('  quality-gate:', 1)[1].split('  release-anchor:', 1)[0]
          required = (
              '"mcp>=1.28.1,<2"',
              '"httpx>=0.28.1"',
              '"starlette>=1.3.1"',
              '"uvicorn>=0.51.0"',
              'export PATH="$PWD/.venv/bin:$PATH"',
              '.venv/bin/python -m pytest tests/ -q --tb=short -x --timeout=60',
          )
          missing = [item for item in required if item not in quality_gate]
          if missing:
              raise SystemExit(f'production quality gate is missing: {missing}')
          forbidden = (
              '"mcp>=1.6.0"',
              '"httpx>=0.27"',
              '"starlette>=0.37"',
              '"uvicorn>=0.30"',
              'run: .venv/bin/pytest tests/',
          )
          stale = [item for item in forbidden if item in quality_gate]
          if stale:
              raise SystemExit(f'production quality gate still contains stale contracts: {stale}')
          PY

          python -m venv .probe-venv
          .probe-venv/bin/python -m pip install --upgrade pip
          .probe-venv/bin/pip install --timeout 120 --retries 5 -e . pytest pytest-timeout
          export PATH="$PWD/.probe-venv/bin:$PATH"
          .probe-venv/bin/python -m pytest \
            tests/test_release_surface.py \
            tests/test_release_surface_consistency.py \
            tests/test_deep_dogfood_runtime.py::test_console_version_matches_imported_package \
            -q --tb=short --timeout=60

      - name: Commit verified production-gate repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .probe-venv
          rm -f .github/workflows/production-quality-gate-convergence.yml
          git add -A
          git diff --cached --check
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git commit -m 'fix(ci): repair main Docker quality gate for isolated venvs'
          git push origin HEAD:fix/docker-quality-gate-convergence

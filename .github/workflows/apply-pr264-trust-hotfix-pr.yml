name: Apply PR264 trust hotfix on review

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/pr264-trust-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Extract and apply reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          workflow = Path('.github/workflows/apply-pr264-trust-hotfix.yml').read_text(encoding='utf-8')
          match = re.search(r"payload = '''([A-Za-z0-9+/=]+)'''", workflow)
          if not match:
              raise SystemExit('reviewed hotfix payload not found')
          Path('scripts/apply_pr264_hotfix.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python scripts/apply_pr264_hotfix.py
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest packaging
          python -m pip install -e . --no-deps
      - name: Focused Python trust tests
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: '1'
        run: |
          python -m pytest -q \
            tests/test_pr264_trust_hotfix.py \
            tests/test_codec_contract.py \
            tests/test_log_codec_collapses_repeats.py \
            tests/test_json_codec_preserves_values.py \
            tests/test_sufficiency_certificate.py \
            tests/test_qccr_cross_surface_parity.py
      - name: Rust and regex-lite wrapper tests
        run: |
          cargo test --manifest-path entroly-engine/Cargo.toml simhash_wide
          cargo test --manifest-path entroly-wasm/Cargo.toml qccr::parity_tests
          cargo check --manifest-path entroly-wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Commit validated hotfix
        shell: bash
        run: |
          rm -f scripts/apply_pr264_hotfix.py \
            .github/workflows/apply-pr264-trust-hotfix.yml \
            .github/workflows/apply-pr264-trust-hotfix-pr.yml
          git config user.name 'entroly-hotfix-bot'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add -A
          git commit -m 'fix(trust): make PR 264 fail-closed and byte-recoverable'
          git push origin HEAD:hotfix/pr264-trust-contracts

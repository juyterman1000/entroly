name: Apply PR264 trust hotfix on review

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr264-trust-hotfix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/pr264-trust-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify, decode, and apply reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          parts = sorted(Path('.github/hotfix').glob('pr264_payload.*'))
          if len(parts) != 9:
              raise SystemExit(f'expected 9 payload blocks, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          if len(encoded) != 16696:
              raise SystemExit(f'payload length mismatch: {len(encoded)} != 16696')
          actual = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          expected = '51892cda94b2ba2bdcd70539db757c6259adb4687119039ffda1e5b653fe8a93'
          if actual != expected:
              raise SystemExit(f'payload checksum mismatch: {actual} != {expected}')
          raw = gzip.decompress(base64.b64decode(encoded))
          raw_sha = hashlib.sha256(raw).hexdigest()
          if raw_sha != '79e28f172d2cd92102f7f2b51cef6fc602d587034ef020b99f26d77b7cb89acf':
              raise SystemExit(f'patcher checksum mismatch: {raw_sha}')
          Path('scripts/apply_pr264_hotfix.py').write_bytes(raw)
          PY
          python scripts/apply_pr264_hotfix.py
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest packaging
          python -m pip install -e . --no-deps
      - name: Focused Python trust tests
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: '1'
        run: |
          python -m pytest -q \
            tests/test_pr264_trust_hotfix.py \
            tests/test_codec_contract.py \
            tests/test_log_codec_collapses_repeats.py \
            tests/test_json_codec_preserves_values.py \
            tests/test_sufficiency_certificate.py \
            tests/test_qccr_cross_surface_parity.py
      - name: Rust and regex-lite wrapper tests
        run: |
          cargo test --manifest-path entroly-engine/Cargo.toml simhash_wide
          cargo test --manifest-path entroly-wasm/Cargo.toml qccr::parity_tests
          cargo check --manifest-path entroly-wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Commit validated hotfix
        shell: bash
        run: |
          rm -f scripts/apply_pr264_hotfix.py \
            .github/workflows/apply-pr264-trust-hotfix.yml \
            .github/workflows/apply-pr264-trust-hotfix-pr.yml \
            .github/hotfix/pr264_payload.* \
            docs/reviews/.gitkeep
          git config user.name 'entroly-hotfix-bot'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add -A
          git commit -m 'fix(trust): make PR 264 fail-closed and byte-recoverable'
          git push origin HEAD:hotfix/pr264-trust-contracts

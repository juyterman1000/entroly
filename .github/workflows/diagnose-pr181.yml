name: Diagnose PR181 Python Failure

on:
  push:
    branches:
      - fix/session-rescue-trust-recovery-v2

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pure-Python test surface
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install "mcp>=1.6.0" "httpx>=0.27" "starlette>=0.37" "uvicorn>=0.30" psutil pytest pytest-timeout

      - name: Capture first failing test
        shell: bash
        run: |
          set +e
          pytest tests/ -q --tb=short -x --timeout=60 -p no:cacheprovider \
            --ignore=tests/functional_test.py \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_ios.py \
            --ignore=tests/test_rust_cogops.py \
            --ignore=tests/test_deep_functional.py \
            --ignore=tests/test_engine_isolation.py \
            --ignore=tests/test_localization.py \
            --ignore=tests/test_benchmark_harness.py \
            > pytest-output.txt 2>&1
          status=$?
          printf '%s\n' "$status" > pytest-exit-code.txt
          tail -n 300 pytest-output.txt > pytest-tail.txt
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v7
        with:
          name: pr181-pytest-diagnostic
          path: |
            pytest-output.txt
            pytest-tail.txt
            pytest-exit-code.txt
          if-no-files-found: error

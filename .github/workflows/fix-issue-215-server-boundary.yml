name: Apply issue 215 server boundary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Move compaction to MCP serialization boundary
        run: |
          if git apply --check .github/issue-215-server.patch; then
            git apply .github/issue-215-server.patch
          elif git apply --reverse --check .github/issue-215-server.patch; then
            echo "Server boundary already applied"
          else
            echo "Issue 215 patch no longer matches server.py" >&2
            exit 1
          fi

      - name: Run focused regression suite
        run: |
          python -m py_compile entroly/provenance.py entroly/server.py
          python -m pytest -q tests/test_mcp_payload_bounds.py

      - name: Commit server repair
        run: |
          if git diff --quiet -- entroly/server.py; then
            echo "No server change needed"
            exit 0
          fi
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git add entroly/server.py
          git commit -m "fix(mcp): apply compaction at serialization boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

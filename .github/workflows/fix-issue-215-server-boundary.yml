name: Apply issue 215 server boundary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Move compaction to MCP serialization boundary
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("entroly/server.py")
          source = path.read_text(encoding="utf-8")

          if "compact_optimize_result_for_wire(result)" in source:
              print("server boundary already applied")
              raise SystemExit(0)

          old_import = "from .provenance import build_provenance"
          new_import = (
              "from .provenance import build_provenance, "
              "compact_optimize_result_for_wire"
          )
          if old_import not in source:
              raise SystemExit("provenance import anchor not found")
          source = source.replace(old_import, new_import, 1)

          old_provenance = '        result["provenance"] = provenance.to_dict()\n'
          new_provenance = '        result["provenance"] = provenance.to_wire_dict()\n'
          if old_provenance not in source:
              raise SystemExit("provenance serialization anchor not found")
          source = source.replace(old_provenance, new_provenance, 1)

          old_return = '''        if _guidance is not None:
              result["guidance"] = _guidance

          return json.dumps(result, indent=2)
          '''
          new_return = '''        if _guidance is not None:
              result["guidance"] = _guidance

          # MCP-only serialization boundary. Keep the rich engine result intact
          # through provenance, learning, nudges, savings, and hardening; compact
          # only when every in-process consumer has finished.
          compact_optimize_result_for_wire(result)

          return json.dumps(result, indent=2)
          '''
          if old_return not in source:
              raise SystemExit("MCP return anchor not found")
          source = source.replace(old_return, new_return, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Run focused regression suite
        run: |
          python -m py_compile entroly/provenance.py entroly/server.py
          python -m pytest -q tests/test_mcp_payload_bounds.py

      - name: Commit server repair
        run: |
          if git diff --quiet -- entroly/server.py; then
            echo "No server change needed"
            exit 0
          fi
          git config user.name "juyterman1000"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git add entroly/server.py
          git commit -m "fix(mcp): apply compaction at serialization boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

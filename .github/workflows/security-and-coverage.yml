name: Security and coverage

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Reject newly introduced critical vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical

  trust-critical-coverage:
    name: Trust-critical Python coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install coverage test surface
        run: python -m pip install --disable-pip-version-check -e ".[test]" pytest-cov==7.0.0
      - name: Measure trust-critical branch coverage
        run: >-
          pytest -q
          tests/test_context_commit.py
          tests/test_context_receipts.py
          tests/test_recoverable_receipts.py
          tests/test_session_attach.py
          tests/test_verify_claims_packaged.py
          --cov=entroly.context_commit
          --cov=entroly.context_receipts
          --cov=entroly.sdk
          --cov=entroly.session_attach
          --cov=entroly.verify_claims
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-fail-under=70
      - name: Preserve machine-readable coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trust-critical-python-coverage
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

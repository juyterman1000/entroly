name: Copilot Composite E2E Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  copilot-real-client:
    if: github.head_ref == 'feat/agent-compatibility-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Entroly and pinned Copilot CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm install --global '@github/copilot@1.0.74'
          entroly --version
          copilot --version
      - name: Run real Copilot proxy and MCP composite probe
        env:
          ENTROLY_DISABLE_UPDATE_CHECK: '1'
        run: python .github/copilot_composite_e2e_probe.py
      - name: Upload composite E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: copilot-composite-e2e-probe
          path: |
            copilot-composite-e2e.json
            copilot-composite-e2e.log
          if-no-files-found: error
          retention-days: 14

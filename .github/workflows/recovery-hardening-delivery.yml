name: Validate Secure Recovery Delivery

on:
  pull_request:
    branches:
      - feat/production-grade-defaults
    paths:
      - server.json
      - .github/patches/recovery-hardening.part01
      - .github/patches/recovery-hardening.part02
      - .github/patches/recovery-hardening.part03
      - .github/patches/recovery-hardening.part04
      - .github/patches/recovery-hardening.part05
      - .github/workflows/recovery-hardening-delivery.yml

permissions:
  contents: read

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'ops/production-grade-recovery-hardening'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify ancestry and exact patch
        shell: bash
        run: |
          set -euo pipefail
          expected_base='9f2168422779ede44b6086768bb3499767504398'
          git merge-base --is-ancestor "$expected_base" HEAD
          cat \
            .github/patches/recovery-hardening.part01 \
            .github/patches/recovery-hardening.part02 \
            .github/patches/recovery-hardening.part03 \
            .github/patches/recovery-hardening.part04 \
            .github/patches/recovery-hardening.part05 \
            > /tmp/recovery-hardening.patch.gz.b64
          base64 --decode /tmp/recovery-hardening.patch.gz.b64 > /tmp/recovery-hardening.patch.gz
          gzip --test /tmp/recovery-hardening.patch.gz
          gzip --decompress --stdout /tmp/recovery-hardening.patch.gz > /tmp/recovery-hardening.patch
          echo 'cdc9da4d981ac6aa781d2117f816c0d5e26280fc2b8bc32d90bdec63700c9182  /tmp/recovery-hardening.patch' | sha256sum --check --strict
          git apply --check /tmp/recovery-hardening.patch
          git apply /tmp/recovery-hardening.patch
          git diff --check

      - name: Install patched package and complete test tooling
        run: python -m pip install -e '.[test]'

      - name: Validate secure recovery and clean test tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q entroly benchmarks/agentic_task_miner.py tests/test_recovery_default_wiring.py
          python -m pytest -q \
            tests/test_agentic_task_miner.py \
            tests/test_recovery_default_wiring.py \
            tests/test_memory_package_metadata.py \
            tests/test_release_surface.py \
            tests/test_compression_retrieval_store.py \
            tests/test_recovery_store_trust.py \
            tests/test_recovery_resilience.py \
            tests/test_recovery_public_export.py \
            tests/test_compression_proxy.py \
            tests/test_compression_proxy_direct.py \
            tests/test_proxy_access_security.py \
            tests/test_proxy_control_plane_trust.py \
            tests/test_proxy_providers.py \
            tests/test_proxy_session_rescue.py \
            tests/test_proxy_transport_final.py \
            tests/test_session_rescue.py \
            tests/test_compression_verification_loop.py \
            tests/test_compression_dashboard.py \
            tests/test_recoverable_receipts.py \
            tests/test_process_safety.py \
            tests/test_public_surface_dogfood.py

      - name: Replay validated product commit onto latest feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add \
            benchmarks/agentic_task_miner.py \
            entroly/__init__.py \
            entroly/compression_dashboard.py \
            entroly/compression_proxy.py \
            entroly/compression_proxy_direct.py \
            entroly/compression_verification_loop.py \
            entroly/neural_evidence_selector.py \
            entroly/proxy.py \
            entroly/pyproject.toml \
            entroly/session_rescue.py \
            pyproject.toml \
            tests/test_agentic_task_miner.py \
            tests/test_memory_package_metadata.py \
            tests/test_recovery_default_wiring.py
          git commit -m 'fix(runtime): secure recovery defaults and self-contain test tooling'
          validated_commit="$(git rev-parse HEAD)"
          git format-patch -1 --stdout "$validated_commit" > /tmp/validated-recovery-hardening.patch
          git fetch origin feat/production-grade-defaults
          git switch --force-create validated-delivery origin/feat/production-grade-defaults
          git am /tmp/validated-recovery-hardening.patch
          git push origin HEAD:feat/production-grade-defaults

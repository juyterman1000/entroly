name: Apply CI Pin Contract Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/ci-pin-protection-contracts'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/ci-pin-protection-contracts
          fetch-depth: 0

      - name: Apply staged repair
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .ci/ci-pin-contract-fix.patch
          git apply .ci/ci-pin-contract-fix.patch
          python -m py_compile \
            entroly/checkpoint.py \
            tests/test_checkpoint_relevance.py \
            entroly-core/tests/test_integration.py \
            entroly-core/tests/test_brutal.py

      - name: Validate pure-Python checkpoint contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_checkpoint_relevance.py

      - name: Build native engine
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate native integration contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install -q maturin
          (cd entroly-core && ../.venv/bin/maturin develop --release)
          .venv/bin/python entroly-core/tests/test_integration.py
          .venv/bin/python entroly-core/tests/test_brutal.py

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/ci-pin-contract-fix.patch
          rm -f .github/workflows/apply-ci-pin-contract-fix.yml
          git config user.name 'juyterman1000'
          git config user.email '208309368+juyterman1000@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ci): align pin contracts and checkpoint ordering'
          git push origin HEAD:fix/ci-pin-protection-contracts

name: Integration - Apply Work Graph Passive Snapshot Dedupe

on:
  push:
    branches:
      - integration/workgraph-production-20260817
    paths:
      - .github/workflows/integration-workgraph-passive-dedupe.yml

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/workgraph-production-20260817
          fetch-depth: 0

      - name: Pin audited inputs and current branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object entroly-engine/src/work_graph.rs)" = "4cfa2d84123b53bc8d6a4b68e5d5431da9ac3a30"
          grep -q 'O_NOFOLLOW' entroly/work_graph_content_digest.py
          grep -q 'st_ino' entroly/work_graph_content_digest.py
          grep -q '_MAX_HASH_FILE_BYTES' entroly/work_graph_content_digest.py
          grep -q 'O_NOFOLLOW' entroly-wasm/js/work_graph_content_digest.js
          grep -q 'mtimeNs' entroly-wasm/js/work_graph_content_digest.js
          grep -q 'MAX_HASH_FILE_BYTES' entroly-wasm/js/work_graph_content_digest.js
          git rev-parse HEAD > /tmp/integration-start-head
          git fetch origin audit/workgraph-passive-dedupe-20260817:audit-passive
          test "$(git rev-parse audit-passive:scripts/apply_workgraph_passive_dedupe_v2.py)" = "d93f5a3c27eb9600fefd0c2d22db4a652cc6cfc7"

      - name: Apply audited passive-snapshot semantic patch
        shell: bash
        run: |
          set -euo pipefail
          git show audit-passive:scripts/apply_workgraph_passive_dedupe_v2.py > /tmp/apply_workgraph_passive_dedupe_v2.py
          python /tmp/apply_workgraph_passive_dedupe_v2.py
          test "$(git diff --name-only)" = "entroly-engine/src/work_graph.rs"
          git diff --check
          grep -q 'fn passive_repository_snapshot_fingerprint' entroly-engine/src/work_graph.rs
          grep -q 'identical_content_complete_passive_snapshots_do_not_grow_history' entroly-engine/src/work_graph.rs
          grep -q 'repeated_active_verification_is_never_collapsed' entroly-engine/src/work_graph.rs
          grep -q 'repeated_model_execution_is_never_collapsed' entroly-engine/src/work_graph.rs

      - name: Validate adapter digest parity
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_work_graph_content_digest.py \
            tests/test_work_graph_cross_language_digest_parity.py
          node entroly-wasm/test_work_graph_content_digest.js

      - name: Install Rust validation toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate shared Rust semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path entroly-engine/Cargo.toml
          cargo test --manifest-path entroly-engine/Cargo.toml --lib
          cargo clippy --manifest-path entroly-engine/Cargo.toml --all-targets -- -D warnings
          test "$(git diff --name-only)" = "entroly-engine/src/work_graph.rs"

      - name: Refuse races, remove validator, and push one product commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/workgraph-production-20260817
          test "$(cat /tmp/integration-start-head)" = "$(git rev-parse origin/integration/workgraph-production-20260817)"
          rm .github/workflows/integration-workgraph-passive-dedupe.yml
          git diff --check
          printf '%s\n' \
            '.github/workflows/integration-workgraph-passive-dedupe.yml' \
            'entroly-engine/src/work_graph.rs' > /tmp/expected-paths
          git diff --name-only | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git config user.name "entroly-integration-bot"
          git config user.email "208309368+juyterman1000@users.noreply.github.com"
          git add entroly-engine/src/work_graph.rs .github/workflows/integration-workgraph-passive-dedupe.yml
          git commit -m "fix(work-graph): dedupe content-complete passive snapshots"
          git push origin HEAD:integration/workgraph-production-20260817

name: PR278 identity repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr278-identity-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feat/distribution-control-plane'
    name: Rewrite repair commit provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/distribution-control-plane
          fetch-depth: 0

      - name: Verify exact repair commit and clean target
        shell: bash
        run: |
          set -euo pipefail
          target='c6cd0ff14cfbb6e98f239e6ce3f0b3edfa4764d7'
          test "$(git show -s --format=%s "$target")" = \
            'fix(distribution): align claim policy with honesty guard'
          test "$(git show -s --format=%ae "$target")" = \
            '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git show -s --format=%ce "$target")" = \
            '41898282+github-actions[bot]@users.noreply.github.com'
          test -z "$(git status --porcelain)"

      - name: Rewrite only the target commit identity
        shell: bash
        run: |
          set -euo pipefail
          target='c6cd0ff14cfbb6e98f239e6ce3f0b3edfa4764d7'
          old_head="$(git rev-parse HEAD)"
          before_tree="$(git rev-parse 'HEAD^{tree}')"
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f --env-filter "
            if [ \"\$GIT_COMMIT\" = '$target' ]; then
              export GIT_AUTHOR_NAME='juyterman1000'
              export GIT_AUTHOR_EMAIL='208309368+juyterman1000@users.noreply.github.com'
              export GIT_COMMITTER_NAME='juyterman1000'
              export GIT_COMMITTER_EMAIL='208309368+juyterman1000@users.noreply.github.com'
            fi
          " "${target}^..HEAD"
          new_head="$(git rev-parse HEAD)"
          after_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$new_head" != "$old_head"
          test "$after_tree" = "$before_tree"
          test -z "$(git status --porcelain)"
          if git log origin/main..HEAD \
            --format='%ae%n%ce' | grep -Fqx \
            '41898282+github-actions[bot]@users.noreply.github.com'; then
            echo 'github-actions bot identity still exists in the PR history' >&2
            exit 1
          fi
          git push \
            --force-with-lease="refs/heads/feat/distribution-control-plane:$old_head" \
            origin HEAD:refs/heads/feat/distribution-control-plane

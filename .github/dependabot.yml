version: 2

# Adding an ecosystem here is only half the change. The Dependabot exemption in
# .github/workflows/commit-identity-guard.yml is path-scoped, so every file the
# new ecosystem rewrites must also be listed in its dependency_path(). Miss that
# and nothing reports a misconfiguration -- the ecosystem opens pull requests
# that are rejected as an untrusted author, forever. The Gradle entry below was
# added without it, and #466 went red on the identity guard alone.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # MCP 2.x is a breaking SDK migration, not a compatible dependency bump:
      # FastMCP was renamed/removed and transport APIs changed. Keep production
      # on the tested 1.x contract until an explicit dual-major migration PR
      # proves the full MCP surface against 2.x.
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "cargo"
    directory: "/entroly-core"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The JetBrains plugin pins the IntelliJ Platform Gradle Plugin in
  # settings.gradle.kts. Without this entry that pin drifts unwatched: 2.18.1
  # carried a concurrency bug in InstrumentCodeTask (upstream #2193) that was
  # fixed in 2.19.0, and nothing surfaced the available upgrade.
  - package-ecosystem: "gradle"
    directory: "/extensions/jetbrains"
    schedule:
      interval: "weekly"
